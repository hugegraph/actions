name: "Publish hubble image(release)"

on:
  workflow_dispatch:
    inputs:
      source_repository:
        required: false
        default: 'apache/hugegraph-toolchain'
        description: 'source repository in owner/name format'
      source_ref:
        required: true
        default: ''
        description: 'source branch or tag; should contain a release version'
      image_tag:
        required: false
        default: ''
        description: 'release image tag; empty derives x.y.z from source ref'
      mvn_args:
        required: false
        default: ''
        description: 'mvn build args, like "MAVEN_ARGS=-P stage"'

jobs:
  publish:
    uses: ./.github/workflows/_publish_image_reusable.yml
    with:
      mode: release
      component: hubble
      source_repository: ${{ inputs.source_repository || 'apache/hugegraph-toolchain' }}
      allowed_source_repositories: apache/hugegraph-toolchain,hugegraph/hugegraph-toolchain
      source_ref: ${{ inputs.source_ref }}
      image_tag: ${{ inputs.image_tag || '' }}
      publish: true
      build_matrix_json: |
        [
          {
            "module": "hubble",
            "context": ".",
            "dockerfile": "./hugegraph-hubble/Dockerfile",
            "image_repo_latest": "hugegraph/hubble",
            "image_repo_release": "hugegraph/hubble",
            "registry_cache_image": "hugegraph/hubble:buildcache-release",
            "platforms_latest": "linux/amd64,linux/arm64",
            "platforms_release": "linux/amd64,linux/arm64",
            "smoke_test": false
          }
        ]
      use_mvn_args: true
      mvn_args: ${{ inputs.mvn_args }}
    secrets: inherit
