name: Publish HugeGraph Python

on:
  workflow_dispatch:
    inputs:
      component:
        description: Python component
        required: true
        type: choice
        default: client
        options: [client, mcp]
      source_repository:
        description: Source repository
        required: true
        type: choice
        default: apache/hugegraph-ai
        options: [apache/hugegraph-ai, hugegraph/hugegraph-ai]
      publish:
        description: Publish to selected registry (unchecked = test only)
        required: true
        type: boolean
        default: false
      source_ref:
        description: 'Source branch, tag, or commit SHA'
        required: true
        default: main
        type: string
      target:
        description: Package index and GitHub environment
        required: true
        type: choice
        default: testpypi
        options: [testpypi, pypi]
      test_version:
        description: 'Shared client/MCP TestPyPI version: x.y.z.n (e.g. 1.7.1.1). Leave empty for PyPI.'
        required: false
        type: string

permissions:
  contents: read

env:
  UV_VERSION: '0.12.18'
  COMPONENT: ${{ inputs.component }}
  SOURCE_REPOSITORY: ${{ inputs.source_repository }}
  UV_DEFAULT_INDEX: https://pypi.org/simple
  UV_NO_CONFIG: 'true'

jobs:
  build-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      version: ${{ steps.metadata.outputs.version }}
      manifest_sha: ${{ steps.manifest.outputs.manifest_sha }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Resolve immutable source
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: python .github/scripts/python_release.py resolve --source-ref "$SOURCE_REF" --source-repository "$SOURCE_REPOSITORY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ steps.resolve.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Validate and prepare package version
        id: metadata
        env:
          TARGET: ${{ inputs.target }}
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
          TEST_VERSION: ${{ inputs.test_version }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          python .github/scripts/python_release.py metadata --target "$TARGET" --test-version "$TEST_VERSION" --component "$COMPONENT"
      - name: Build and check distributions
        id: manifest
        env:
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
          VERSION: ${{ steps.metadata.outputs.version }}
          MODULE: ${{ steps.metadata.outputs.module }}
        run: |
          uv build --no-sources "source/$MODULE" --out-dir dist
          uvx --from twine==7.0.0 twine check --strict dist/*
          python .github/scripts/python_release.py manifest --sha "$SOURCE_SHA" --version "$VERSION" --component "$COMPONENT" --source-repository "$SOURCE_REPOSITORY"
      - name: Isolated wheel and sdist smoke and client tests
        if: inputs.component == 'client'
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          uv python install 3.10 3.11
          for version in 3.10 3.11; do
            for artifact in "$GITHUB_WORKSPACE"/dist/*.whl "$GITHUB_WORKSPACE"/dist/*.tar.gz; do
              scratch=$(mktemp -d)
              uv venv --python "$version" "$scratch/venv"
              uv pip install --python "$scratch/venv/bin/python" "$artifact"
              (
                cd "$scratch"
                "$scratch/venv/bin/python" -I -c 'import importlib.metadata as m, os; from pyhugegraph.client import PyHugeClient; assert m.version("hugegraph-python") == os.environ["VERSION"]'
                uv pip install --python "$scratch/venv/bin/python" 'pytest==8.4.2'
                cp -R "$GITHUB_WORKSPACE/source/hugegraph-python-client/src/tests" "$scratch/tests"
                "$scratch/venv/bin/python" -m pytest tests -m 'unit or contract' -v --tb=short
              )
            done
          done
      - name: Resolve published TestPyPI client
        if: inputs.component == 'mcp' && inputs.target == 'testpypi'
        id: test-client
        env:
          TEST_VERSION: ${{ inputs.test_version }}
        run: python .github/scripts/python_release.py test-client --version "$TEST_VERSION"
      - name: Isolated MCP wheel, sdist and uvx smoke
        if: inputs.component == 'mcp'
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          CLIENT_REQUIREMENT: ${{ steps.test-client.outputs.client_requirement }}
        run: |
          client_args=()
          uvx_args=()
          if [ -n "$CLIENT_REQUIREMENT" ]; then
            client_args=("$CLIENT_REQUIREMENT")
            uvx_args=(--with "$CLIENT_REQUIREMENT")
            echo 'Dependency check: pinned TestPyPI client wheel; all other dependencies from PyPI.'
          else
            echo 'Dependency check: all dependencies from public PyPI.'
          fi
          uv python install 3.10 3.11
          for version in 3.10 3.11; do
            for artifact in "$GITHUB_WORKSPACE"/dist/*.whl "$GITHUB_WORKSPACE"/dist/*.tar.gz; do
              scratch=$(mktemp -d)
              uv venv --python "$version" "$scratch/venv"
              uv pip install --python "$scratch/venv/bin/python" "$artifact" "${client_args[@]}"
              (
                cd "$scratch"
                "$scratch/venv/bin/python" -I -c 'import importlib.metadata as m, os; assert m.version("hugegraph-mcp") == os.environ["VERSION"]; print("Installed client:", m.version("hugegraph-python"))'
                uv pip install --python "$scratch/venv/bin/python" 'pytest==8.4.2'
                mkdir client-contracts
                cp "$GITHUB_WORKSPACE/source/hugegraph-python-client/src/tests/api/test_vertex_id_format.py" \
                  "$GITHUB_WORKSPACE/source/hugegraph-python-client/src/tests/api/test_schema_contract.py" \
                  "$GITHUB_WORKSPACE/source/hugegraph-python-client/src/tests/test_distribution.py" client-contracts/
                "$scratch/venv/bin/python" -I -m pytest --confcutdir="$scratch/client-contracts" client-contracts -v --tb=short
                "$scratch/venv/bin/python" -I "$GITHUB_WORKSPACE/source/hugegraph-mcp/tests/distribution_smoke.py" -- "$scratch/venv/bin/hugegraph-mcp"
              )
            done
          done
          scratch=$(mktemp -d)
          (
            cd "$scratch"
            for artifact in "$GITHUB_WORKSPACE"/dist/*.whl; do
              python3.11 -I "$GITHUB_WORKSPACE/source/hugegraph-mcp/tests/distribution_smoke.py" -- \
                uvx --python 3.11 --no-config --no-cache --index-url https://pypi.org/simple --from "$artifact" "${uvx_args[@]}" hugegraph-mcp
            done
          )
      - name: Verify artifacts unchanged after tests
        env:
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
          VERSION: ${{ steps.metadata.outputs.version }}
          MANIFEST_SHA: ${{ steps.manifest.outputs.manifest_sha }}
        run: python .github/scripts/python_release.py verify --sha "$SOURCE_SHA" --version "$VERSION" --component "$COMPONENT" --source-repository "$SOURCE_REPOSITORY" --manifest-sha "$MANIFEST_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: python-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: inputs.publish
    needs: build-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.target }}
    concurrency:
      group: python-publish-${{ inputs.component }}-${{ inputs.target }}-${{ needs.build-check.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-check.outputs.artifact_id }}
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Verify all files, preflight hashes, and publish missing artifacts
        env:
          SOURCE_SHA: ${{ needs.build-check.outputs.source_sha }}
          VERSION: ${{ needs.build-check.outputs.version }}
          MANIFEST_SHA: ${{ needs.build-check.outputs.manifest_sha }}
          TARGET: ${{ inputs.target }}
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python .github/scripts/python_release.py publish --sha "$SOURCE_SHA" \
            --version "$VERSION" --component "$COMPONENT" --source-repository "$SOURCE_REPOSITORY" --manifest-sha "$MANIFEST_SHA" --target "$TARGET"
