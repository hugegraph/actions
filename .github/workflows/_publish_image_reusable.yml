name: "Publish image (reusable)"

on:
  workflow_call:
    inputs:
      mode:
        description: "publish mode: latest or release"
        required: true
        type: string
      component:
        description: "component name for cache scope"
        required: true
        type: string
      source_repository:
        description: "source repository in owner/name format"
        required: true
        type: string
      allowed_source_repositories:
        description: "comma-separated trusted source repositories"
        required: true
        type: string
      source_ref:
        description: "source branch, tag, or commit"
        required: true
        type: string
      default_source:
        description: "default source in owner/name@ref format"
        required: false
        default: ''
        type: string
      image_tag:
        description: "published image tag; empty derives from mode and source ref"
        required: false
        default: ''
        type: string
      publish:
        description: "publish images and registry caches"
        required: false
        default: false
        type: boolean
      build_matrix_json:
        description: "build matrix JSON array"
        required: true
        type: string
      use_mvn_args:
        description: "whether to pass mvn args to build-args"
        required: false
        default: false
        type: boolean
      mvn_args:
        description: "mvn build args"
        required: false
        default: ''
        type: string
      enable_hash_gate:
        description: "whether to skip latest publish if source hash unchanged"
        required: false
        default: false
        type: boolean
      last_hash_value:
        description: "last published source hash"
        required: false
        default: ''
        type: string
      last_hash_name:
        description: "repo variable name for latest hash"
        required: false
        default: ''
        type: string
      hash_repo_owner:
        description: "owner of repo storing LAST_* hash variable"
        required: false
        default: 'hugegraph'
        type: string
      hash_repo_name:
        description: "repo name storing LAST_* hash variable"
        required: false
        default: 'actions'
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_PASSWORD:
        required: true
      PERSONAL_ACCESS_TOKEN:
        required: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      need_update: ${{ steps.prepare.outputs.need_update }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      checkout_ref: ${{ steps.prepare.outputs.checkout_ref }}
      version_tag: ${{ steps.prepare.outputs.version_tag }}
      publish_images: ${{ steps.prepare.outputs.publish_images }}
      hash_gate_applied: ${{ steps.prepare.outputs.hash_gate_applied }}
    steps:
    - name: Resolve mode and source ref
      id: prepare
      env:
        MODE: ${{ inputs.mode }}
        SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        ALLOWED_SOURCE_REPOSITORIES: ${{ inputs.allowed_source_repositories }}
        SOURCE_REF: ${{ inputs.source_ref }}
        DEFAULT_SOURCE: ${{ inputs.default_source }}
        REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        PUBLISH: ${{ inputs.publish }}
        ENABLE_HASH_GATE: ${{ inputs.enable_hash_gate }}
        LAST_HASH_VALUE: ${{ inputs.last_hash_value }}
      run: |
        set -euo pipefail

        if [ "$MODE" != "latest" ] && [ "$MODE" != "release" ]; then
          echo "Invalid mode: $MODE. Expected latest or release."
          exit 1
        fi

        source_repository_allowed="false"
        IFS=',' read -ra allowed_repositories <<< "$ALLOWED_SOURCE_REPOSITORIES"
        for allowed_repository in "${allowed_repositories[@]}"; do
          if [ "$SOURCE_REPOSITORY" = "$allowed_repository" ]; then
            source_repository_allowed="true"
            break
          fi
        done
        if [ "$source_repository_allowed" != "true" ]; then
          echo "Source repository is not allowed: $SOURCE_REPOSITORY"
          exit 1
        fi

        if ! [[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
          if ! git check-ref-format "refs/heads/$SOURCE_REF" >/dev/null 2>&1 \
            && ! git check-ref-format "refs/tags/$SOURCE_REF" >/dev/null 2>&1; then
            echo "Invalid source ref: $SOURCE_REF"
            exit 1
          fi
        fi

        default_repository="${DEFAULT_SOURCE%@*}"
        default_ref="${DEFAULT_SOURCE#*@}"
        default_source_match="false"
        if [ -n "$DEFAULT_SOURCE" ] \
          && [ "$SOURCE_REPOSITORY" = "$default_repository" ] \
          && [ "$SOURCE_REF" = "$default_ref" ]; then
          default_source_match="true"
        fi

        source_url="https://github.com/${SOURCE_REPOSITORY}.git"
        source_sha="$(git ls-remote "$source_url" "refs/heads/${SOURCE_REF}" \
          | awk 'NR == 1 { print $1 }')"
        if [ -z "$source_sha" ]; then
          source_sha="$(git ls-remote "$source_url" "refs/tags/${SOURCE_REF}^{}" \
            | awk 'NR == 1 { print $1 }')"
        fi
        if [ -z "$source_sha" ]; then
          source_sha="$(git ls-remote "$source_url" "refs/tags/${SOURCE_REF}" \
            | awk 'NR == 1 { print $1 }')"
        fi
        if [ -z "$source_sha" ] && [[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
          source_sha="$SOURCE_REF"
        fi
        if [ -z "$source_sha" ]; then
          echo "Failed to resolve source SHA for ${SOURCE_REPOSITORY}@${SOURCE_REF}"
          exit 1
        fi

        checkout_ref="$source_sha"
        publish_images="$PUBLISH"
        hash_gate_applied="false"

        if [ "$MODE" = "latest" ]; then
          if [ -n "$REQUESTED_IMAGE_TAG" ]; then
            version_tag="$REQUESTED_IMAGE_TAG"
          else
            version_tag="$(
              printf '%s' "$SOURCE_REF" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//' \
              | cut -c1-110
            )"
            if [ "$default_source_match" = "true" ]; then
              version_tag="latest"
            fi
          fi
          if [ -z "$version_tag" ]; then
            echo "Failed to derive an image tag from source ref: $SOURCE_REF"
            exit 1
          fi
          need_update="true"
          if [ "$PUBLISH" = "true" ] && [ "$ENABLE_HASH_GATE" = "true" ] \
            && [ -z "$REQUESTED_IMAGE_TAG" ] \
            && [ "$default_source_match" = "true" ]; then
            hash_gate_applied="true"
          fi
          if [ "$hash_gate_applied" = "true" ] && [ "$source_sha" = "$LAST_HASH_VALUE" ]; then
            need_update="false"
          fi
        else
          version_tag="${REQUESTED_IMAGE_TAG:-$(echo "$SOURCE_REF" \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)}"
          if ! [[ "$version_tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release image_tag: $version_tag. Expected x.y.z."
            exit 1
          fi
          need_update="true"
        fi

        if ! [[ "$version_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
          echo "Invalid image tag: $version_tag"
          exit 1
        fi
        if [ "$MODE" = "latest" ] && [ "$PUBLISH" = "true" ] \
          && [ "$default_source_match" != "true" ] \
          && [ -z "$REQUESTED_IMAGE_TAG" ]; then
          echo "image_tag is required when publishing a non-default source"
          exit 1
        fi

        {
          echo "source_sha=$source_sha"
          echo "checkout_ref=$checkout_ref"
          echo "version_tag=$version_tag"
          echo "publish_images=$publish_images"
          echo "need_update=$need_update"
          echo "hash_gate_applied=$hash_gate_applied"
        } >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    if: ${{ needs.prepare.outputs.need_update == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.build_matrix_json) }}
    steps:
    - name: Resolve build parameters (${{ matrix.module }})
      id: params
      env:
        MODE: ${{ inputs.mode }}
        VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
        COMPONENT: ${{ inputs.component }}
        MODULE: ${{ matrix.module }}
        IMAGE_REPO_LATEST: ${{ matrix.image_repo_latest }}
        IMAGE_REPO_RELEASE: ${{ matrix.image_repo_release }}
        PLATFORMS_LATEST: ${{ matrix.platforms_latest }}
        PLATFORMS_RELEASE: ${{ matrix.platforms_release }}
        REGISTRY_CACHE_IMAGE: ${{ matrix.registry_cache_image || '' }}
        PUBLISH_IMAGES: ${{ needs.prepare.outputs.publish_images }}
      run: |
        set -euo pipefail

        image_repo="$IMAGE_REPO_LATEST"
        platforms="$PLATFORMS_LATEST"
        if [ "$MODE" = "release" ]; then
          image_repo="$IMAGE_REPO_RELEASE"
          platforms="$PLATFORMS_RELEASE"
        fi

        if [ -z "$image_repo" ] || [ -z "$platforms" ]; then
          echo "Missing image repo or platforms for module: $MODULE"
          exit 1
        fi

        image_url="${image_repo}:${VERSION_TAG}"
        cache_scope="${COMPONENT}-${MODULE}"

        cache_reference="$cache_scope"
        if [ -n "$REGISTRY_CACHE_IMAGE" ]; then
          cache_image="$REGISTRY_CACHE_IMAGE"
          if [ "$MODE" = "latest" ] && [ "$VERSION_TAG" != "latest" ]; then
            cache_channel="$VERSION_TAG"
            if [ "${#cache_channel}" -gt 117 ]; then
              cache_hash="$(printf '%s' "$cache_channel" | sha256sum | cut -c1-12)"
              cache_channel="${cache_channel:0:104}-${cache_hash}"
            fi
            if [ "$PUBLISH_IMAGES" = "true" ]; then
              cache_image="${REGISTRY_CACHE_IMAGE%:buildcache-latest}:buildcache-${cache_channel}"
            fi
          fi
          cache_reference="$cache_image"
          cache_from="type=registry,ref=${cache_image}"
          cache_to_min="type=registry,ref=${cache_image},mode=min"
          cache_to_max="type=registry,ref=${cache_image},mode=max"
          cache_backend="registry"
        else
          cache_from="type=gha,scope=${cache_scope}"
          cache_to_min="type=gha,scope=${cache_scope},mode=min"
          cache_to_max="type=gha,scope=${cache_scope},mode=max"
          cache_backend="gha"
        fi

        if [ "$PUBLISH_IMAGES" != "true" ]; then
          cache_to_min=""
          cache_to_max=""
        fi

        {
          echo "image_url=$image_url"
          echo "platforms=$platforms"
          echo "cache_scope=$cache_scope"
          echo "cache_from=$cache_from"
          echo "cache_to_min=$cache_to_min"
          echo "cache_to_max=$cache_to_max"
          echo "cache_backend=$cache_backend"
        } >> "$GITHUB_OUTPUT"

        {
          echo "### Build parameters: ${MODULE}"
          echo
          echo "| Image | Platforms | Cache backend | Cache reference |"
          echo "| --- | --- | --- | --- |"
          echo "| \`${image_url}\` | \`${platforms}\` | \`${cache_backend}\` | \`${cache_reference}\` |"
          echo
          echo "- Publish images: \`${PUBLISH_IMAGES}\`"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Checkout source (${{ matrix.module }})
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.source_repository }}
        ref: ${{ needs.prepare.outputs.checkout_ref }}
        fetch-depth: 2
        persist-credentials: false

    - name: Set up QEMU (${{ matrix.module }})
      if: ${{ contains(steps.params.outputs.platforms, 'arm64') }}
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx (${{ matrix.module }})
      uses: docker/setup-buildx-action@v4
      with:
        version: latest

    - name: Login to Docker Hub (${{ matrix.module }})
      if: ${{ needs.prepare.outputs.publish_images == 'true' }}
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Build x86 image for smoke test with mvn args (${{ matrix.module }})
      if: ${{ matrix.smoke_test && inputs.use_mvn_args }}
      uses: docker/build-push-action@v7
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64
        load: true
        tags: ${{ steps.params.outputs.image_url }}
        cache-from: ${{ steps.params.outputs.cache_from }}
        cache-to: ${{ steps.params.outputs.cache_to_min }}
        build-args: ${{ inputs.mvn_args }}

    - name: Build x86 image for smoke test (${{ matrix.module }})
      if: ${{ matrix.smoke_test && !inputs.use_mvn_args }}
      uses: docker/build-push-action@v7
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.dockerfile }}
        platforms: linux/amd64
        load: true
        tags: ${{ steps.params.outputs.image_url }}
        cache-from: ${{ steps.params.outputs.cache_from }}
        cache-to: ${{ steps.params.outputs.cache_to_min }}

    - name: Run smoke test (${{ matrix.module }})
      if: ${{ matrix.smoke_test }}
      env:
        IMAGE_URL: ${{ steps.params.outputs.image_url }}
        SMOKE_TEST_CMD: ${{ matrix.smoke_test_cmd }}
      run: |
        set -euo pipefail
        if [ -z "$SMOKE_TEST_CMD" ]; then
          echo "smoke_test_cmd is empty while smoke_test=true"
          exit 1
        fi
        bash -euo pipefail -c "$SMOKE_TEST_CMD"

    - name: Cleanup smoke test container (${{ matrix.module }})
      if: ${{ always() && matrix.smoke_test }}
      run: |
        docker rm -f graph || true

    - name: Build and push image with mvn args (${{ matrix.module }})
      if: ${{ inputs.use_mvn_args }}
      uses: docker/build-push-action@v7
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.dockerfile }}
        platforms: ${{ steps.params.outputs.platforms }}
        push: ${{ needs.prepare.outputs.publish_images == 'true' }}
        tags: ${{ steps.params.outputs.image_url }}
        cache-from: ${{ steps.params.outputs.cache_from }}
        cache-to: ${{ steps.params.outputs.cache_to_max }}
        build-args: ${{ inputs.mvn_args }}

    - name: Build and push image (${{ matrix.module }})
      if: ${{ !inputs.use_mvn_args }}
      uses: docker/build-push-action@v7
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.dockerfile }}
        platforms: ${{ steps.params.outputs.platforms }}
        push: ${{ needs.prepare.outputs.publish_images == 'true' }}
        tags: ${{ steps.params.outputs.image_url }}
        cache-from: ${{ steps.params.outputs.cache_from }}
        cache-to: ${{ steps.params.outputs.cache_to_max }}

  update_latest_hash:
    needs: [prepare, publish]
    if: ${{ inputs.mode == 'latest' && needs.prepare.outputs.hash_gate_applied == 'true' && needs.prepare.outputs.need_update == 'true' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - name: Validate hash update inputs
      env:
        LAST_HASH_NAME: ${{ inputs.last_hash_name }}
        PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      run: |
        set -euo pipefail
        if [ -z "$LAST_HASH_NAME" ]; then
          echo "last_hash_name is required when enable_hash_gate=true"
          exit 1
        fi
        if [ -z "$PERSONAL_ACCESS_TOKEN" ]; then
          echo "PERSONAL_ACCESS_TOKEN is required to update latest hash"
          exit 1
        fi

    - name: Update latest source hash variable
      env:
        OWNER: ${{ inputs.hash_repo_owner }}
        REPO: ${{ inputs.hash_repo_name }}
        LAST_HASH_NAME: ${{ inputs.last_hash_name }}
        SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      run: |
        set -euo pipefail
        curl --fail-with-body -sS -L -X PATCH \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          -H "Authorization: Bearer $PERSONAL_ACCESS_TOKEN" \
          "https://api.github.com/repos/$OWNER/$REPO/actions/variables/$LAST_HASH_NAME" \
          -d '{"name":"'"$LAST_HASH_NAME"'","value":"'"$SOURCE_SHA"'"}'
