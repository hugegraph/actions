name: Verify rag-bin Nuitka compatibility

on:
  push:
    branches:
      - test/rag-bin-nuitka-compat-20261104

permissions:
  contents: read

jobs:
  build-rag-bin:
    runs-on: ubuntu-24.04
    # A successful standalone Nuitka build takes materially longer than the
    # original failing parse, so the compatibility proof must cover the full
    # compile, image load, and executable inspection rather than stop at the
    # former assertion point.
    timeout-minutes: 90
    steps:
      - name: Checkout fixed HugeGraph AI source
        uses: actions/checkout@v7
        with:
          repository: hugegraph/hugegraph-ai
          ref: ce32dc8f7d9aefb45f11355e71461457ffdd49d6
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ce32dc8f7d9aefb45f11355e71461457ffdd49d6"
          grep -qF 'nk-llm = ["hugegraph-llm", "hugegraph-python", "nuitka"]' pyproject.toml
          grep -qF 'python docker/patch_litellm_nuitka.py' docker/Dockerfile.nk
          test -f docker/patch_litellm_nuitka.py

      - name: Test the guarded source rewrite
        run: python3 -m unittest discover -s scripts/tests -p 'test_patch_litellm_nuitka.py' -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Build the same rag-bin Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.nk
          platforms: linux/amd64
          push: false
          load: true
          tags: hugegraph/rag-bin:nuitka-compat-test
          cache-from: |
            type=registry,ref=hugegraph/rag-bin:buildcache-latest
            type=gha,scope=rag-bin-nuitka-compat-v4
          cache-to: type=gha,scope=rag-bin-nuitka-compat-v4,mode=min

      - name: Inspect compiled image
        run: |
          set -euo pipefail
          docker image inspect hugegraph/rag-bin:nuitka-compat-test >/dev/null
          docker run --rm --entrypoint /bin/sh hugegraph/rag-bin:nuitka-compat-test -c \
            'test -x /home/work/hugegraph-llm/app.dist/app.bin && python --version'
