name: Image publisher checks

on:
  pull_request:
    paths:
      - '.github/scripts/benchmark_ai_images.py'
      - '.github/workflows/_publish_image_reusable.yml'
      - '.github/workflows/benchmark_ai_images.yml'
      - '.github/workflows/publish_latest_vermeer_image.yml'
      - '.github/workflows/check_image_publisher.yml'
      - 'tests/test_ai_image_benchmark.py'
      - 'tests/test_vermeer_publisher.py'
      - 'tests/test_smoke_timeout.py'
      - 'tests/test_publish_prepare.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-publisher-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      benchmark: ${{ steps.changes.outputs.benchmark }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select optional checks
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          benchmark=false
          if [ "$EVENT_NAME" = pull_request ] && \
             git diff --name-only "$BASE_SHA" "$HEAD_SHA" | \
               grep -Eq '^(\.github/scripts/benchmark_ai_images\.py|\.github/workflows/benchmark_ai_images\.yml)$'; then
            benchmark=true
          fi
          echo "benchmark=$benchmark" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.3
      - name: Verify publication provenance and source gates
        run: |
          python -m unittest discover -s tests -p 'test_ai_image_benchmark.py' -v
          python -m unittest discover -s tests -p 'test_vermeer_publisher.py' -v
          python -m unittest discover -s tests -p 'test_smoke_timeout.py' -v
          bash tests/test_publish_prepare.sh

  benchmark:
    needs: checks
    if: ${{ needs.checks.outputs.benchmark == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate benchmark environment
        run: |
          docker version
          python3 -m py_compile .github/scripts/benchmark_ai_images.py
          python3 .github/scripts/benchmark_ai_images.py --help >/dev/null
      - name: Benchmark published images
        run: >-
          python3 .github/scripts/benchmark_ai_images.py
          --image rag=hugegraph/rag:latest
          --image rag-bin=hugegraph/rag-bin:latest
          --rounds 3
          --output ai-image-benchmark.json
      - name: Upload benchmark result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-image-benchmark
          path: ai-image-benchmark.json
          if-no-files-found: warn
          retention-days: 14
