name: Show rag-bin Ruff fix

on:
  push:
    branches:
      - test/rag-bin-nuitka-compat-20261104

permissions:
  contents: read

jobs:
  show-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout final HugeGraph AI head
        uses: actions/checkout@v7
        with:
          repository: hugegraph/hugegraph-ai
          ref: ce32dc8f7d9aefb45f11355e71461457ffdd49d6
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply repository Ruff import fix and print diff
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'ruff==0.17.3'
          ruff check --select I001 --fix scripts/tests/test_patch_litellm_nuitka.py
          git diff -- scripts/tests/test_patch_litellm_nuitka.py
          test -n "$(git diff -- scripts/tests/test_patch_litellm_nuitka.py)"
