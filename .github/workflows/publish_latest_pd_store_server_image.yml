name: "Publish pd-store-server image(latest)"

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      source_repository:
        required: false
        default: 'apache/hugegraph'
        description: 'source repository in owner/name format'
      source_ref:
        required: false
        default: 'master'
        description: 'source branch or tag; non-default refs run validation unless publish is enabled'
      image_tag:
        required: false
        default: ''
        description: 'image tag; empty derives latest or the source ref'
      publish:
        type: boolean
        required: false
        default: false
        description: 'publish a non-default source ref'
      mvn_args:
        required: false
        default: ''
        description: 'mvn build args, like "MAVEN_ARGS=-P stage"'
      strict_mode:
        type: boolean
        required: false
        default: true
        description: 'whether integration precheck is mandatory before publish'
      dry_run:
        type: boolean
        required: false
        default: false
        description: 'build and validate master without publishing images or updating the hash'
      wait_timeout_sec:
        required: false
        default: '300'
        description: 'docker compose wait timeout in seconds for precheck/self-check'

concurrency:
  group: publish-latest-pd-store-server
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/_publish_pd_store_server_reusable.yml
    with:
      mode: latest
      source_repository: ${{ inputs.source_repository || 'apache/hugegraph' }}
      source_ref: ${{ inputs.source_ref || 'master' }}
      image_tag: ${{ inputs.image_tag || '' }}
      publish: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish == true || (inputs.source_ref || 'master') == 'master') && !(inputs.dry_run == true) }}
      mvn_args: ${{ github.event.inputs.mvn_args || '' }}
      strict_mode: ${{ github.event_name != 'workflow_dispatch' || (inputs.source_ref || 'master') != 'master' || inputs.strict_mode == true }}
      dry_run: ${{ inputs.dry_run == true }}
      wait_timeout_sec: ${{ github.event.inputs.wait_timeout_sec || '300' }}
      enable_hash_gate: ${{ (github.event_name != 'workflow_dispatch' || (inputs.source_ref || 'master') == 'master') && !(inputs.dry_run == true) }}
      last_hash_value: ${{ vars.LAST_SERVER_HASH }}
      last_hash_name: LAST_SERVER_HASH
      hash_repo_owner: hugegraph
      hash_repo_name: actions
    secrets: inherit
