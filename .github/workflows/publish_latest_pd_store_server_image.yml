name: "Publish pd-store-server image(latest)"

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      source_repository:
        required: false
        default: 'apache/hugegraph'
        description: 'Source repo owner/name'
      source_ref:
        required: false
        default: 'master'
        description: 'Source branch/tag/commit'
      image_tag:
        required: false
        default: ''
        description: 'Docker image tag'
      publish:
        type: boolean
        required: false
        default: true
        description: 'Push images to Dockerhub'
      runtime_variant:
        type: choice
        options: [standard, topling]
        default: standard
        description: 'RocksDB runtime (Topling is amd64 only; adds -topling to image tag)'
      topling_jni_url:
        required: false
        default: ''
        description: 'Optional JNI URL override; empty uses the source pin'
      topling_jni_sha256:
        required: false
        default: ''
        description: 'Trusted SHA-256 matching the JNI URL override'
      mvn_args:
        required: false
        default: ''
        description: 'Docker build args, one NAME=VALUE entry per line'
      wait_timeout_sec:
        required: false
        default: '300'
        description: 'Precheck timeout in seconds'

concurrency:
  group: publish-latest-pd-store-server
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/_publish_pd_store_server_reusable.yml
    with:
      runtime_variant: ${{ inputs.runtime_variant || 'standard' }}
      topling_jni_url: ${{ inputs.topling_jni_url || '' }}
      topling_jni_sha256: ${{ inputs.topling_jni_sha256 || '' }}
      mode: latest
      source_repository: ${{ inputs.source_repository || 'apache/hugegraph' }}
      allowed_source_repositories: apache/hugegraph,hugegraph/hugegraph
      source_ref: ${{ inputs.source_ref || 'master' }}
      default_source: apache/hugegraph@master
      image_tag: ${{ inputs.image_tag || '' }}
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish == true }}
      mvn_args: ${{ github.event.inputs.mvn_args || '' }}
      strict_mode: true
      dry_run: false
      wait_timeout_sec: ${{ github.event.inputs.wait_timeout_sec || '300' }}
      enable_hash_gate: ${{ github.event_name != 'workflow_dispatch' || ((inputs.source_repository || 'apache/hugegraph') == 'apache/hugegraph' && (inputs.source_ref || 'master') == 'master' && (inputs.image_tag || '') == '') }}
      last_hash_value: ${{ vars.LAST_SERVER_HASH }}
      last_hash_name: LAST_SERVER_HASH
      hash_repo_owner: hugegraph
      hash_repo_name: actions
    secrets: inherit
