name: "Publish Vermeer Image(release)"

on:
  workflow_dispatch:
    inputs:
      source_repository:
        required: false
        default: 'apache/hugegraph-computer'
        description: 'source repository in owner/name format'
      source_ref:
        required: true
        default: ''
        description: 'source branch or tag; should contain a release version'
      image_tag:
        required: false
        default: ''
        description: 'release image tag; empty derives x.y.z from source ref'

jobs:
  publish:
    uses: ./.github/workflows/_publish_image_reusable.yml
    with:
      mode: release
      component: vermeer
      source_repository: ${{ inputs.source_repository || 'apache/hugegraph-computer' }}
      source_ref: ${{ inputs.source_ref }}
      image_tag: ${{ inputs.image_tag || '' }}
      publish: true
      build_matrix_json: |
        [
          {
            "module": "vermeer",
            "context": "./vermeer",
            "dockerfile": "./vermeer/Dockerfile",
            "image_repo_latest": "hugegraph/vermeer",
            "image_repo_release": "hugegraph/vermeer",
            "registry_cache_image": "hugegraph/vermeer:buildcache-release",
            "platforms_latest": "linux/amd64,linux/arm64",
            "platforms_release": "linux/amd64,linux/arm64",
            "smoke_test": false
          }
        ]
    secrets: inherit
