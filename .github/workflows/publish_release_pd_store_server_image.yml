name: "Publish pd-store-server image(release)"

on:
  workflow_dispatch:
    inputs:
      source_repository:
        required: false
        default: 'apache/hugegraph'
        description: 'source repository in owner/name format'
      source_ref:
        required: true
        default: 'master'
        description: 'source branch or tag used to build the release images'
      image_tag:
        required: true
        default: ''
        description: 'image version tag, for example 1.7.0'
      mvn_args:
        required: false
        default: ''
        description: 'mvn build args, like "MAVEN_ARGS=-P stage"'
      strict_mode:
        type: boolean
        required: false
        default: true
        description: 'whether integration precheck is mandatory before publish'
      wait_timeout_sec:
        required: false
        default: '300'
        description: 'docker compose wait timeout in seconds for precheck/self-check'

concurrency:
  group: publish-release-pd-store-server
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/_publish_pd_store_server_reusable.yml
    with:
      mode: release
      source_repository: ${{ inputs.source_repository || 'apache/hugegraph' }}
      allowed_source_repositories: apache/hugegraph,hugegraph/hugegraph
      source_ref: ${{ inputs.source_ref }}
      image_tag: ${{ inputs.image_tag }}
      publish: true
      mvn_args: ${{ inputs.mvn_args }}
      strict_mode: ${{ inputs.strict_mode }}
      wait_timeout_sec: ${{ inputs.wait_timeout_sec || '300' }}
      enable_hash_gate: false
    secrets: inherit
