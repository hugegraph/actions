name: Verify rag-bin Nuitka minimal reproducer

on:
  push:
    branches:
      - test/rag-bin-nuitka-compat-20261104

permissions:
  contents: read

jobs:
  reproduce-and-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout final HugeGraph AI fix
        uses: actions/checkout@v7
        with:
          repository: hugegraph/hugegraph-ai
          ref: 4882f98c621f27bda0416d5e2dc9730617e79ddb
          fetch-depth: 1
          persist-credentials: false

      - name: Set up the failing compiler version
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install exact Nuitka version
        run: python -m pip install --disable-pip-version-check 'nuitka==4.3.4'

      - name: Fetch exact LiteLLM 1.106.6 source
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/streaming_chunk_builder_utils.py \
            https://raw.githubusercontent.com/BerriAI/litellm/61c6ab78393ef45683dd7d963d2a315bd845e20b/litellm/litellm_core_utils/streaming_chunk_builder_utils.py
          grep -qF 'case StreamingChoices(delta=Delta(role=str() as role)) | {"delta": {"role": str() as role}} if role:' \
            /tmp/streaming_chunk_builder_utils.py

      - name: Reproduce the original Nuitka assertion
        run: |
          set -euo pipefail
          mkdir -p /tmp/original-out
          set +e
          python -m nuitka --module --nofollow-imports \
            --output-dir=/tmp/original-out \
            /tmp/streaming_chunk_builder_utils.py \
            >/tmp/original-nuitka.log 2>&1
          status=$?
          set -e
          cat /tmp/original-nuitka.log
          test "$status" -ne 0
          grep -qF 'assert or_assignments is not None' /tmp/original-nuitka.log

      - name: Apply the reviewed builder-only fix
        run: |
          set -euo pipefail
          python docker/patch_litellm_nuitka.py --path /tmp/streaming_chunk_builder_utils.py
          ! grep -qF 'case StreamingChoices(delta=Delta(role=str() as role)) | {"delta": {"role": str() as role}} if role:' \
            /tmp/streaming_chunk_builder_utils.py
          grep -qF 'case StreamingChoices(delta=Delta(role=str() as role)):' \
            /tmp/streaming_chunk_builder_utils.py

      - name: Compile the patched source with the same Nuitka
        run: |
          set -euo pipefail
          mkdir -p /tmp/patched-out
          python -m nuitka --module --nofollow-imports \
            --output-dir=/tmp/patched-out \
            /tmp/streaming_chunk_builder_utils.py
          find /tmp/patched-out -maxdepth 1 -type f -name 'streaming_chunk_builder_utils*.so' -print -quit \
            | grep -q .
