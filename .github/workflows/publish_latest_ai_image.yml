name: "Publish AI Image(latest)"

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      source_repository:
        required: false
        default: 'apache/hugegraph-ai'
        description: 'Source repo owner/name'
      source_ref:
        required: false
        default: 'main'
        description: 'Source branch/tag/commit'
      image_tag:
        required: false
        default: ''
        description: 'Docker image tag'
      publish:
        type: boolean
        required: false
        default: false
        description: 'Push images to Dockerhub'

jobs:
  publish:
    uses: ./.github/workflows/_publish_image_reusable.yml
    with:
      mode: latest
      component: ai
      source_repository: ${{ inputs.source_repository || 'apache/hugegraph-ai' }}
      allowed_source_repositories: apache/hugegraph-ai,hugegraph/hugegraph-ai
      source_ref: ${{ inputs.source_ref || 'main' }}
      default_source: apache/hugegraph-ai@main
      image_tag: ${{ inputs.image_tag || '' }}
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish == true }}
      # IMPORTANT:
      # - Keep ARM enabled for normal RAG image (Dockerfile.llm).
      # - Keep rag-bin (Dockerfile.nk) on amd64 only due to arm incompatibility.
      build_matrix_json: |
        [
          {
            "module": "rag",
            "context": ".",
            "dockerfile": "./docker/Dockerfile.llm",
            "image_repo_latest": "hugegraph/rag",
            "image_repo_release": "hugegraph/rag",
            "registry_cache_image": "hugegraph/rag:buildcache-latest",
            "platforms_latest": "linux/amd64,linux/arm64",
            "platforms_release": "linux/amd64,linux/arm64",
            "smoke_test": false
          },
          {
            "module": "rag-bin",
            "context": ".",
            "dockerfile": "./docker/Dockerfile.nk",
            "image_repo_latest": "hugegraph/rag-bin",
            "image_repo_release": "hugegraph/rag-bin",
            "registry_cache_image": "hugegraph/rag-bin:buildcache-latest",
            "platforms_latest": "linux/amd64",
            "platforms_release": "linux/amd64",
            "smoke_test": false
          }
        ]
      enable_hash_gate: ${{ github.event_name != 'workflow_dispatch' || ((inputs.source_repository || 'apache/hugegraph-ai') == 'apache/hugegraph-ai' && (inputs.source_ref || 'main') == 'main' && (inputs.image_tag || '') == '') }}
      last_hash_value: ${{ vars.LAST_AI_HASH }}
      last_hash_name: LAST_AI_HASH
      hash_repo_owner: hugegraph
      hash_repo_name: actions
    secrets: inherit
