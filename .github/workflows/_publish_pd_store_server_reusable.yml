name: "Publish pd-store-server image (reusable)"

on:
  workflow_call:
    inputs:
      mode:
        description: "publish mode: latest or release"
        required: true
        type: string
      source_repository:
        description: "source repository in owner/name format"
        required: false
        default: apache/hugegraph
        type: string
      allowed_source_repositories:
        description: "deprecated; this workflow enforces its own source allowlist"
        required: false
        default: ''
        type: string
      source_ref:
        description: "source branch, tag, or commit"
        required: true
        type: string
      default_source:
        description: "default source in owner/name@ref format"
        required: false
        default: ''
        type: string
      image_tag:
        description: "published image tag; empty derives from mode and source ref"
        required: false
        default: ''
        type: string
      runtime_variant:
        description: "local RocksDB runtime variant: standard or topling"
        required: false
        default: standard
        type: string
      publish:
        description: "publish tested images"
        required: false
        default: false
        type: boolean
      mvn_args:
        description: "Docker build args, one NAME=VALUE entry per line"
        required: false
        default: ''
        type: string
      strict_mode:
        description: "whether integration precheck is mandatory before publish"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "build and validate every architecture without publishing"
        required: false
        default: false
        type: boolean
      wait_timeout_sec:
        description: "docker compose wait timeout in seconds"
        required: false
        default: '300'
        type: string
      enable_hash_gate:
        description: "whether to skip latest publish if source hash unchanged"
        required: false
        default: false
        type: boolean
      last_hash_value:
        description: "last published source hash"
        required: false
        default: ''
        type: string
      last_hash_name:
        description: "repo variable name for latest hash"
        required: false
        default: ''
        type: string
      hash_repo_owner:
        description: "owner of repo storing LAST_* hash variable"
        required: false
        default: hugegraph
        type: string
      hash_repo_name:
        description: "repo name storing LAST_* hash variable"
        required: false
        default: actions
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_PASSWORD:
        required: true
      PERSONAL_ACCESS_TOKEN:
        required: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      need_update: ${{ steps.prepare.outputs.need_update }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      version_tag: ${{ steps.prepare.outputs.version_tag }}
      cache_channel: ${{ steps.prepare.outputs.cache_channel }}
      publish_images: ${{ steps.prepare.outputs.publish_images }}
      hash_gate_applied: ${{ steps.prepare.outputs.hash_gate_applied }}
    steps:
    - name: Resolve mode and source ref
      id: prepare
      env:
        MODE: ${{ inputs.mode }}
        SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        SOURCE_REF: ${{ inputs.source_ref }}
        DEFAULT_SOURCE: ${{ inputs.default_source }}
        REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        RUNTIME_VARIANT: ${{ inputs.runtime_variant }}
        PUBLISH: ${{ inputs.publish }}
        ENABLE_HASH_GATE: ${{ inputs.enable_hash_gate }}
        LAST_HASH_VALUE: ${{ inputs.last_hash_value }}
        LAST_HASH_NAME: ${{ inputs.last_hash_name }}
        HASH_REPO_OWNER: ${{ inputs.hash_repo_owner }}
        HASH_REPO_NAME: ${{ inputs.hash_repo_name }}
        PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        set -euo pipefail

        if [ "$MODE" != "latest" ] && [ "$MODE" != "release" ]; then
          echo "Invalid mode: $MODE. Expected latest or release."
          exit 1
        fi
        if [ "$RUNTIME_VARIANT" != "standard" ] \
          && [ "$RUNTIME_VARIANT" != "topling" ]; then
          echo "Invalid runtime variant: $RUNTIME_VARIANT"
          exit 1
        fi
        if [ "$RUNTIME_VARIANT" = "topling" ] && [ "$MODE" != "latest" ]; then
          echo "Topling runtime images are only supported by latest mode"
          exit 1
        fi
        if [ "$RUNTIME_VARIANT" = "topling" ]; then
          case "$REQUESTED_IMAGE_TAG" in
            topling | topling-* | *-topling) ;;
            *)
              echo "Topling publishes require an explicit Topling-specific image_tag"
              exit 1
              ;;
          esac
          if [ "$ENABLE_HASH_GATE" = "true" ]; then
            echo "Topling publishes must not use the standard latest hash gate"
            exit 1
          fi
        fi
        if [ "$RUNTIME_VARIANT" = "standard" ]; then
          case "$REQUESTED_IMAGE_TAG" in
            topling | topling-* | *-topling)
              echo "Standard publishes must not use a Topling-reserved image_tag"
              exit 1
              ;;
          esac
        fi
        if [ "$MODE" = "release" ] && [ "$DRY_RUN" = "true" ]; then
          echo "dry_run is only supported by latest mode"
          exit 1
        fi

        case "$SOURCE_REPOSITORY" in
          apache/hugegraph | hugegraph/hugegraph) ;;
          *)
            echo "Source repository is not allowed: $SOURCE_REPOSITORY"
            exit 1
            ;;
        esac

        if [ "$PUBLISH" = "true" ] \
          && [ "$ENABLE_HASH_GATE" = "true" ] \
          && [ "$MODE" = "latest" ] \
          && [ "$DRY_RUN" != "true" ] \
          && [ -z "$REQUESTED_IMAGE_TAG" ] \
          && [ -n "$DEFAULT_SOURCE" ] \
          && [ "$SOURCE_REPOSITORY" = "${DEFAULT_SOURCE%@*}" ] \
          && [ "$SOURCE_REF" = "${DEFAULT_SOURCE#*@}" ]; then
          if [ "$HASH_REPO_OWNER" != "hugegraph" ] \
            || [ "$HASH_REPO_NAME" != "actions" ] \
            || [ "$LAST_HASH_NAME" != "LAST_SERVER_HASH" ]; then
            echo "Invalid latest hash target; expected hugegraph/actions:LAST_SERVER_HASH"
            exit 1
          fi
          if [ -z "$PERSONAL_ACCESS_TOKEN" ]; then
            echo "PERSONAL_ACCESS_TOKEN is required when enable_hash_gate=true"
            exit 1
          fi
          curl --fail-with-body -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer $PERSONAL_ACCESS_TOKEN" \
            "https://api.github.com/repos/$HASH_REPO_OWNER/$HASH_REPO_NAME/actions/variables/$LAST_HASH_NAME" \
            >/tmp/latest-hash-variable.json
          current_hash="$(
            jq -er --arg name "$LAST_HASH_NAME" \
              'select(.name == $name) | .value | strings' \
              /tmp/latest-hash-variable.json
          )"
          if [ "$current_hash" != "$LAST_HASH_VALUE" ]; then
            echo "Latest hash input is stale; refusing to publish"
            exit 1
          fi
        fi

        if ! [[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
          if ! git check-ref-format "refs/heads/$SOURCE_REF" >/dev/null 2>&1 \
            && ! git check-ref-format "refs/tags/$SOURCE_REF" >/dev/null 2>&1; then
            echo "Invalid source ref: $SOURCE_REF"
            exit 1
          fi
        fi

        default_repository="${DEFAULT_SOURCE%@*}"
        default_ref="${DEFAULT_SOURCE#*@}"
        default_source_match="false"
        if [ -n "$DEFAULT_SOURCE" ] \
          && [ "$SOURCE_REPOSITORY" = "$default_repository" ] \
          && [ "$SOURCE_REF" = "$default_ref" ]; then
          default_source_match="true"
        fi

        source_url="https://github.com/${SOURCE_REPOSITORY}.git"
        source_sha="$(git ls-remote "$source_url" "refs/heads/${SOURCE_REF}" \
          | awk 'NR == 1 { print $1 }')"
        if [ -z "$source_sha" ]; then
          source_sha="$(git ls-remote "$source_url" "refs/tags/${SOURCE_REF}^{}" \
            | awk 'NR == 1 { print $1 }')"
        fi
        if [ -z "$source_sha" ]; then
          source_sha="$(git ls-remote "$source_url" "refs/tags/${SOURCE_REF}" \
            | awk 'NR == 1 { print $1 }')"
        fi
        if [ -z "$source_sha" ] && [[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
          source_sha="$SOURCE_REF"
        fi
        if [ -z "$source_sha" ]; then
          echo "Failed to resolve source SHA for ${SOURCE_REPOSITORY}@${SOURCE_REF}"
          exit 1
        fi

        hash_gate_applied="false"
        if [ "$MODE" = "latest" ]; then
          if [ -n "$REQUESTED_IMAGE_TAG" ]; then
            version_tag="$REQUESTED_IMAGE_TAG"
          else
            version_tag="$(
              printf '%s' "$SOURCE_REF" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//' \
              | cut -c1-110
            )"
            if [ -z "$version_tag" ]; then
              echo "Failed to derive an image tag from source ref: $SOURCE_REF"
              exit 1
            fi
            if [ "$default_source_match" = "true" ]; then
              version_tag="latest"
            fi
          fi
          publish_images="$PUBLISH"
          if [ "$DRY_RUN" = "true" ]; then
            publish_images="false"
          fi
          cache_channel="$version_tag"
          if [ "${#cache_channel}" -gt 117 ]; then
            cache_hash="$(printf '%s' "$cache_channel" | sha256sum | cut -c1-12)"
            cache_channel="${cache_channel:0:104}-${cache_hash}"
          fi
          if [ "$publish_images" != "true" ]; then
            cache_channel="latest"
          fi
          need_update="true"
          if [ "$PUBLISH" = "true" ] && [ "$DRY_RUN" != "true" ] \
            && [ "$ENABLE_HASH_GATE" = "true" ] \
            && [ -z "$REQUESTED_IMAGE_TAG" ] \
            && [ "$default_source_match" = "true" ]; then
            hash_gate_applied="true"
          fi
          if [ "$hash_gate_applied" = "true" ] && [ "$source_sha" = "$LAST_HASH_VALUE" ]; then
            need_update="false"
          fi
        else
          version_tag="$REQUESTED_IMAGE_TAG"
          if ! [[ "$version_tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release image_tag: $version_tag. Expected x.y.z."
            exit 1
          fi
          need_update="true"
          cache_channel="release"
          publish_images="$PUBLISH"
        fi

        if ! [[ "$version_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
          echo "Invalid image tag: $version_tag"
          exit 1
        fi
        if [ "$MODE" = "latest" ] && [ "$PUBLISH" = "true" ] \
          && [ "$default_source_match" != "true" ] \
          && [ -z "$REQUESTED_IMAGE_TAG" ]; then
          echo "image_tag is required when publishing a non-default source"
          exit 1
        fi

        {
          echo "source_sha=$source_sha"
          echo "version_tag=$version_tag"
          echo "cache_channel=$cache_channel"
          echo "publish_images=$publish_images"
          echo "need_update=$need_update"
          echo "hash_gate_applied=$hash_gate_applied"
        } >> "$GITHUB_OUTPUT"

    - name: Summarize build cache strategy
      env:
        CACHE_CHANNEL: ${{ steps.prepare.outputs.cache_channel }}
        PUBLISH_IMAGES: ${{ steps.prepare.outputs.publish_images }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        {
          echo "## PD / Store / Server image build"
          echo
          echo "- Cache backend: Docker Hub registry (BuildKit)"
          echo "- Cache channel: \`$CACHE_CHANNEL\`"
          echo "- Publish images: \`$PUBLISH_IMAGES\`"
          echo "- Dry run: \`$DRY_RUN\`"
          echo "- Runtime variant: \`${{ inputs.runtime_variant }}\`"
          if [ "${{ inputs.runtime_variant }}" = "topling" ]; then
            echo "- Platforms: \`linux/amd64\` (Topling native runtime)"
          else
            echo "- Platforms: \`linux/amd64, linux/arm64\`"
          fi
          echo "- Cache policy: read-only validation (no registry exports)"
          echo "- Build strategy: shared Bake graph when supported, serial compatibility fallback otherwise"
          echo "- Test platform: locally loaded amd64 variants from the final multi-platform tags"
          echo "- Shared build cache: \`hugegraph/hugegraph:shared-$CACHE_CHANNEL\`"
          echo "- Compatibility caches: \`buildcache-$CACHE_CHANNEL\`"
        } >> "$GITHUB_STEP_SUMMARY"

  build_test_publish_multiarch:
    needs: prepare
    if: ${{ needs.prepare.outputs.need_update == 'true' }}
    runs-on: ${{ inputs.runtime_variant == 'topling' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    concurrency:
      group: pd-store-server-${{ needs.prepare.outputs.version_tag }}
      cancel-in-progress: false
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      MVN_ARGS: ${{ inputs.mvn_args }}
      WAIT_TIMEOUT_SEC: ${{ inputs.wait_timeout_sec }}
      VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
      CACHE_CHANNEL: ${{ needs.prepare.outputs.cache_channel }}
      PUBLISH_IMAGES: ${{ needs.prepare.outputs.publish_images }}
      RUNTIME_VARIANT: ${{ inputs.runtime_variant }}
      SOURCE_URL: https://github.com/${{ inputs.source_repository }}
      PD_IMAGE: hugegraph/pd:${{ needs.prepare.outputs.version_tag }}
      STORE_IMAGE: hugegraph/store:${{ needs.prepare.outputs.version_tag }}
      HSTORE_IMAGE: hugegraph/server:${{ needs.prepare.outputs.version_tag }}
      STANDALONE_IMAGE: hugegraph/hugegraph:${{ needs.prepare.outputs.version_tag }}
    steps:
    - name: Validate wait timeout
      run: |
        if ! [[ "$WAIT_TIMEOUT_SEC" =~ ^[0-9]+$ ]] || [ "$WAIT_TIMEOUT_SEC" -lt 30 ] || [ "$WAIT_TIMEOUT_SEC" -gt 1800 ]; then
          echo "Invalid wait_timeout_sec: $WAIT_TIMEOUT_SEC. Expected integer between 30 and 1800."
          exit 1
        fi

    - name: Checkout source
      uses: actions/checkout@v7
      with:
        repository: ${{ env.SOURCE_REPOSITORY }}
        ref: ${{ env.SOURCE_SHA }}
        fetch-depth: 2
        persist-credentials: false

    - name: Set up Docker with containerd image store
      uses: docker/setup-docker-action@v5
      with:
        daemon-config: |
          {
            "features": {
              "containerd-snapshotter": true
            }
          }

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        version: latest

    - name: Detect source-provided Bake graph compatibility
      id: bake_contract
      if: ${{ hashFiles('docker/bake.hcl') != '' }}
      continue-on-error: ${{ inputs.runtime_variant == 'standard' }}
      env:
        IMAGE_TAG: ${{ needs.prepare.outputs.version_tag }}
        SOURCE_REVISION: ${{ needs.prepare.outputs.source_sha }}
        EXPORT_CACHE: 'false'
      run: |
        set -euo pipefail

        bake_print_command=(
          docker buildx bake
          --file docker/bake.hcl
          --print
        )
        expected_build_args='{"MAVEN_ARGS":""}'
        while IFS= read -r build_arg; do
          if [ -z "$build_arg" ]; then
            continue
          fi
          build_arg_name="${build_arg%%=*}"
          if [ "$build_arg_name" = "$build_arg" ] \
            || ! [[ "$build_arg_name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "Invalid mvn_args entry; expected one NAME=VALUE build argument per line"
            exit 1
          fi
          if [ "$build_arg_name" = "SOURCE_REVISION" ] \
            || [ "$build_arg_name" = "SOURCE_REPOSITORY" ]; then
            echo "mvn_args must not override reserved source build arguments"
            exit 1
          fi
          bake_print_command+=(
            --set "*.args.${build_arg_name}=${build_arg#*=}"
          )
          expected_build_args="$(
            jq -cn \
              --argjson current "$expected_build_args" \
              --arg name "$build_arg_name" \
              --arg value "${build_arg#*=}" \
              'def bake_print_value:
                gsub("\\$\\{"; "$${") | gsub("%\\{"; "%%{");
              $current + {($name): ($value | bake_print_value)}'
          )"
        done <<< "$MVN_ARGS"

        "${bake_print_command[@]}" > /tmp/hugegraph-bake.json
        if [ "$RUNTIME_VARIANT" = "topling" ]; then
          expected_platforms='["linux/amd64"]'
        else
          expected_platforms='["linux/amd64","linux/arm64"]'
        fi
        jq -e \
          --arg source_revision "$SOURCE_REVISION" \
          --arg source_repository "$SOURCE_URL" \
          --arg image_tag "$VERSION_TAG" \
          --arg cache_channel "$CACHE_CHANNEL" \
          --arg runtime_variant "$RUNTIME_VARIANT" \
          --argjson expected_platforms "$expected_platforms" \
          --argjson expected_build_args "$expected_build_args" \
          --argjson export_cache "$EXPORT_CACHE" '
          def registry_cache($ref): {ref: $ref, type: "registry"};
          def runtime_target($dockerfile; $tag; $legacy_cache; $target):
            .context == "." and
            .dockerfile == $dockerfile and
            .tags == [$tag] and
            .platforms == $expected_platforms and
            (
              if $target == "standard" then
                ((.target // "") == "" or .target == "standard")
              else
                ((.target // "") == $target)
              end
            ) and
            .output == [{type: "docker"}] and
            .["cache-from"] == [
              registry_cache("hugegraph/hugegraph:shared-" + $cache_channel),
              registry_cache($legacy_cache + $cache_channel)
            ] and
            ((.["cache-to"] // []) == (if $export_cache then [
              {
                mode: "min",
                ref: ($legacy_cache + $cache_channel),
                type: "registry"
              }
            ] else [] end)) and
            .args == ($expected_build_args + {
              SOURCE_REPOSITORY: $source_repository,
              SOURCE_REVISION: $source_revision
            }) and
            ((keys - [
              "args", "cache-from", "cache-to", "context", "dockerfile",
              "output", "platforms", "tags", "target"
            ]) == []);

          .group.default.targets == [
            "build-cache", "pd", "server-hstore", "server-standalone", "store"
          ] and
          (.target | keys) == [
            "build-cache", "pd", "server-hstore", "server-standalone", "store"
          ] and
          (.target["build-cache"] |
            .context == "." and
            .dockerfile == "hugegraph-pd/Dockerfile" and
            .target == "build" and
            .platforms == $expected_platforms and
            .output == [{type: "cacheonly"}] and
            .["cache-from"] == [
              registry_cache("hugegraph/hugegraph:shared-" + $cache_channel),
              registry_cache("hugegraph/pd:buildcache-" + $cache_channel)
            ] and
            ((.["cache-to"] // []) == (if $export_cache then [
              {
                mode: "max",
                ref: ("hugegraph/hugegraph:shared-" + $cache_channel),
                type: "registry"
              }
            ] else [] end)) and
            .args == ($expected_build_args + {
              SOURCE_REPOSITORY: $source_repository,
              SOURCE_REVISION: $source_revision
            }) and
            ((keys - [
              "args", "cache-from", "cache-to", "context", "dockerfile",
              "output", "platforms", "target"
            ]) == [])) and
          (.target.pd |
            runtime_target(
              "hugegraph-pd/Dockerfile";
              "hugegraph/pd:" + $image_tag;
              "hugegraph/pd:buildcache-";
              $runtime_variant
            )) and
          (.target.store |
            runtime_target(
              "hugegraph-store/Dockerfile";
              "hugegraph/store:" + $image_tag;
              "hugegraph/store:buildcache-";
              $runtime_variant
            )) and
          (.target["server-hstore"] |
            runtime_target(
              "hugegraph-server/Dockerfile-hstore";
              "hugegraph/server:" + $image_tag;
              "hugegraph/server:buildcache-";
              ""
            )) and
          (.target["server-standalone"] |
            runtime_target(
              "hugegraph-server/Dockerfile";
              "hugegraph/hugegraph:" + $image_tag;
              "hugegraph/hugegraph:buildcache-";
              $runtime_variant
            ))
        ' /tmp/hugegraph-bake.json

    - name: Login to Docker Hub
      if: ${{ needs.prepare.outputs.publish_images == 'true' }}
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Precheck cleanup
      run: |
        docker system prune -af || true
        docker builder prune -af || true

    - name: Build multi-platform candidates with retries
      id: build
      run: |
        set -euo pipefail

        build_started_at="$(date +%s)"
        build_args=()
        while IFS= read -r build_arg; do
          if [ -z "$build_arg" ]; then
            continue
          fi
          build_arg_name="${build_arg%%=*}"
          if [ "$build_arg_name" = "$build_arg" ] \
            || ! [[ "$build_arg_name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "Invalid mvn_args entry; expected one NAME=VALUE build argument per line"
            exit 1
          fi
          if [ "$build_arg_name" = "SOURCE_REVISION" ] \
            || [ "$build_arg_name" = "SOURCE_REPOSITORY" ]; then
            echo "mvn_args must not override reserved source build arguments"
            exit 1
          fi
          build_args+=("$build_arg")
        done <<< "$MVN_ARGS"

        build_candidate() {
          local module="$1" image="$2" dockerfile="$3" cache_repo="$4"
          local target="${5:-}"
          local attempt succeeded platforms runtime_label
          local -a build_command
          succeeded="false"
          if [ "$RUNTIME_VARIANT" = "topling" ]; then
            platforms="linux/amd64"
          else
            platforms="linux/amd64,linux/arm64"
          fi
          if [ "$module" = "server-hstore" ]; then
            runtime_label="hstore"
          elif [ -n "$target" ]; then
            runtime_label="$target"
          else
            runtime_label="standard"
          fi

          for attempt in 1 2 3; do
            echo "Building ${module} (attempt ${attempt}/3) at $(date -u +%FT%TZ)"
            build_command=(
              docker buildx build
              --file "$dockerfile"
              --platform "$platforms"
              --tag "$image"
              --cache-from "type=registry,ref=${cache_repo}:buildcache-${CACHE_CHANNEL}"
              --load
              --label "org.opencontainers.image.source=${SOURCE_URL}"
              --label "org.opencontainers.image.revision=${SOURCE_SHA}"
              --label "org.apache.hugegraph.rocksdb-runtime=${runtime_label}"
              --build-arg "SOURCE_REPOSITORY=${SOURCE_URL}"
              --build-arg "SOURCE_REVISION=${SOURCE_SHA}"
            )
            if [ -n "$target" ]; then
              build_command+=(--target "$target")
            fi
            for build_arg in "${build_args[@]}"; do
              build_command+=(--build-arg "$build_arg")
            done
            build_command+=(.)

            if "${build_command[@]}"; then
              succeeded="true"
              echo "Built ${module} at $(date -u +%FT%TZ)"
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed for ${module}; retrying with cached layers"
              sleep $((attempt * 5))
            fi
          done

          if [ "$succeeded" != "true" ]; then
            echo "Failed to build ${module} after 3 attempts"
            return 1
          fi
        }

        if [ -f docker/bake.hcl ] \
          && [ "${{ steps.bake_contract.outcome }}" = "success" ]; then
          echo "Using source-provided shared Buildx Bake graph"
          bake_command=(
            docker buildx bake
            --file docker/bake.hcl
            --progress=plain
            --set "*.labels.org.opencontainers.image.source=${SOURCE_URL}"
            --set "*.labels.org.opencontainers.image.revision=${SOURCE_SHA}"
            --set "pd.labels.org.apache.hugegraph.rocksdb-runtime=${RUNTIME_VARIANT}"
            --set "store.labels.org.apache.hugegraph.rocksdb-runtime=${RUNTIME_VARIANT}"
            --set "server-standalone.labels.org.apache.hugegraph.rocksdb-runtime=${RUNTIME_VARIANT}"
            --set "server-hstore.labels.org.apache.hugegraph.rocksdb-runtime=hstore"
          )
          for build_arg in "${build_args[@]}"; do
            build_arg_name="${build_arg%%=*}"
            bake_command+=(
              --set "*.args.${build_arg_name}=${build_arg#*=}"
            )
          done

          built="false"
          for attempt in 1 2 3; do
            echo "Building all candidates with Bake (attempt ${attempt}/3) at $(date -u +%FT%TZ)"
            if "${bake_command[@]}"; then
              built="true"
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Bake failed; retrying with completed BuildKit layers"
              sleep $((attempt * 5))
            fi
          done
          if [ "$built" != "true" ]; then
            echo "Failed to build candidates with Bake after 3 attempts"
            exit 1
          fi
        else
          echo "Bake graph unavailable or incompatible; using serial compatibility build"
          runtime_target=""
          if [ "$RUNTIME_VARIANT" = "topling" ]; then
            runtime_target="topling"
          fi
          build_candidate pd "$PD_IMAGE" ./hugegraph-pd/Dockerfile hugegraph/pd "$runtime_target"
          build_candidate store "$STORE_IMAGE" ./hugegraph-store/Dockerfile hugegraph/store "$runtime_target"
          build_candidate server-hstore "$HSTORE_IMAGE" ./hugegraph-server/Dockerfile-hstore hugegraph/server
          build_candidate server-standalone "$STANDALONE_IMAGE" ./hugegraph-server/Dockerfile hugegraph/hugegraph "$runtime_target"
        fi

        build_duration_seconds="$(( $(date +%s) - build_started_at ))"
        echo "build_duration_seconds=$build_duration_seconds" >> "$GITHUB_OUTPUT"
        echo "Built all multi-platform candidates in ${build_duration_seconds}s"
      env:
        IMAGE_TAG: ${{ needs.prepare.outputs.version_tag }}
        SOURCE_REVISION: ${{ needs.prepare.outputs.source_sha }}
        EXPORT_CACHE: 'false'

    - name: Summarize candidate build timing
      env:
        BUILD_DURATION_SECONDS: ${{ steps.build.outputs.build_duration_seconds }}
      run: |
        {
          echo
          echo "## Candidate build timing"
          echo
          echo "- Duration: \`${BUILD_DURATION_SECONDS}s\`"
          if [ -f docker/bake.hcl ] \
            && [ "${{ steps.bake_contract.outcome }}" = "success" ]; then
            echo "- Strategy: shared Buildx Bake graph"
          else
            echo "- Strategy: serial compatibility fallback"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Verify locally loaded platform variants
      run: |
        set -euo pipefail
        for image in "$PD_IMAGE" "$STORE_IMAGE" "$HSTORE_IMAGE" "$STANDALONE_IMAGE"; do
          docker image inspect --platform linux/amd64 "$image" >/dev/null
          if [ "$RUNTIME_VARIANT" = "standard" ]; then
            docker image inspect --platform linux/arm64 "$image" >/dev/null
            echo "Loaded amd64 and arm64 variants: ${image}"
          else
            echo "Loaded amd64 Topling deployment variant: ${image}"
          fi
        done

    - name: Verify runtime variant contract
      run: |
        set -euo pipefail

        assert_provenance() {
          local image="$1" expected_runtime="$2"
          local source revision runtime
          source="$(docker image inspect --platform linux/amd64 \
            --format '{{index .Config.Labels "org.opencontainers.image.source"}}' \
            "$image")"
          revision="$(docker image inspect --platform linux/amd64 \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
            "$image")"
          runtime="$(docker image inspect --platform linux/amd64 \
            --format '{{index .Config.Labels "org.apache.hugegraph.rocksdb-runtime"}}' \
            "$image")"
          [ "$source" = "$SOURCE_URL" ]
          [ "$revision" = "$SOURCE_SHA" ]
          [ "$runtime" = "$expected_runtime" ]
        }

        assert_provenance "$PD_IMAGE" "$RUNTIME_VARIANT"
        assert_provenance "$STORE_IMAGE" "$RUNTIME_VARIANT"
        assert_provenance "$STANDALONE_IMAGE" "$RUNTIME_VARIANT"
        assert_provenance "$HSTORE_IMAGE" hstore

        assert_no_topling_payload() {
          local image="$1"
          docker run --rm --platform linux/amd64 --entrypoint bash "$image" -c '
            set -euo pipefail
            ! find lib -path "*/topling/rocksdbjni*.jar" -print -quit |
              grep -q .
            test ! -e library/librocksdbjni-linux64.so
          '
        }

        if [ "$RUNTIME_VARIANT" = "topling" ]; then
          for image in "$PD_IMAGE" "$STORE_IMAGE" "$STANDALONE_IMAGE"; do
            docker run --rm --platform linux/amd64 --entrypoint bash "$image" -c '
              set -euo pipefail
              test -n "$(find lib/topling -maxdepth 1 \
                         -name "rocksdbjni*.jar" -print -quit)"
              test -r library/librocksdbjni-linux64.so
              ldd library/librocksdbjni-linux64.so |
                tee /tmp/topling-ldd.txt
              ! grep -q "not found" /tmp/topling-ldd.txt
              TOPLINGDB_ROCKSDB_PROVIDER=topling source bin/preload-topling.sh
              test "$TOPLING_ACTIVE_NATIVE" = \
                "$PWD/library/librocksdbjni-linux64.so"
              /bin/true
            '
          done
          assert_no_topling_payload "$HSTORE_IMAGE"
        else
          assert_no_topling_payload "$PD_IMAGE"
          assert_no_topling_payload "$STORE_IMAGE"
          assert_no_topling_payload "$STANDALONE_IMAGE"
          assert_no_topling_payload "$HSTORE_IMAGE"
        fi

    - name: Start compose stack with local images
      if: ${{ inputs.strict_mode }}
      run: |
        HUGEGRAPH_ADMIN_PASSWORD="$(openssl rand -hex 16)"
        echo "::add-mask::$HUGEGRAPH_ADMIN_PASSWORD"
        echo "HUGEGRAPH_ADMIN_PASSWORD=$HUGEGRAPH_ADMIN_PASSWORD" >> "$GITHUB_ENV"
        export HUGEGRAPH_ADMIN_PASSWORD

        if [ -f "docker/docker-compose.dev.yml" ]; then
          compose_file="docker/docker-compose.dev.yml"
        elif [ -f "docker/docker-compose.yml" ]; then
          compose_file="docker/docker-compose.yml"
          echo "WARN: docker/docker-compose.dev.yml is unavailable; using legacy docker/docker-compose.yml"
        else
          echo "ERROR: no supported compose file found in $SOURCE_REPOSITORY@$SOURCE_SHA"
          echo "Expected docker/docker-compose.dev.yml or docker/docker-compose.yml."
          exit 1
        fi
        echo "COMPOSE_FILE=$compose_file" >> "$GITHUB_ENV"

        cat > /tmp/hg-ci-patch-server-config.sh <<'PATCH_SERVER'
        #!/usr/bin/env bash
        set -euo pipefail

        set_property() {
          local file="$1" key="$2" value="$3" escaped
          escaped=${key//./\.}
          if grep -qE "^[[:space:]]*${escaped}[[:space:]]*=" "$file"; then
            sed -E -i "s|^[[:space:]]*${escaped}[[:space:]]*=.*|${key}=${value}|" "$file"
          else
            printf '%s=%s\n' "$key" "$value" >> "$file"
          fi
        }

        set_yaml_scalar() {
          local file="$1" key="$2" value="$3"
          if grep -qE "^[[:space:]]*${key}:" "$file"; then
            sed -E -i "s|^([[:space:]]*)${key}:.*|\1${key}: ${value}|" "$file"
          else
            printf '%s: %s\n' "$key" "$value" >> "$file"
          fi
        }

        set_property ./conf/rest-server.properties batch.max_write_threads 4
        set_property ./conf/rest-server.properties restserver.min_free_memory 32
        set_yaml_scalar ./conf/gremlin-server.yaml threadPoolWorker 4
        set_yaml_scalar ./conf/gremlin-server.yaml gremlinPool 4

        echo "Applied CI Server resource configuration"
        exec ./docker-entrypoint.sh
        PATCH_SERVER
        chmod 755 /tmp/hg-ci-patch-server-config.sh

        if [ "$RUNTIME_VARIANT" = "topling" ]; then
          pd_provider="topling"
          pd_data_path="/hugegraph-pd/topling-pd-data"
          pd_enforce_marker="true"
          store_provider="topling"
          store_data_path="/hugegraph-store/topling-storage"
          store_enforce_marker="true"
        else
          pd_provider="rocksdb"
          pd_data_path="/hugegraph-pd/pd_data"
          pd_enforce_marker="false"
          store_provider="rocksdb"
          store_data_path="/hugegraph-store/storage"
          store_enforce_marker="false"
        fi

        cat > /tmp/docker-compose.ci.override.yml <<COMPOSE_OVERRIDE
        services:
          pd:
            image: ${PD_IMAGE}
            container_name: hg-pd
            pull_policy: never
            mem_limit: 1024m
            cpus: 2.0
            environment:
              HG_PD_ROCKSDB_PROVIDER: ${pd_provider}
              HG_PD_DATA_PATH: ${pd_data_path}
              HG_PD_ENFORCE_PROVIDER_MARKER: "${pd_enforce_marker}"
              JAVA_OPTS: >-
                -Xms128m -Xmx128m
                -XX:ActiveProcessorCount=2
                -XX:MaxMetaspaceSize=192m
                -XX:MaxDirectMemorySize=128m
                -XX:+UseContainerSupport
                -Dlog4j2.asyncLoggerConfigRingBufferSize=8192
                -DAsyncLoggerConfig.RingBufferSize=8192
                -Dthread.pool.grpc.core=8
                -Dthread.pool.grpc.max=32
                -Dthread.pool.grpc.queue=512
                -Djob.interruptableThreadPool.core=1
                -Djob.interruptableThreadPool.max=8
                -Djob.interruptableThreadPool.queue=256
                -Djob.uninterruptibleThreadPool.core=0
                -Djob.uninterruptibleThreadPool.max=4
                -Djob.uninterruptibleThreadPool.queue=128
                -Dpartition.default-shard-count=1
                -Dpartition.store-max-shard-count=12
            volumes: !override
              - hg-pd-data:${pd_data_path}
          store:
            image: ${STORE_IMAGE}
            container_name: hg-store
            pull_policy: never
            mem_limit: 1024m
            cpus: 2.0
            environment:
              HG_STORE_ROCKSDB_PROVIDER: ${store_provider}
              HG_STORE_DATA_PATH: ${store_data_path}
              HG_STORE_ENFORCE_PROVIDER_MARKER: "${store_enforce_marker}"
              JAVA_OPTS: >-
                -Xms128m -Xmx128m
                -XX:ActiveProcessorCount=2
                -XX:MaxMetaspaceSize=192m
                -XX:MaxDirectMemorySize=128m
                -XX:+UseContainerSupport
                -Dlog4j2.asyncLoggerConfigRingBufferSize=8192
                -DAsyncLoggerConfig.RingBufferSize=8192
                -Drocksdb.total_memory_size=134217728
                -Drocksdb.write_buffer_size=2097152
                -Drocksdb.min_write_buffer_number_to_merge=2
                -Dthread.pool.grpc.core=8
                -Dthread.pool.grpc.max=32
                -Dthread.pool.grpc.queue=512
                -Dthread.pool.scan.core=4
                -Dthread.pool.scan.max=16
                -Dthread.pool.scan.queue=256
                -Djob.interruptableThreadPool.core=2
                -Djob.interruptableThreadPool.max=8
                -Djob.interruptableThreadPool.queue=256
                -Djob.uninterruptibleThreadPool.core=0
                -Djob.uninterruptibleThreadPool.max=4
                -Djob.uninterruptibleThreadPool.queue=128
                -Dquery.push-down.threads=8
                -Dquery.push-down.fetch_batch=1000
                -Dquery.push-down.fetch_timeout=30000
                -Dquery.push-down.memory_limit_count=10000
                -Dquery.push-down.index_size_limit_count=10000
                -Draft.disruptorBufferSize=512
                -Draft.metrics=false
                -Draft.maxReplicatorInflightMsgs=32
                -Draft.maxEntriesSize=64
                -Draft.maxBodySize=262144
            volumes: !override
              - hg-store-data:${store_data_path}
          server:
            image: ${HSTORE_IMAGE}
            container_name: hg-server
            pull_policy: never
            mem_limit: 1536m
            cpus: 4.0
            entrypoint:
              - /usr/bin/dumb-init
              - "--"
              - /opt/hg-ci/patch-server-config.sh
            environment:
              JAVA_OPTS: >-
                -Xms256m -Xmx384m
                -XX:ActiveProcessorCount=4
                -XX:MaxMetaspaceSize=256m
                -XX:MaxDirectMemorySize=128m
                -XX:+UseContainerSupport
                -Dlog4j2.asyncLoggerConfigRingBufferSize=8192
                -DAsyncLoggerConfig.RingBufferSize=8192
            volumes:
              - type: bind
                source: /tmp/hg-ci-patch-server-config.sh
                target: /opt/hg-ci/patch-server-config.sh
                read_only: true
        COMPOSE_OVERRIDE

        docker compose \
          -p hg-ci-precheck \
          -f "$compose_file" \
          -f /tmp/docker-compose.ci.override.yml \
          up -d --wait --wait-timeout "$WAIT_TIMEOUT_SEC"

        docker compose -p hg-ci-precheck -f "$compose_file" -f /tmp/docker-compose.ci.override.yml ps

    - name: Verify CI resource limits
      if: ${{ inputs.strict_mode }}
      run: |
        set -euo pipefail

        assert_memory_limit() {
          local container="$1" expected_bytes="$2" actual_bytes
          actual_bytes="$(docker inspect --format '{{.HostConfig.Memory}}' "$container")"
          if [ "$actual_bytes" != "$expected_bytes" ]; then
            echo "Unexpected memory limit for ${container}: expected ${expected_bytes}, got ${actual_bytes}"
            exit 1
          fi
          echo "${container} memory limit: ${actual_bytes} bytes"
        }

        assert_memory_limit hg-pd 1073741824
        assert_memory_limit hg-store 1073741824
        assert_memory_limit hg-server 1610612736

        for container in hg-pd hg-store hg-server; do
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$container" \
            | grep '^JAVA_OPTS='
          docker exec "$container" bash -lc "ps -eo args | grep '[j]ava'"
        done
        docker exec hg-server grep -E \
          '^(batch.max_write_threads|restserver.min_free_memory)=' \
          /hugegraph-server/conf/rest-server.properties
        docker exec hg-server grep -E \
          '^[[:space:]]*(threadPoolWorker|gremlinPool):' \
          /hugegraph-server/conf/gremlin-server.yaml

        docker stats --no-stream hg-pd hg-store hg-server

    - name: Verify integration endpoints
      if: ${{ inputs.strict_mode }}
      run: |
        curl -fsS --connect-timeout 3 --max-time 8 "http://127.0.0.1:8620/v1/health" >/dev/null
        curl -fsS --connect-timeout 3 --max-time 8 "http://127.0.0.1:8520/v1/health" >/dev/null
        curl -fsS --connect-timeout 3 --max-time 8 "http://127.0.0.1:8080/versions" >/dev/null

    - name: Import bundled example graph
      if: ${{ inputs.strict_mode }}
      run: |
        set -euo pipefail

        docker exec hg-server test -r /hugegraph-server/scripts/example.groovy
        docker exec hg-server bash -lc \
          'cd /hugegraph-server && bin/gremlin-console.sh -- -e scripts/example.groovy' \
          | tee /tmp/hg-ci-example-import.log

        grep -Fq '>>>> query all vertices: size=6' /tmp/hg-ci-example-import.log
        grep -Fq '>>>> query all edges: size=6' /tmp/hg-ci-example-import.log

    - name: Verify bundled graph with Gremlin CRUD
      if: ${{ inputs.strict_mode }}
      env:
        CI_VERTEX_NAME: hg-ci-${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        set -euo pipefail

        gremlin_request() {
          local label="$1" script="$2" payload response_file
          response_file="/tmp/hg-ci-gremlin-${label}.json"
          payload="$(
            jq -nc --arg gremlin "$script" \
              '{gremlin:$gremlin,bindings:{},language:"gremlin-groovy",aliases:{graph:"DEFAULT-hugegraph",g:"__g_DEFAULT-hugegraph"}}'
          )"
          curl --fail-with-body -sS \
            --compressed \
            --connect-timeout 3 \
            --max-time 30 \
            --user "admin:$HUGEGRAPH_ADMIN_PASSWORD" \
            -H 'Content-Type: application/json' \
            --data-binary "$payload" \
            http://127.0.0.1:8080/gremlin \
            | tee "$response_file"
          jq -e '.status.code == 200' "$response_file" >/dev/null
        }

        baseline_script="[[vertices:g.V().count().next(),edges:g.E().count().next(),names:g.V().values('name').order().toList(),markoCreated:g.V().has('person','name','marko').out('created').values('name').order().toList()]]"
        gremlin_request baseline "$baseline_script"
        jq -e '
          .result.data[0].vertices == 6 and
          .result.data[0].edges == 6 and
          .result.data[0].names == ["josh","lop","marko","peter","ripple","vadas"] and
          .result.data[0].markoCreated == ["lop"]
        ' /tmp/hg-ci-gremlin-baseline.json >/dev/null

        create_script="ci=graph.addVertex(T.label,'person','name','${CI_VERTEX_NAME}','age',40,'city','CI');marko=g.V().has('person','name','marko').next();marko.addEdge('knows',ci,'date','ci','weight',0.1d);graph.tx().commit();'${CI_VERTEX_NAME}'"
        gremlin_request create "$create_script"
        jq -e --arg name "$CI_VERTEX_NAME" '.result.data == [$name]' \
          /tmp/hg-ci-gremlin-create.json >/dev/null

        read_created_script="[[vertices:g.V().count().next(),edges:g.E().count().next(),matches:g.V().has('person','name','marko').out('knows').has('name','${CI_VERTEX_NAME}').count().next()]]"
        gremlin_request read-created "$read_created_script"
        jq -e '
          .result.data[0].vertices == 7 and
          .result.data[0].edges == 7 and
          .result.data[0].matches == 1
        ' /tmp/hg-ci-gremlin-read-created.json >/dev/null

        update_script="g.V().has('person','name','${CI_VERTEX_NAME}').property('age',41).iterate();graph.tx().commit();g.V().has('person','name','${CI_VERTEX_NAME}').values('age').next()"
        gremlin_request update "$update_script"
        jq -e '.result.data == [41]' /tmp/hg-ci-gremlin-update.json >/dev/null

        delete_script="ci=g.V().has('person','name','${CI_VERTEX_NAME}').next();g.V(ci).bothE().drop().iterate();g.V(ci).drop().iterate();graph.tx().commit();[[vertices:g.V().count().next(),edges:g.E().count().next()]]"
        gremlin_request delete "$delete_script"
        jq -e '
          .result.data[0].vertices == 6 and
          .result.data[0].edges == 6
        ' /tmp/hg-ci-gremlin-delete.json >/dev/null

        gremlin_request final "$baseline_script"
        jq -e '
          .result.data[0].vertices == 6 and
          .result.data[0].edges == 6 and
          .result.data[0].names == ["josh","lop","marko","peter","ripple","vadas"]
        ' /tmp/hg-ci-gremlin-final.json >/dev/null

        docker stats --no-stream hg-pd hg-store hg-server

    - name: Restart integration stack and verify persistence
      if: ${{ inputs.strict_mode }}
      run: |
        set -euo pipefail

        compose=(
          docker compose
          -p hg-ci-precheck
          -f "$COMPOSE_FILE"
          -f /tmp/docker-compose.ci.override.yml
        )
        "${compose[@]}" stop -t 120 server store pd
        "${compose[@]}" up -d --wait --wait-timeout "$WAIT_TIMEOUT_SEC" pd
        "${compose[@]}" up -d --wait --wait-timeout "$WAIT_TIMEOUT_SEC" store
        "${compose[@]}" up -d --wait --wait-timeout "$WAIT_TIMEOUT_SEC" server

        curl -fsS --connect-timeout 3 --max-time 8 \
          http://127.0.0.1:8620/v1/health >/dev/null
        curl -fsS --connect-timeout 3 --max-time 8 \
          http://127.0.0.1:8520/v1/health >/dev/null
        curl -fsS --connect-timeout 3 --max-time 8 \
          http://127.0.0.1:8080/versions >/dev/null

        payload="$(
          jq -nc \
            --arg gremlin \
              '[[vertices:g.V().count().next(),edges:g.E().count().next()]]' \
            '{gremlin:$gremlin,bindings:{},language:"gremlin-groovy",
              aliases:{graph:"DEFAULT-hugegraph",g:"__g_DEFAULT-hugegraph"}}'
        )"
        persistence_verified=false
        for attempt in 1 2 3 4 5; do
          if curl --fail-with-body -sS \
            --compressed \
            --connect-timeout 3 \
            --max-time 30 \
            --user "admin:$HUGEGRAPH_ADMIN_PASSWORD" \
            -H 'Content-Type: application/json' \
            --data-binary "$payload" \
            http://127.0.0.1:8080/gremlin \
            | tee /tmp/hg-ci-restart-persistence.json \
            && jq -e '
              .status.code == 200 and
              .result.data[0].vertices == 6 and
              .result.data[0].edges == 6
            ' /tmp/hg-ci-restart-persistence.json >/dev/null; then
            persistence_verified=true
            break
          fi
          echo "Persistence query attempt ${attempt}/5 did not pass"
          sleep $((attempt * 2))
        done
        test "$persistence_verified" = "true"

        for container in hg-pd hg-store hg-server; do
          if docker logs "$container" 2>&1 |
            grep -E 'cfh_to_view|SIGABRT|core dumped'; then
            echo "Native abort evidence found in ${container}" >&2
            exit 1
          fi
        done

    - name: Dump compose logs on failure
      if: ${{ failure() && inputs.strict_mode }}
      run: |
        if [ -n "${COMPOSE_FILE:-}" ] && [ -f /tmp/docker-compose.ci.override.yml ]; then
          docker compose -p hg-ci-precheck -f "$COMPOSE_FILE" -f /tmp/docker-compose.ci.override.yml ps || true
          docker compose -p hg-ci-precheck -f "$COMPOSE_FILE" -f /tmp/docker-compose.ci.override.yml logs --no-color --tail=200 || true
        else
          echo "Compose stack was not started; COMPOSE_FILE or CI override is unavailable"
        fi
        docker stats --no-stream hg-pd hg-store hg-server || true
        for container in hg-pd hg-store hg-server; do
          docker inspect --format '{{json .State.Health}}' "$container" || true
        done
        for artifact in /tmp/hg-ci-example-import.log /tmp/hg-ci-gremlin-*.json; do
          if [ -f "$artifact" ]; then
            echo "===== ${artifact} ====="
            cat "$artifact"
          fi
        done

    - name: Stop compose stack
      if: ${{ always() }}
      run: |
        set -euo pipefail

        if [ -n "${COMPOSE_FILE:-}" ] && [ -f /tmp/docker-compose.ci.override.yml ]; then
          docker compose \
            -p hg-ci-precheck \
            -f "$COMPOSE_FILE" \
            -f /tmp/docker-compose.ci.override.yml \
            down -v --remove-orphans
        else
          echo "Compose stack was not started; skipping compose down"
        fi

        leftover_containers="$(docker ps -aq --filter label=com.docker.compose.project=hg-ci-precheck)"
        leftover_networks="$(docker network ls -q --filter label=com.docker.compose.project=hg-ci-precheck)"
        leftover_volumes="$(docker volume ls -q --filter label=com.docker.compose.project=hg-ci-precheck)"
        if [ -n "$leftover_containers$leftover_networks$leftover_volumes" ]; then
          echo "Compose cleanup left resources behind"
          docker ps -a --filter label=com.docker.compose.project=hg-ci-precheck
          docker network ls --filter label=com.docker.compose.project=hg-ci-precheck
          docker volume ls --filter label=com.docker.compose.project=hg-ci-precheck
          exit 1
        fi
        echo "Compose cleanup removed all project containers, networks, and volumes"

    - name: Smoke test standalone Server candidate
      if: ${{ success() }}
      run: |
        set -euo pipefail

        wait_standalone() {
          for attempt in $(seq 1 60); do
            if curl -fsS --connect-timeout 3 --max-time 8 \
              http://127.0.0.1:18080/versions >/dev/null; then
              echo "Standalone candidate is ready after attempt ${attempt}"
              return 0
            fi
            if ! docker inspect --format '{{.State.Running}}' \
              hg-ci-standalone | grep -qx true; then
              docker logs hg-ci-standalone
              return 1
            fi
            sleep 2
          done
          docker logs hg-ci-standalone
          return 1
        }

        stop_standalone() {
          local stop_pid java_pid

          docker stop -t 120 hg-ci-standalone >/dev/null &
          stop_pid=$!
          for _ in $(seq 1 15); do
            if ! docker inspect --format '{{.State.Running}}' \
              hg-ci-standalone | grep -qx true; then
              break
            fi
            sleep 1
          done
          if docker inspect --format '{{.State.Running}}' \
            hg-ci-standalone | grep -qx true; then
            echo "Standalone shutdown is still pending after 15 seconds"
            docker top hg-ci-standalone \
              -eo pid,ppid,pgid,sid,stat,comm,args || true
            docker exec hg-ci-standalone sh -c '
              sha256sum /hugegraph-server/docker-entrypoint.sh
              for status in /proc/[0-9]*/status; do
                grep -Eq "^(Name|Pid|PPid|State|SigPnd|ShdPnd|SigBlk|SigIgn|SigCgt):" \
                  "$status" && {
                    printf "%s\n" "$status"
                    grep -E "^(Name|Pid|PPid|State|SigPnd|ShdPnd|SigBlk|SigIgn|SigCgt):" \
                      "$status"
                  }
              done
            ' || true
            java_pid="$(
              docker exec hg-ci-standalone \
                pgrep -f 'org.apache.hugegraph.bootstrap.HugeGraphServerBootstrap' \
                | head -n 1 || true
            )"
            if [ -n "$java_pid" ]; then
              docker exec hg-ci-standalone kill -QUIT "$java_pid" || true
              sleep 2
            fi
            docker logs --tail 300 hg-ci-standalone || true
          fi
          wait "$stop_pid"
        }

        if [ "$RUNTIME_VARIANT" = "topling" ]; then
          data_target="/hugegraph-server/topling-data"
        else
          data_target="/hugegraph-server/rocksdb-data"
        fi
        docker volume create hg-ci-standalone-data >/dev/null
        docker run --pull=never -d --name=hg-ci-standalone \
          -p 18080:8080 \
          -v "hg-ci-standalone-data:${data_target}" \
          "$STANDALONE_IMAGE"
        wait_standalone

        create_payload="$(
          jq -nc \
            --arg gremlin '
              schema = graph.schema();
              schema.propertyKey("name").asText().ifNotExist().create();
              schema.vertexLabel("person").properties("name")
                    .primaryKeys("name").ifNotExist().create();
              schema.edgeLabel("knows").sourceLabel("person")
                    .targetLabel("person").ifNotExist().create();
              alice = graph.addVertex(T.label, "person", "name", "alice");
              bob = graph.addVertex(T.label, "person", "name", "bob");
              alice.addEdge("knows", bob);
              graph.tx().commit();
              [[vertices:g.V().count().next(),edges:g.E().count().next()]]
            ' \
            '{gremlin:$gremlin,bindings:{},language:"gremlin-groovy",
              aliases:{graph:"DEFAULT-hugegraph",g:"__g_DEFAULT-hugegraph"}}'
        )"
        curl --fail-with-body -sS \
          --compressed \
          --connect-timeout 3 \
          --max-time 30 \
          -H 'Content-Type: application/json' \
          --data-binary "$create_payload" \
          http://127.0.0.1:18080/gremlin \
          | tee /tmp/hg-ci-standalone-create.json
        jq -e '
          .status.code == 200 and
          .result.data[0].vertices == 2 and
          .result.data[0].edges == 1
        ' /tmp/hg-ci-standalone-create.json >/dev/null

        stop_standalone
        test "$(docker inspect --format '{{.State.ExitCode}}' \
                hg-ci-standalone)" = "0"
        docker rm hg-ci-standalone >/dev/null

        docker run --pull=never -d --name=hg-ci-standalone \
          -p 18080:8080 \
          -v "hg-ci-standalone-data:${data_target}" \
          "$STANDALONE_IMAGE"
        wait_standalone

        payload="$(
          jq -nc \
            --arg gremlin \
              '[[vertices:g.V().count().next(),edges:g.E().count().next()]]' \
            '{gremlin:$gremlin,bindings:{},language:"gremlin-groovy",
              aliases:{graph:"DEFAULT-hugegraph",g:"__g_DEFAULT-hugegraph"}}'
        )"
        curl --fail-with-body -sS \
          --compressed \
          --connect-timeout 3 \
          --max-time 30 \
          -H 'Content-Type: application/json' \
          --data-binary "$payload" \
          http://127.0.0.1:18080/gremlin \
          | tee /tmp/hg-ci-standalone-restart.json
        jq -e '
          .status.code == 200 and
          .result.data[0].vertices == 2 and
          .result.data[0].edges == 1
        ' /tmp/hg-ci-standalone-restart.json >/dev/null

        truncate_payload="$(
          jq -nc \
            --arg gremlin 'graph.truncateBackend(); true' \
            '{gremlin:$gremlin,bindings:{},language:"gremlin-groovy",
              aliases:{graph:"DEFAULT-hugegraph",g:"__g_DEFAULT-hugegraph"}}'
        )"
        curl --fail-with-body -sS \
          --compressed \
          --connect-timeout 3 \
          --max-time 30 \
          -H 'Content-Type: application/json' \
          --data-binary "$truncate_payload" \
          http://127.0.0.1:18080/gremlin \
          | tee /tmp/hg-ci-standalone-truncate.json
        jq -e '.status.code == 200' \
          /tmp/hg-ci-standalone-truncate.json >/dev/null

        curl --fail-with-body -sS \
          --compressed \
          --connect-timeout 3 \
          --max-time 30 \
          -H 'Content-Type: application/json' \
          --data-binary "$payload" \
          http://127.0.0.1:18080/gremlin \
          | tee /tmp/hg-ci-standalone-after-truncate.json
        jq -e '
          .status.code == 200 and
          .result.data[0].vertices == 0 and
          .result.data[0].edges == 0
        ' /tmp/hg-ci-standalone-after-truncate.json >/dev/null

        stop_standalone
        test "$(docker inspect --format '{{.State.ExitCode}}' \
                hg-ci-standalone)" = "0"
        docker rm hg-ci-standalone >/dev/null
        docker volume rm hg-ci-standalone-data >/dev/null

    - name: Publish tested deployment set
      if: ${{ success() && needs.prepare.outputs.publish_images == 'true' }}
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        HASH_GATE_APPLIED: ${{ needs.prepare.outputs.hash_gate_applied }}
        HASH_REPO_OWNER: ${{ inputs.hash_repo_owner }}
        HASH_REPO_NAME: ${{ inputs.hash_repo_name }}
        LAST_HASH_VALUE: ${{ inputs.last_hash_value }}
        LAST_HASH_NAME: ${{ inputs.last_hash_name }}
        PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      run: |
        set -euo pipefail

        images=(
          "$PD_IMAGE"
          "$STORE_IMAGE"
          "$HSTORE_IMAGE"
          "$STANDALONE_IMAGE"
        )
        candidate_tag="candidate-${RUNTIME_VARIANT}-${SOURCE_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        declare -A candidate_ref old_digest

        login_payload="$(
          jq -cn \
            --arg username "$DOCKERHUB_USERNAME" \
            --arg password "$DOCKERHUB_PASSWORD" \
            '{username:$username,password:$password}'
        )"
        refresh_hub_token() {
          local refreshed_token
          refreshed_token="$(
            curl --fail-with-body -sS -L \
              -H 'Content-Type: application/json' \
              --data-binary "$login_payload" \
              https://hub.docker.com/v2/users/login |
              jq -er '.token // .access_token'
          )" || return 1
          hub_token="$refreshed_token"
        }
        refresh_hub_token

        get_hub_tag_digest() {
          local image="$1" repository tag response_file http_code attempt digest
          repository="${image%:*}"
          tag="${image##*:}"
          response_file="$(mktemp)"
          for attempt in 1 2 3; do
            if http_code="$(
              curl -sS -L -o "$response_file" -w '%{http_code}' \
                -H "Authorization: Bearer $hub_token" \
                "https://hub.docker.com/v2/repositories/${repository}/tags/${tag}/"
            )"; then
              case "$http_code" in
                200)
                  if digest="$(jq -er '.digest' "$response_file")"; then
                    echo "$digest"
                    rm -f "$response_file"
                    return 0
                  fi
                  ;;
                404)
                  echo "__ABSENT__"
                  rm -f "$response_file"
                  return 0
                  ;;
              esac
            fi
            sleep $((attempt * 3))
          done
          echo "Could not determine Docker Hub tag state for ${image}" >&2
          rm -f "$response_file"
          return 1
        }

        inspect_digest() {
          local image="$1" attempt
          for attempt in 1 2 3; do
            if docker buildx imagetools inspect "$image" \
                 --format '{{json .}}' 2>/dev/null |
                 jq -er '.manifest.digest'; then
              return 0
            fi
            sleep $((attempt * 3))
          done
          return 1
        }

        delete_hub_tag() {
          local image="$1" repository tag
          repository="${image%:*}"
          tag="${image##*:}"
          curl --fail-with-body -sS -L -X DELETE \
            -H "Authorization: Bearer $hub_token" \
            "https://hub.docker.com/v2/repositories/${repository}/tags/${tag}/"
        }

        cleanup_candidates() {
          local image repository candidate
          for image in "${images[@]}"; do
            repository="${image%:*}"
            candidate="${repository}:${candidate_tag}"
            delete_hub_tag "$candidate" >/dev/null 2>&1 || true
          done
        }

        rollback_publication() {
          local image repository expected actual restored attempt
          local hash_restored old_hash_payload
          local failed="false"

          if ! refresh_hub_token; then
            echo "Failed to refresh Docker Hub token for rollback" >&2
            return 1
          fi

          for image in "${images[@]}"; do
            repository="${image%:*}"
            expected="${old_digest[$image]}"
            restored="false"
            for attempt in 1 2 3; do
              if [ "$expected" != "__ABSENT__" ]; then
                actual="$(
                  get_hub_tag_digest "$image" 2>/dev/null ||
                    echo "__UNKNOWN__"
                )"
                if [ "$actual" = "$expected" ]; then
                  restored="true"
                elif [ "$actual" = "${candidate_ref[$image]##*@}" ]; then
                  if docker buildx imagetools create \
                       --prefer-index=false \
                       --tag "$image" "${repository}@${expected}"; then
                    actual="$(
                      get_hub_tag_digest "$image" 2>/dev/null ||
                        echo "__UNKNOWN__"
                    )"
                    [ "$actual" = "$expected" ] && restored="true"
                  fi
                elif [ "$actual" != "__UNKNOWN__" ]; then
                  echo "Refusing to overwrite newer tag ${image}" >&2
                  break
                fi
              else
                actual="$(
                  get_hub_tag_digest "$image" 2>/dev/null ||
                    echo "__UNKNOWN__"
                )"
                if [ "$actual" = "__ABSENT__" ]; then
                  restored="true"
                elif [ "$actual" = "${candidate_ref[$image]##*@}" ] \
                  && delete_hub_tag "$image"; then
                  actual="$(
                    get_hub_tag_digest "$image" 2>/dev/null ||
                      echo "__UNKNOWN__"
                  )"
                  [ "$actual" = "__ABSENT__" ] && restored="true"
                fi
              fi
              [ "$restored" = "true" ] && break
              sleep $((attempt * 3))
            done
            if [ "$restored" != "true" ]; then
              echo "Failed to restore ${image}" >&2
              failed="true"
            fi
          done

          if [ "$hash_update_attempted" = "true" ]; then
            hash_restored="false"
            old_hash_payload="$(
              jq -cn \
                --arg name "$LAST_HASH_NAME" \
                --arg value "$LAST_HASH_VALUE" \
                '{name:$name,value:$value}'
            )"
            for attempt in 1 2 3; do
              current_hash="$(
                curl --fail-with-body -sS -L \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  -H "Authorization: Bearer $PERSONAL_ACCESS_TOKEN" \
                  "https://api.github.com/repos/$HASH_REPO_OWNER/$HASH_REPO_NAME/actions/variables/$LAST_HASH_NAME" |
                  jq -er '.value'
              )" || current_hash="__UNKNOWN__"
              if [ "$current_hash" = "$LAST_HASH_VALUE" ]; then
                hash_restored="true"
                break
              elif [ "$current_hash" = "$SOURCE_SHA" ]; then
                if curl --fail-with-body -sS -L -X PATCH \
                     -H "Accept: application/vnd.github+json" \
                     -H "X-GitHub-Api-Version: 2022-11-28" \
                     -H "Authorization: Bearer $PERSONAL_ACCESS_TOKEN" \
                     "https://api.github.com/repos/$HASH_REPO_OWNER/$HASH_REPO_NAME/actions/variables/$LAST_HASH_NAME" \
                     --data-binary "$old_hash_payload"; then
                  hash_restored="true"
                  break
                fi
              elif [ "$current_hash" != "__UNKNOWN__" ]; then
                echo "Refusing to overwrite a newer latest hash" >&2
                break
              fi
              sleep $((attempt * 3))
            done
            if [ "$hash_restored" != "true" ]; then
              echo "Failed to restore latest hash variable" >&2
              failed="true"
            fi
          fi
          [ "$failed" = "false" ]
        }

        promotion_started="false"
        publication_complete="false"
        hash_update_attempted="false"
        on_exit() {
          local status="$?"
          trap - EXIT
          if [ "$status" -ne 0 ] \
            && [ "$promotion_started" = "true" ] \
            && [ "$publication_complete" != "true" ]; then
            rollback_publication ||
              echo "Deployment-set rollback was incomplete" >&2
          fi
          cleanup_candidates
          exit "$status"
        }
        trap on_exit EXIT
        trap 'exit 1' INT TERM

        for image in "${images[@]}"; do
          repository="${image%:*}"
          candidate="${repository}:${candidate_tag}"
          docker tag "$image" "$candidate"
          pushed="false"
          for attempt in 1 2 3; do
            echo "Pushing deployment candidate ${candidate} (attempt ${attempt}/3)"
            if docker push "$candidate"; then
              pushed="true"
              break
            fi
            sleep $((attempt * 5))
          done
          if [ "$pushed" != "true" ]; then
            echo "Failed to push ${candidate} after 3 attempts"
            exit 1
          fi
          if ! digest="$(inspect_digest "$candidate")"; then
            echo "Could not inspect deployment candidate ${candidate}" >&2
            exit 1
          fi
          candidate_ref["$image"]="${repository}@${digest}"
        done

        for image in "${images[@]}"; do
          if ! digest="$(get_hub_tag_digest "$image")"; then
            exit 1
          fi
          old_digest["$image"]="$digest"
        done

        promotion_started="true"
        publish_failed="false"
        for image in "${images[@]}"; do
          if ! docker buildx imagetools create \
               --prefer-index=false \
               --tag "$image" "${candidate_ref[$image]}"; then
            echo "Failed to promote deployment candidate for ${image}" >&2
            publish_failed="true"
            break
          fi
          expected="${candidate_ref[$image]##*@}"
          if ! actual="$(inspect_digest "$image")"; then
            echo "Could not inspect promoted image ${image}" >&2
            publish_failed="true"
            break
          fi
          if [ "$actual" != "$expected" ]; then
            echo "Promoted digest mismatch for ${image}" >&2
            publish_failed="true"
            break
          fi
        done

        if [ "$publish_failed" = "false" ] \
          && [ "$HASH_GATE_APPLIED" = "true" ]; then
          hash_payload="$(
            jq -cn --arg name "$LAST_HASH_NAME" --arg value "$SOURCE_SHA" \
              '{name:$name,value:$value}'
          )"
          hash_update_attempted="true"
          if ! curl --fail-with-body -sS -L -X PATCH \
               -H "Accept: application/vnd.github+json" \
               -H "X-GitHub-Api-Version: 2022-11-28" \
               -H "Authorization: Bearer $PERSONAL_ACCESS_TOKEN" \
               "https://api.github.com/repos/$HASH_REPO_OWNER/$HASH_REPO_NAME/actions/variables/$LAST_HASH_NAME" \
               --data-binary "$hash_payload"; then
            echo "Failed to update latest hash after image promotion" >&2
            publish_failed="true"
          fi
        fi

        if [ "$publish_failed" = "true" ]; then
          exit 1
        fi

        publication_complete="true"

    - name: Cleanup standalone container
      if: ${{ always() }}
      run: |
        docker rm -f hg-ci-standalone >/dev/null 2>&1 || true
        docker volume rm hg-ci-standalone-data >/dev/null 2>&1 || true

    - name: Post-check cleanup
      if: ${{ always() }}
      run: |
        docker system prune -af || true
        docker builder prune -af || true
