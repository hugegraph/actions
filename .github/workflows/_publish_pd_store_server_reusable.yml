name: "Publish pd-store-server image (reusable)"

on:
  workflow_call:
    inputs:
      mode:
        description: "publish mode: latest or release"
        required: true
        type: string
      source_repository:
        description: "source repository in owner/name format"
        required: false
        default: apache/hugegraph
        type: string
      allowed_source_repositories:
        description: "comma-separated trusted source repositories"
        required: true
        type: string
      source_ref:
        description: "source branch, tag, or commit"
        required: true
        type: string
      default_source:
        description: "default source in owner/name@ref format"
        required: false
        default: ''
        type: string
      image_tag:
        description: "published image tag; empty derives from mode and source ref"
        required: false
        default: ''
        type: string
      runtime_variant:
        description: "RocksDB runtime: standard or topling (linux/amd64 only)"
        required: false
        default: standard
        type: string
      topling_jni_url:
        description: "optional immutable Topling JNI URL override (otherwise use source pin)"
        required: false
        default: ''
        type: string
      topling_jni_sha256:
        description: "trusted SHA-256 of the Topling JNI JAR"
        required: false
        default: ''
        type: string
      publish:
        description: "publish images and registry caches"
        required: false
        default: false
        type: boolean
      mvn_args:
        description: "Docker build args, one NAME=VALUE entry per line"
        required: false
        default: ''
        type: string
      strict_mode:
        description: "whether integration precheck is mandatory before publish"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "build and validate every architecture without publishing"
        required: false
        default: false
        type: boolean
      wait_timeout_sec:
        description: "docker compose wait timeout in seconds"
        required: false
        default: '300'
        type: string
      enable_hash_gate:
        description: "whether to skip latest publish if source hash unchanged"
        required: false
        default: false
        type: boolean
      last_hash_value:
        description: "last published source hash"
        required: false
        default: ''
        type: string
      last_hash_name:
        description: "repo variable name for latest hash"
        required: false
        default: ''
        type: string
      hash_repo_owner:
        description: "owner of repo storing LAST_* hash variable"
        required: false
        default: hugegraph
        type: string
      hash_repo_name:
        description: "repo name storing LAST_* hash variable"
        required: false
        default: actions
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_PASSWORD:
        required: true
      PERSONAL_ACCESS_TOKEN:
        required: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      need_update: ${{ steps.prepare.outputs.need_update }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      version_tag: ${{ steps.prepare.outputs.version_tag }}
      cache_channel: ${{ steps.prepare.outputs.cache_channel }}
      publish_images: ${{ steps.prepare.outputs.publish_images }}
      hash_gate_applied: ${{ steps.prepare.outputs.hash_gate_applied }}
    steps:
    - name: Resolve mode and source ref
      id: prepare
      env:
        MODE: ${{ inputs.mode }}
        SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        ALLOWED_SOURCE_REPOSITORIES: ${{ inputs.allowed_source_repositories }}
        SOURCE_REF: ${{ inputs.source_ref }}
        DEFAULT_SOURCE: ${{ inputs.default_source }}
        REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        PUBLISH: ${{ inputs.publish }}
        ENABLE_HASH_GATE: ${{ inputs.enable_hash_gate }}
        LAST_HASH_VALUE: ${{ inputs.last_hash_value }}
        DRY_RUN: ${{ inputs.dry_run }}
        RUNTIME_VARIANT: ${{ inputs.runtime_variant }}
        TOPLING_JNI_URL: ${{ inputs.topling_jni_url }}
        TOPLING_JNI_SHA256: ${{ inputs.topling_jni_sha256 }}
        STRICT_MODE: ${{ inputs.strict_mode }}
      run: |
        set -euo pipefail

        RUNTIME_VARIANT="${RUNTIME_VARIANT:-standard}"
        case "$RUNTIME_VARIANT" in
          standard)
            case "$REQUESTED_IMAGE_TAG" in
              *-topling) echo "Standard builds cannot use a Topling image tag"; exit 1 ;;
            esac
            ;;
          topling)
            if [ "${STRICT_MODE:-true}" != "true" ]; then
              echo "Topling builds require strict_mode=true"
              exit 1
            fi
            if [ -n "${TOPLING_JNI_URL:-}${TOPLING_JNI_SHA256:-}" ]; then
              if ! [[ "${TOPLING_JNI_URL:-}" =~ ^https://[^[:space:]]+$ ]] \
                || ! [[ "${TOPLING_JNI_SHA256:-}" =~ ^[[:xdigit:]]{64}$ ]]; then
                echo "Topling overrides require both an HTTPS URL and a trusted SHA-256"
                exit 1
              fi
            fi
            # A source-only marker cannot identify a native runtime. Manual Topling
            # runs always validate both source and the explicitly selected artifact.
            ENABLE_HASH_GATE=false
            REQUESTED_IMAGE_TAG="${REQUESTED_IMAGE_TAG%-topling}"
            ;;
          *) echo "Invalid runtime_variant: $RUNTIME_VARIANT"; exit 1 ;;
        esac

        if [ "$MODE" != "latest" ] && [ "$MODE" != "release" ]; then
          echo "Invalid mode: $MODE. Expected latest or release."
          exit 1
        fi
        if [ "$MODE" = "release" ] && [ "$DRY_RUN" = "true" ]; then
          echo "dry_run is only supported by latest mode"
          exit 1
        fi
        if [ "$SOURCE_REPOSITORY" != "apache/hugegraph" ]; then
          ENABLE_HASH_GATE=false
        fi
        if [ "$MODE" = "release" ]; then
          if [ "$SOURCE_REPOSITORY" != "apache/hugegraph" ] \
            || ! [[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Release requires one resolved apache/hugegraph commit SHA for both variants"
            exit 1
          fi
        elif [ "$PUBLISH" = "true" ] && [ "$DRY_RUN" != "true" ]; then
          if [ "$SOURCE_REPOSITORY" != "apache/hugegraph" ]; then
            if ! [[ "$REQUESTED_IMAGE_TAG" =~ ^ci-[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]]; then
              echo "Official images require apache/hugegraph; fork publication requires an explicit ci-* tag"
              exit 1
            fi
          fi
          if [[ "$REQUESTED_IMAGE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version tags must use the paired Apache release workflow"
            exit 1
          fi
        fi

        source_repository_allowed="false"
        IFS=',' read -ra allowed_repositories <<< "$ALLOWED_SOURCE_REPOSITORIES"
        for allowed_repository in "${allowed_repositories[@]}"; do
          if [ "$SOURCE_REPOSITORY" = "$allowed_repository" ]; then
            source_repository_allowed="true"
            break
          fi
        done
        if [ "$source_repository_allowed" != "true" ]; then
          echo "Source repository is not allowed: $SOURCE_REPOSITORY"
          exit 1
        fi

        if ! [[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
          if ! git check-ref-format "refs/heads/$SOURCE_REF" >/dev/null 2>&1 \
            && ! git check-ref-format "refs/tags/$SOURCE_REF" >/dev/null 2>&1; then
            echo "Invalid source ref: $SOURCE_REF"
            exit 1
          fi
        fi

        default_repository="${DEFAULT_SOURCE%@*}"
        default_ref="${DEFAULT_SOURCE#*@}"
        default_source_match="false"
        if [ -n "$DEFAULT_SOURCE" ] \
          && [ "$SOURCE_REPOSITORY" = "$default_repository" ] \
          && [ "$SOURCE_REF" = "$default_ref" ]; then
          default_source_match="true"
        fi

        source_url="https://github.com/${SOURCE_REPOSITORY}.git"
        if [[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
          source_sha="${SOURCE_REF,,}"
        else
          source_sha="$(git ls-remote "$source_url" "refs/heads/${SOURCE_REF}" \
            | awk 'NR == 1 { print $1 }')"
          if [ -z "$source_sha" ]; then
            source_sha="$(git ls-remote "$source_url" "refs/tags/${SOURCE_REF}^{}" \
              | awk 'NR == 1 { print $1 }')"
          fi
          if [ -z "$source_sha" ]; then
            source_sha="$(git ls-remote "$source_url" "refs/tags/${SOURCE_REF}" \
              | awk 'NR == 1 { print $1 }')"
          fi
        fi
        if [ -z "$source_sha" ]; then
          echo "Failed to resolve source SHA for ${SOURCE_REPOSITORY}@${SOURCE_REF}"
          exit 1
        fi

        hash_gate_applied="false"
        if [ "$MODE" = "latest" ]; then
          if [ -n "$REQUESTED_IMAGE_TAG" ]; then
            version_tag="$REQUESTED_IMAGE_TAG"
          else
            version_tag="$(
              printf '%s' "$SOURCE_REF" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//' \
              | cut -c1-110
            )"
            if [ -z "$version_tag" ]; then
              echo "Failed to derive an image tag from source ref: $SOURCE_REF"
              exit 1
            fi
            if [ "$default_source_match" = "true" ]; then
              version_tag="latest"
            fi
          fi
          publish_images="$PUBLISH"
          if [ "$DRY_RUN" = "true" ]; then
            publish_images="false"
          fi
          cache_channel="$version_tag"
          if [ "${#cache_channel}" -gt 117 ]; then
            cache_hash="$(printf '%s' "$cache_channel" | sha256sum | cut -c1-12)"
            cache_channel="${cache_channel:0:104}-${cache_hash}"
          fi
          if [ "$publish_images" != "true" ]; then
            cache_channel="latest"
          fi
          need_update="true"
          if [ "$PUBLISH" = "true" ] && [ "$DRY_RUN" != "true" ] \
            && [ "$ENABLE_HASH_GATE" = "true" ] \
            && [ -z "$REQUESTED_IMAGE_TAG" ] \
            && [ "$default_source_match" = "true" ]; then
            hash_gate_applied="true"
          fi
          if [ "$hash_gate_applied" = "true" ] && [ "$source_sha" = "$LAST_HASH_VALUE" ]; then
            need_update="false"
          fi
        else
          version_tag="$REQUESTED_IMAGE_TAG"
          if ! [[ "$version_tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release image_tag: $version_tag. Expected x.y.z."
            exit 1
          fi
          need_update="true"
          cache_channel="release"
          publish_images="$PUBLISH"
        fi

        if [ "$RUNTIME_VARIANT" = "topling" ]; then
          version_tag="${version_tag}-topling"
          cache_channel="${cache_channel}-topling"
          if [ "${#cache_channel}" -gt 117 ]; then
            cache_hash="$(printf '%s' "$cache_channel" | sha256sum | cut -c1-12)"
            cache_channel="${cache_channel:0:104}-${cache_hash}"
          fi
        fi
        if ! [[ "$version_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
          echo "Invalid image tag: $version_tag"
          exit 1
        fi
        if [ "$MODE" = "latest" ] && [ "$PUBLISH" = "true" ] \
          && [ "$default_source_match" != "true" ] \
          && [ -z "$REQUESTED_IMAGE_TAG" ]; then
          echo "image_tag is required when publishing a non-default source"
          exit 1
        fi

        {
          echo "source_sha=$source_sha"
          echo "version_tag=$version_tag"
          echo "cache_channel=$cache_channel"
          echo "publish_images=$publish_images"
          echo "need_update=$need_update"
          echo "hash_gate_applied=$hash_gate_applied"
        } >> "$GITHUB_OUTPUT"

    - name: Summarize build cache strategy
      env:
        CACHE_CHANNEL: ${{ steps.prepare.outputs.cache_channel }}
        PUBLISH_IMAGES: ${{ steps.prepare.outputs.publish_images }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        {
          echo "## PD / Store / Server image build"
          echo
          echo "- Cache backend: Docker Hub registry (BuildKit)"
          echo "- Cache channel: \`$CACHE_CHANNEL\`"
          echo "- Publish images: \`$PUBLISH_IMAGES\`"
          echo "- Dry run: \`$DRY_RUN\`"
          echo "- Runtime: \`${{ inputs.runtime_variant }}\` (Topling: amd64; standard: amd64 + arm64)"
          if [ "$PUBLISH_IMAGES" = "true" ]; then
          echo "- Cache writer: tested multi-platform candidate job"
          else
            echo "- Cache policy: read-only validation (no registry exports)"
          fi
          echo "- Build strategy: shared Bake graph when supported, serial compatibility fallback otherwise"
          echo "- Test platform: locally loaded amd64 variants from the final multi-platform tags"
          echo "- Shared build cache: \`hugegraph/hugegraph:shared-$CACHE_CHANNEL\`"
          echo "- Compatibility caches: \`buildcache-$CACHE_CHANNEL\`"
        } >> "$GITHUB_STEP_SUMMARY"

  build_test_publish_multiarch:
    needs: prepare
    if: ${{ needs.prepare.outputs.need_update == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: publish-pd-store-server-${{ needs.prepare.outputs.version_tag }}
      cancel-in-progress: false
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_URL: https://github.com/${{ inputs.source_repository }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      MVN_ARGS: ${{ inputs.mvn_args }}
      WAIT_TIMEOUT_SEC: ${{ inputs.wait_timeout_sec }}
      VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
      CACHE_CHANNEL: ${{ needs.prepare.outputs.cache_channel }}
      PUBLISH_IMAGES: ${{ needs.prepare.outputs.publish_images }}
      RUNTIME_VARIANT: ${{ inputs.runtime_variant }}
      TOPLING_JNI_URL: ${{ inputs.topling_jni_url }}
      TOPLING_JNI_SHA256: ${{ inputs.topling_jni_sha256 }}
      PD_IMAGE: hugegraph/pd:${{ needs.prepare.outputs.version_tag }}
      STORE_IMAGE: hugegraph/store:${{ needs.prepare.outputs.version_tag }}
      HSTORE_IMAGE: hugegraph/server:${{ needs.prepare.outputs.version_tag }}
      STANDALONE_IMAGE: hugegraph/hugegraph:${{ needs.prepare.outputs.version_tag }}
    steps:
    - name: Validate wait timeout
      run: |
        if ! [[ "$WAIT_TIMEOUT_SEC" =~ ^[0-9]+$ ]] || [ "$WAIT_TIMEOUT_SEC" -lt 30 ] || [ "$WAIT_TIMEOUT_SEC" -gt 1800 ]; then
          echo "Invalid wait_timeout_sec: $WAIT_TIMEOUT_SEC. Expected integer between 30 and 1800."
          exit 1
        fi

    - name: Checkout source
      uses: actions/checkout@v7
      with:
        repository: ${{ env.SOURCE_REPOSITORY }}
        ref: ${{ env.SOURCE_SHA }}
        fetch-depth: 2
        persist-credentials: false

    - name: Resolve pinned Topling artifact
      if: ${{ inputs.runtime_variant == 'topling' }}
      run: |
        set -euo pipefail
        if [ -z "$TOPLING_JNI_URL$TOPLING_JNI_SHA256" ]; then
          pin=docker/topling-runtime.env
          test -f "$pin" || { echo "Source lacks $pin; supply an explicit JNI URL and SHA-256"; exit 1; }
          # Read data, never execute shell from the selected source revision.
          declare -A seen=()
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in ''|\#*) continue ;; esac
            key="${line%%=*}"
            value="${line#*=}"
            case "$key" in
              TOPLING_JNI_URL|TOPLING_JNI_SHA256)
                if [ "${seen[$key]:-false}" = true ]; then echo "Duplicate artifact pin: $key"; exit 1; fi
                seen[$key]=true
                printf -v "$key" '%s' "$value"
                ;;
              *) echo "Invalid artifact pin key: $key"; exit 1 ;;
            esac
          done < "$pin"
        fi
        if ! [[ "$TOPLING_JNI_URL" =~ ^https://[^[:space:]]+$ ]] \
          || ! [[ "$TOPLING_JNI_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
          echo "Topling artifact pin requires an HTTPS URL and a trusted SHA-256"
          exit 1
        fi
        {
          echo "TOPLING_JNI_URL=$TOPLING_JNI_URL"
          echo "TOPLING_JNI_SHA256=${TOPLING_JNI_SHA256,,}"
        } >> "$GITHUB_ENV"

    - name: Set up Docker with containerd image store
      uses: docker/setup-docker-action@v5
      with:
        daemon-config: |
          {
            "features": {
              "containerd-snapshotter": true
            }
          }

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        version: latest

    - name: Validate source-provided Bake graph
      if: ${{ hashFiles('docker/bake.hcl') != '' }}
      env:
        IMAGE_TAG: ${{ needs.prepare.outputs.version_tag }}
        SOURCE_REVISION: ${{ needs.prepare.outputs.source_sha }}
        EXPORT_CACHE: ${{ needs.prepare.outputs.publish_images }}
      run: |
        set -euo pipefail

        bake_print_command=(
          docker buildx bake
          --file docker/bake.hcl
          --print
        )
        expected_build_args='{"MAVEN_ARGS":""}'
        # Older source graphs remain valid for standard builds. Topling must
        # explicitly expose the runtime argument; ignoring it is a hard failure.
        if grep -q 'variable "RUNTIME_VARIANT"' docker/bake.hcl; then
          expected_build_args="$(jq -cn --argjson args "$expected_build_args" \
            --arg runtime "$RUNTIME_VARIANT" --arg source "$SOURCE_URL" \
            '$args + {RUNTIME_VARIANT:$runtime,SOURCE_REPOSITORY:$source}')"
          for arg in TOPLING_JNI_URL TOPLING_JNI_SHA256; do
            if [ -n "${!arg}" ]; then
              expected_build_args="$(jq -cn --argjson args "$expected_build_args" \
                --arg name "$arg" --arg value "${!arg}" '$args + {($name):$value}')"
            fi
          done
        elif [ "$RUNTIME_VARIANT" = "topling" ]; then
          echo "This source does not support Topling image builds"
          exit 1
        fi
        while IFS= read -r build_arg; do
          if [ -z "$build_arg" ]; then
            continue
          fi
          build_arg_name="${build_arg%%=*}"
          if [ "$build_arg_name" = "$build_arg" ] \
            || ! [[ "$build_arg_name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "Invalid mvn_args entry; expected one NAME=VALUE build argument per line"
            exit 1
          fi
          if [[ "$build_arg_name" =~ ^(SOURCE_REVISION|SOURCE_REPOSITORY|RUNTIME_VARIANT|TOPLING_JNI_URL|TOPLING_JNI_SHA256)$ ]]; then
            echo "mvn_args must not override reserved runtime/source build arguments"
            exit 1
          fi
          bake_print_command+=(
            --set "*.args.${build_arg_name}=${build_arg#*=}"
          )
          expected_build_args="$(
            jq -cn \
              --argjson current "$expected_build_args" \
              --arg name "$build_arg_name" \
              --arg value "${build_arg#*=}" \
              'def bake_print_value:
                gsub("\\$\\{"; "$${") | gsub("%\\{"; "%%{");
              $current + {($name): ($value | bake_print_value)}'
          )"
        done <<< "$MVN_ARGS"

        # Empty workflow inputs must leave optional Bake arguments unset.
        for arg in TOPLING_JNI_URL TOPLING_JNI_SHA256; do
          if [ -z "${!arg}" ]; then unset "$arg"; fi
        done
        "${bake_print_command[@]}" > /tmp/hugegraph-bake.json
        jq -e \
          --arg source_revision "$SOURCE_REVISION" \
          --arg image_tag "$VERSION_TAG" \
          --arg cache_channel "$CACHE_CHANNEL" \
          --arg runtime_variant "$RUNTIME_VARIANT" \
          --argjson expected_build_args "$expected_build_args" \
          --argjson export_cache "$EXPORT_CACHE" '
          def registry_cache($ref): {ref: $ref, type: "registry"};
          def runtime_target($dockerfile; $tag; $legacy_cache):
            .context == "." and
            .dockerfile == $dockerfile and
            .tags == [$tag] and
            .platforms == (if $runtime_variant == "topling" then ["linux/amd64"] else ["linux/amd64", "linux/arm64"] end) and
            .output == [{type: "docker"}] and
            .["cache-from"] == [
              registry_cache("hugegraph/hugegraph:shared-" + $cache_channel),
              registry_cache($legacy_cache + $cache_channel)
            ] and
            ((.["cache-to"] // []) == (if $export_cache then [
              {
                mode: "min",
                ref: ($legacy_cache + $cache_channel),
                type: "registry"
              }
            ] else [] end)) and
            .args == ($expected_build_args + {
              SOURCE_REVISION: $source_revision
            }) and
            ((keys - [
              "args", "cache-from", "cache-to", "context", "dockerfile",
              "output", "platforms", "tags"
            ]) == []);

          .group.default.targets == [
            "build-cache", "pd", "server-hstore", "server-standalone", "store"
          ] and
          (.target | keys) == [
            "build-cache", "pd", "server-hstore", "server-standalone", "store"
          ] and
          (.target["build-cache"] |
            .context == "." and
            .dockerfile == "hugegraph-pd/Dockerfile" and
            .target == "build" and
            .platforms == (if $runtime_variant == "topling" then ["linux/amd64"] else ["linux/amd64", "linux/arm64"] end) and
            .output == [{type: "cacheonly"}] and
            .["cache-from"] == [
              registry_cache("hugegraph/hugegraph:shared-" + $cache_channel),
              registry_cache("hugegraph/pd:buildcache-" + $cache_channel)
            ] and
            ((.["cache-to"] // []) == (if $export_cache then [
              {
                mode: "max",
                ref: ("hugegraph/hugegraph:shared-" + $cache_channel),
                type: "registry"
              }
            ] else [] end)) and
            .args == ($expected_build_args + {
              SOURCE_REVISION: $source_revision
            }) and
            ((keys - [
              "args", "cache-from", "cache-to", "context", "dockerfile",
              "output", "platforms", "target"
            ]) == [])) and
          (.target.pd |
            runtime_target(
              "hugegraph-pd/Dockerfile";
              "hugegraph/pd:" + $image_tag;
              "hugegraph/pd:buildcache-"
            )) and
          (.target.store |
            runtime_target(
              "hugegraph-store/Dockerfile";
              "hugegraph/store:" + $image_tag;
              "hugegraph/store:buildcache-"
            )) and
          (.target["server-hstore"] |
            runtime_target(
              "hugegraph-server/Dockerfile-hstore";
              "hugegraph/server:" + $image_tag;
              "hugegraph/server:buildcache-"
            )) and
          (.target["server-standalone"] |
            runtime_target(
              "hugegraph-server/Dockerfile";
              "hugegraph/hugegraph:" + $image_tag;
              "hugegraph/hugegraph:buildcache-"
            ))
        ' /tmp/hugegraph-bake.json

    - name: Login to Docker Hub
      if: ${{ needs.prepare.outputs.publish_images == 'true' }}
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Precheck cleanup
      run: |
        docker system prune -af || true
        docker builder prune -af || true

    - name: Build multi-platform candidates with retries
      id: build
      run: |
        set -euo pipefail

        build_started_at="$(date +%s)"
        build_args=()
        while IFS= read -r build_arg; do
          if [ -z "$build_arg" ]; then
            continue
          fi
          build_arg_name="${build_arg%%=*}"
          if [ "$build_arg_name" = "$build_arg" ] \
            || ! [[ "$build_arg_name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "Invalid mvn_args entry; expected one NAME=VALUE build argument per line"
            exit 1
          fi
          if [[ "$build_arg_name" =~ ^(SOURCE_REVISION|SOURCE_REPOSITORY|RUNTIME_VARIANT|TOPLING_JNI_URL|TOPLING_JNI_SHA256)$ ]]; then
            echo "mvn_args must not override reserved runtime/source build arguments"
            exit 1
          fi
          build_args+=("$build_arg")
        done <<< "$MVN_ARGS"

        build_candidate() {
          local module="$1" image="$2" dockerfile="$3" cache_repo="$4"
          local attempt succeeded
          local -a build_command
          succeeded="false"

          for attempt in 1 2 3; do
            echo "Building ${module} (attempt ${attempt}/3) at $(date -u +%FT%TZ)"
            build_command=(
              docker buildx build
              --file "$dockerfile"
              --platform "linux/amd64,linux/arm64"
              --tag "$image"
              --cache-from "type=registry,ref=${cache_repo}:buildcache-${CACHE_CHANNEL}"
              --load
              --build-arg "SOURCE_REVISION=${SOURCE_SHA}"
            )
            if [ "$PUBLISH_IMAGES" = "true" ]; then
              build_command+=(
                --cache-to "type=registry,ref=${cache_repo}:buildcache-${CACHE_CHANNEL},mode=max"
              )
            fi
            for build_arg in "${build_args[@]}"; do
              build_command+=(--build-arg "$build_arg")
            done
            build_command+=(.)

            if "${build_command[@]}"; then
              succeeded="true"
              echo "Built ${module} at $(date -u +%FT%TZ)"
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed for ${module}; retrying with cached layers"
              sleep $((attempt * 5))
            fi
          done

          if [ "$succeeded" != "true" ]; then
            echo "Failed to build ${module} after 3 attempts"
            return 1
          fi
        }

        if [ -f docker/bake.hcl ]; then
          echo "Using source-provided shared Buildx Bake graph"
          for arg in TOPLING_JNI_URL TOPLING_JNI_SHA256; do
            if [ -z "${!arg}" ]; then unset "$arg"; fi
          done
          bake_command=(
            docker buildx bake
            --file docker/bake.hcl
            --progress=plain
          )
          for build_arg in "${build_args[@]}"; do
            build_arg_name="${build_arg%%=*}"
            bake_command+=(
              --set "*.args.${build_arg_name}=${build_arg#*=}"
            )
          done

          built="false"
          for attempt in 1 2 3; do
            echo "Building all candidates with Bake (attempt ${attempt}/3) at $(date -u +%FT%TZ)"
            if "${bake_command[@]}"; then
              built="true"
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Bake failed; retrying with completed BuildKit layers"
              sleep $((attempt * 5))
            fi
          done
          if [ "$built" != "true" ]; then
            echo "Failed to build candidates with Bake after 3 attempts"
            exit 1
          fi
        else
          if [ "$RUNTIME_VARIANT" = "topling" ]; then
            echo "Topling builds require a source-provided docker/bake.hcl"
            exit 1
          fi
          echo "docker/bake.hcl is unavailable; using serial compatibility build"
          build_candidate pd "$PD_IMAGE" ./hugegraph-pd/Dockerfile hugegraph/pd
          build_candidate store "$STORE_IMAGE" ./hugegraph-store/Dockerfile hugegraph/store
          build_candidate server-hstore "$HSTORE_IMAGE" ./hugegraph-server/Dockerfile-hstore hugegraph/server
          build_candidate server-standalone "$STANDALONE_IMAGE" ./hugegraph-server/Dockerfile hugegraph/hugegraph
        fi

        build_duration_seconds="$(( $(date +%s) - build_started_at ))"
        echo "build_duration_seconds=$build_duration_seconds" >> "$GITHUB_OUTPUT"
        echo "Built all multi-platform candidates in ${build_duration_seconds}s"
      env:
        IMAGE_TAG: ${{ needs.prepare.outputs.version_tag }}
        SOURCE_REVISION: ${{ needs.prepare.outputs.source_sha }}
        EXPORT_CACHE: ${{ needs.prepare.outputs.publish_images }}

    - name: Summarize candidate build timing
      env:
        BUILD_DURATION_SECONDS: ${{ steps.build.outputs.build_duration_seconds }}
      run: |
        {
          echo
          echo "## Candidate build timing"
          echo
          echo "- Duration: \`${BUILD_DURATION_SECONDS}s\`"
          if [ -f docker/bake.hcl ]; then
            echo "- Strategy: shared Buildx Bake graph"
          else
            echo "- Strategy: serial compatibility fallback"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Verify locally loaded platform variants
      run: |
        set -euo pipefail
        for image in "$PD_IMAGE" "$STORE_IMAGE" "$HSTORE_IMAGE" "$STANDALONE_IMAGE"; do
          docker image inspect --platform linux/amd64 "$image" >/dev/null
          if [ "$RUNTIME_VARIANT" = "standard" ]; then
            docker image inspect --platform linux/arm64 "$image" >/dev/null
          fi
          echo "Loaded requested platform variants: ${image}"
        done

    - name: Verify Topling image selection
      if: ${{ inputs.runtime_variant == 'topling' }}
      run: |
        set -euo pipefail
        for image in "$PD_IMAGE" "$STORE_IMAGE" "$STANDALONE_IMAGE"; do
          test "$(docker image inspect --format '{{index .Config.Labels "org.apache.hugegraph.rocksdb-runtime"}}' "$image")" = topling
        done
        test "$(docker image inspect --format '{{index .Config.Labels "org.apache.hugegraph.rocksdb-runtime"}}' "$HSTORE_IMAGE")" = hstore

    - name: Build stock RocksDB images for compatibility seeding
      if: ${{ inputs.runtime_variant == 'topling' }}
      env:
        SOURCE_REVISION: ${{ needs.prepare.outputs.source_sha }}
      run: |
        set -euo pipefail
        seed_tag="ci-rocksdb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        # Reuse this source's Maven stages and completed Bake cache. Seed images
        # stay local and need only the architecture used by the functional tests.
        bake_command=(docker buildx bake --file docker/bake.hcl --progress=plain
          --set '*.platform=linux/amd64')
        while IFS= read -r build_arg; do
          if [ -n "$build_arg" ]; then
            bake_command+=(--set "*.args.${build_arg%%=*}=${build_arg#*=}")
          fi
        done <<< "$MVN_ARGS"
        unset TOPLING_JNI_URL TOPLING_JNI_SHA256
        RUNTIME_VARIANT=standard IMAGE_TAG="$seed_tag" EXPORT_CACHE=false \
          "${bake_command[@]}" pd store server-standalone
        for component in pd store hugegraph; do
          image="hugegraph/$component:$seed_tag"
          docker image inspect --platform linux/amd64 "$image" \
            | jq -e --arg source "$SOURCE_URL" --arg revision "$SOURCE_SHA" '
              .[0].Config.Labels |
              .["org.opencontainers.image.source"] == $source and
              .["org.opencontainers.image.revision"] == $revision and
              .["org.apache.hugegraph.rocksdb-runtime"] == "standard"'
        done
        {
          echo "STANDARD_PD_IMAGE=hugegraph/pd:$seed_tag"
          echo "STANDARD_STORE_IMAGE=hugegraph/store:$seed_tag"
          echo "STANDARD_STANDALONE_IMAGE=hugegraph/hugegraph:$seed_tag"
        } >> "$GITHUB_ENV"

    - name: Start compose stack with local images
      if: ${{ inputs.strict_mode }}
      run: |
        HUGEGRAPH_ADMIN_PASSWORD="$(openssl rand -hex 16)"
        echo "::add-mask::$HUGEGRAPH_ADMIN_PASSWORD"
        echo "HUGEGRAPH_ADMIN_PASSWORD=$HUGEGRAPH_ADMIN_PASSWORD" >> "$GITHUB_ENV"
        export HUGEGRAPH_ADMIN_PASSWORD

        HUGEGRAPH_AUTH_TOKEN_SECRET="$(openssl rand -hex 32)"
        echo "::add-mask::$HUGEGRAPH_AUTH_TOKEN_SECRET"
        echo "HUGEGRAPH_AUTH_TOKEN_SECRET=$HUGEGRAPH_AUTH_TOKEN_SECRET" >> "$GITHUB_ENV"
        export HUGEGRAPH_AUTH_TOKEN_SECRET

        # The HStore topology requires the PD REST secret during interpolation,
        # so every later compose command (logs, down) needs it too. Older source
        # revisions ignore it. Hex keeps it printable ASCII, as Hubble requires.
        HG_PD_AUTH_SECRET_KEY="$(openssl rand -hex 24)"
        echo "::add-mask::$HG_PD_AUTH_SECRET_KEY"
        echo "HG_PD_AUTH_SECRET_KEY=$HG_PD_AUTH_SECRET_KEY" >> "$GITHUB_ENV"
        export HG_PD_AUTH_SECRET_KEY

        if [ -f "docker/docker-compose-hstore.yml" ] \
          && [ -f "docker/docker-compose.dev.yml" ]; then
          # The current HugeGraph dev file is a thin HStore override. Keep the
          # base topology in the command so its networks and named volumes are
          # defined before the override is applied.
          compose_file="docker/docker-compose-hstore.yml"
          compose_dev_file="docker/docker-compose.dev.yml"
        elif [ -f "docker/docker-compose.dev.yml" ]; then
          # Older source revisions may still ship a self-contained dev file.
          compose_file="docker/docker-compose.dev.yml"
          compose_dev_file=""
        elif [ -f "docker/docker-compose.yml" ]; then
          compose_file="docker/docker-compose.yml"
          compose_dev_file=""
          echo "WARN: docker/docker-compose.dev.yml is unavailable; using legacy docker/docker-compose.yml"
        else
          echo "ERROR: no supported compose file found in $SOURCE_REPOSITORY@$SOURCE_SHA"
          echo "Expected docker/docker-compose-hstore.yml plus docker/docker-compose.dev.yml,"
          echo "or a self-contained docker/docker-compose.dev.yml or docker/docker-compose.yml."
          exit 1
        fi
        echo "COMPOSE_FILE=$compose_file" >> "$GITHUB_ENV"
        echo "COMPOSE_DEV_FILE=$compose_dev_file" >> "$GITHUB_ENV"

        # Hubble in the HStore topology mounts a gitignored properties file that
        # carries the PD secret, with create_host_path: false, so it must exist
        # before compose up. Older source revisions mount a tracked file instead.
        if [ "$compose_file" = "docker/docker-compose-hstore.yml" ] \
          && [ -f "docker/set-hubble-pd-password.sh" ]; then
          bash docker/set-hubble-pd-password.sh hstore
        fi

        cat > /tmp/hg-ci-patch-server-config.sh <<'PATCH_SERVER'
        #!/usr/bin/env bash
        set -euo pipefail

        set_property() {
          local file="$1" key="$2" value="$3" escaped
          escaped=${key//./\.}
          if grep -qE "^[[:space:]]*${escaped}[[:space:]]*=" "$file"; then
            sed -E -i "s|^[[:space:]]*${escaped}[[:space:]]*=.*|${key}=${value}|" "$file"
          else
            printf '%s=%s\n' "$key" "$value" >> "$file"
          fi
        }

        set_yaml_scalar() {
          local file="$1" key="$2" value="$3"
          if grep -qE "^[[:space:]]*${key}:" "$file"; then
            sed -E -i "s|^([[:space:]]*)${key}:.*|\1${key}: ${value}|" "$file"
          else
            printf '%s: %s\n' "$key" "$value" >> "$file"
          fi
        }

        set_property ./conf/rest-server.properties batch.max_write_threads 4
        set_property ./conf/rest-server.properties restserver.min_free_memory 32
        set_yaml_scalar ./conf/gremlin-server.yaml threadPoolWorker 4
        set_yaml_scalar ./conf/gremlin-server.yaml gremlinPool 4

        echo "Applied CI Server resource configuration"
        exec ./docker-entrypoint.sh
        PATCH_SERVER
        chmod 755 /tmp/hg-ci-patch-server-config.sh

        cat > /tmp/docker-compose.ci.override.yml <<COMPOSE_OVERRIDE
        services:
          pd:
            image: ${PD_IMAGE}
            container_name: hg-pd
            pull_policy: never
            mem_limit: 1024m
            cpus: 2.0
            environment:
              JAVA_OPTS: >-
                -Xms128m -Xmx128m
                -XX:ActiveProcessorCount=2
                -XX:MaxMetaspaceSize=192m
                -XX:MaxDirectMemorySize=128m
                -XX:+UseContainerSupport
                -Dlog4j2.asyncLoggerConfigRingBufferSize=8192
                -DAsyncLoggerConfig.RingBufferSize=8192
                -Dthread.pool.grpc.core=8
                -Dthread.pool.grpc.max=32
                -Dthread.pool.grpc.queue=512
                -Djob.interruptableThreadPool.core=1
                -Djob.interruptableThreadPool.max=8
                -Djob.interruptableThreadPool.queue=256
                -Djob.uninterruptibleThreadPool.core=0
                -Djob.uninterruptibleThreadPool.max=4
                -Djob.uninterruptibleThreadPool.queue=128
                -Dpartition.default-shard-count=1
                -Dpartition.store-max-shard-count=12
          store:
            image: ${STORE_IMAGE}
            container_name: hg-store
            pull_policy: never
            mem_limit: 1024m
            cpus: 2.0
            environment:
              JAVA_OPTS: >-
                -Xms128m -Xmx128m
                -XX:ActiveProcessorCount=2
                -XX:MaxMetaspaceSize=192m
                -XX:MaxDirectMemorySize=128m
                -XX:+UseContainerSupport
                -Dlog4j2.asyncLoggerConfigRingBufferSize=8192
                -DAsyncLoggerConfig.RingBufferSize=8192
                -Drocksdb.total_memory_size=134217728
                -Drocksdb.write_buffer_size=2097152
                -Drocksdb.min_write_buffer_number_to_merge=2
                -Dthread.pool.grpc.core=8
                -Dthread.pool.grpc.max=32
                -Dthread.pool.grpc.queue=512
                -Dthread.pool.scan.core=4
                -Dthread.pool.scan.max=16
                -Dthread.pool.scan.queue=256
                -Djob.interruptableThreadPool.core=2
                -Djob.interruptableThreadPool.max=8
                -Djob.interruptableThreadPool.queue=256
                -Djob.uninterruptibleThreadPool.core=0
                -Djob.uninterruptibleThreadPool.max=4
                -Djob.uninterruptibleThreadPool.queue=128
                -Dquery.push-down.threads=8
                -Dquery.push-down.fetch_batch=1000
                -Dquery.push-down.fetch_timeout=30000
                -Dquery.push-down.memory_limit_count=10000
                -Dquery.push-down.index_size_limit_count=10000
                -Draft.disruptorBufferSize=512
                -Draft.metrics=false
                -Draft.maxReplicatorInflightMsgs=32
                -Draft.maxEntriesSize=64
                -Draft.maxBodySize=262144
          server:
            image: ${HSTORE_IMAGE}
            container_name: hg-server
            pull_policy: never
            mem_limit: 1536m
            cpus: 4.0
            entrypoint:
              - /usr/bin/dumb-init
              - "--"
              - /opt/hg-ci/patch-server-config.sh
            environment:
              JAVA_OPTS: >-
                -Xms256m -Xmx384m
                -XX:ActiveProcessorCount=4
                -XX:MaxMetaspaceSize=256m
                -XX:MaxDirectMemorySize=128m
                -XX:+UseContainerSupport
                -Dlog4j2.asyncLoggerConfigRingBufferSize=8192
                -DAsyncLoggerConfig.RingBufferSize=8192
            volumes:
              - type: bind
                source: /tmp/hg-ci-patch-server-config.sh
                target: /opt/hg-ci/patch-server-config.sh
                read_only: true
        COMPOSE_OVERRIDE

        compose_args=(-f "$compose_file")
        if [ -n "$compose_dev_file" ]; then
          compose_args+=(-f "$compose_dev_file")
        fi
        if [ "$RUNTIME_VARIANT" = topling ]; then
          cat > /tmp/docker-compose.ci.rocksdb.yml <<ROCKSDB_OVERRIDE
        services:
          pd:
            image: ${STANDARD_PD_IMAGE}
          store:
            image: ${STANDARD_STORE_IMAGE}
        ROCKSDB_OVERRIDE
          compose_args+=(-f /tmp/docker-compose.ci.override.yml -f /tmp/docker-compose.ci.rocksdb.yml)
        else
          compose_args+=(-f /tmp/docker-compose.ci.override.yml)
        fi
        docker compose \
          -p hg-ci-precheck \
          "${compose_args[@]}" \
          up -d --no-build --wait --wait-timeout "$WAIT_TIMEOUT_SEC"

        docker compose -p hg-ci-precheck "${compose_args[@]}" ps

    - name: Verify CI resource limits
      if: ${{ inputs.strict_mode }}
      run: |
        set -euo pipefail

        assert_memory_limit() {
          local container="$1" expected_bytes="$2" actual_bytes
          actual_bytes="$(docker inspect --format '{{.HostConfig.Memory}}' "$container")"
          if [ "$actual_bytes" != "$expected_bytes" ]; then
            echo "Unexpected memory limit for ${container}: expected ${expected_bytes}, got ${actual_bytes}"
            exit 1
          fi
          echo "${container} memory limit: ${actual_bytes} bytes"
        }

        assert_memory_limit hg-pd 1073741824
        assert_memory_limit hg-store 1073741824
        assert_memory_limit hg-server 1610612736

        for container in hg-pd hg-store hg-server; do
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$container" \
            | grep '^JAVA_OPTS='
          docker exec "$container" bash -lc "ps -eo args | grep '[j]ava'"
        done
        docker exec hg-server grep -E \
          '^(batch.max_write_threads|restserver.min_free_memory)=' \
          /hugegraph-server/conf/rest-server.properties
        docker exec hg-server grep -E \
          '^[[:space:]]*(threadPoolWorker|gremlinPool):' \
          /hugegraph-server/conf/gremlin-server.yaml

        docker stats --no-stream hg-pd hg-store hg-server

    - name: Verify integration endpoints
      if: ${{ inputs.strict_mode }}
      run: |
        curl -fsS --connect-timeout 3 --max-time 8 "http://127.0.0.1:8620/v1/health" >/dev/null
        curl -fsS --connect-timeout 3 --max-time 8 "http://127.0.0.1:8520/v1/health" >/dev/null
        curl -fsS --connect-timeout 3 --max-time 8 "http://127.0.0.1:8080/versions" >/dev/null

    - name: Verify stock RocksDB seed runtimes
      if: ${{ inputs.runtime_variant == 'topling' }}
      run: |
        set -euo pipefail
        for component in pd store; do
          docker exec "hg-$component" bash -euc '
            test ! -d "/hugegraph-$1/topling"
            pid=$(pgrep -o -x java)
            grep -F librocksdbjni "/proc/$pid/maps"
            ! grep -F /topling/ "/proc/$pid/maps"
          ' -- "$component"
        done
        docker exec hg-server bash -euc '
          test ! -d /hugegraph-server/topling
          grep -Eq "^backend[[:space:]]*=[[:space:]]*hstore" /hugegraph-server/conf/graphs/hugegraph.properties
        '

    - name: Import bundled example graph
      if: ${{ inputs.strict_mode }}
      run: |
        set -euo pipefail

        docker exec hg-server test -r /hugegraph-server/scripts/example.groovy
        docker exec hg-server bash -lc \
          'cd /hugegraph-server && bin/gremlin-console.sh -- -e scripts/example.groovy' \
          | tee /tmp/hg-ci-example-import.log

        grep -Fq '>>>> query all vertices: size=6' /tmp/hg-ci-example-import.log
        grep -Fq '>>>> query all edges: size=6' /tmp/hg-ci-example-import.log

    - name: Verify bundled graph with Gremlin CRUD
      if: ${{ inputs.strict_mode }}
      env:
        CI_VERTEX_NAME: hg-ci-${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        set -euo pipefail

        gremlin_request() {
          local label="$1" script="$2" payload response_file
          response_file="/tmp/hg-ci-gremlin-${label}.json"
          payload="$(
            jq -nc --arg gremlin "$script" \
              '{gremlin:$gremlin,bindings:{},language:"gremlin-groovy",aliases:{graph:"DEFAULT-hugegraph",g:"__g_DEFAULT-hugegraph"}}'
          )"
          curl --fail-with-body -sS \
            --compressed \
            --connect-timeout 3 \
            --max-time 30 \
            --user "admin:$HUGEGRAPH_ADMIN_PASSWORD" \
            -H 'Content-Type: application/json' \
            --data-binary "$payload" \
            http://127.0.0.1:8080/gremlin \
            | tee "$response_file"
          jq -e '.status.code == 200' "$response_file" >/dev/null
        }

        baseline_script="[[vertices:g.V().count().next(),edges:g.E().count().next(),names:g.V().values('name').order().toList(),markoCreated:g.V().has('person','name','marko').out('created').values('name').order().toList()]]"
        gremlin_request baseline "$baseline_script"
        jq -e '
          .result.data[0].vertices == 6 and
          .result.data[0].edges == 6 and
          .result.data[0].names == ["josh","lop","marko","peter","ripple","vadas"] and
          .result.data[0].markoCreated == ["lop"]
        ' /tmp/hg-ci-gremlin-baseline.json >/dev/null

        create_script="ci=graph.addVertex(T.label,'person','name','${CI_VERTEX_NAME}','age',40,'city','CI');marko=g.V().has('person','name','marko').next();marko.addEdge('knows',ci,'date','ci','weight',0.1d);graph.tx().commit();'${CI_VERTEX_NAME}'"
        gremlin_request create "$create_script"
        jq -e --arg name "$CI_VERTEX_NAME" '.result.data == [$name]' \
          /tmp/hg-ci-gremlin-create.json >/dev/null

        read_created_script="[[vertices:g.V().count().next(),edges:g.E().count().next(),matches:g.V().has('person','name','marko').out('knows').has('name','${CI_VERTEX_NAME}').count().next()]]"
        gremlin_request read-created "$read_created_script"
        jq -e '
          .result.data[0].vertices == 7 and
          .result.data[0].edges == 7 and
          .result.data[0].matches == 1
        ' /tmp/hg-ci-gremlin-read-created.json >/dev/null

        update_script="g.V().has('person','name','${CI_VERTEX_NAME}').property('age',41).iterate();graph.tx().commit();g.V().has('person','name','${CI_VERTEX_NAME}').values('age').next()"
        gremlin_request update "$update_script"
        jq -e '.result.data == [41]' /tmp/hg-ci-gremlin-update.json >/dev/null

        delete_script="ci=g.V().has('person','name','${CI_VERTEX_NAME}').next();g.V(ci).bothE().drop().iterate();g.V(ci).drop().iterate();graph.tx().commit();[[vertices:g.V().count().next(),edges:g.E().count().next()]]"
        gremlin_request delete "$delete_script"
        jq -e '
          .result.data[0].vertices == 6 and
          .result.data[0].edges == 6
        ' /tmp/hg-ci-gremlin-delete.json >/dev/null

        gremlin_request final "$baseline_script"
        jq -e '
          .result.data[0].vertices == 6 and
          .result.data[0].edges == 6 and
          .result.data[0].names == ["josh","lop","marko","peter","ripple","vadas"]
        ' /tmp/hg-ci-gremlin-final.json >/dev/null

        docker stats --no-stream hg-pd hg-store hg-server

    - name: Switch existing distributed RocksDB data to Topling
      if: ${{ inputs.runtime_variant == 'topling' }}
      run: |
        set -euo pipefail
        compose_args=(-f "$COMPOSE_FILE")
        if [ -n "$COMPOSE_DEV_FILE" ]; then
          compose_args+=(-f "$COMPOSE_DEV_FILE")
        fi
        compose_args+=(-f /tmp/docker-compose.ci.override.yml)

        stop_normally() {
          docker compose -p hg-ci-precheck "${compose_args[@]}" stop -t 60
          for container in hg-pd hg-store hg-server; do
            test "$(docker inspect --format '{{.State.OOMKilled}}' "$container")" = false
            case "$(docker inspect --format '{{.State.ExitCode}}' "$container")" in
              0|143) ;; *) echo "$container did not stop normally"; exit 1 ;;
            esac
          done
        }
        data_volume() {
          docker inspect --format \
            '{{range .Mounts}}{{if eq .Destination "'"$2"'"}}{{.Name}}{{end}}{{end}}' "$1"
        }
        gremlin_request() {
          local payload
          payload="$(jq -nc --arg gremlin "$1" \
            '{gremlin:$gremlin,bindings:{},language:"gremlin-groovy",aliases:{graph:"DEFAULT-hugegraph",g:"__g_DEFAULT-hugegraph"}}')"
          curl --fail-with-body -sS --max-time 30 --user "admin:$HUGEGRAPH_ADMIN_PASSWORD" \
            -H 'Content-Type: application/json' --data-binary "$payload" http://127.0.0.1:8080/gremlin \
            | tee /tmp/hg-ci-switch-query.json
          jq -e '.status.code == 200' /tmp/hg-ci-switch-query.json >/dev/null
        }

        # The preceding example/schema/index/CRUD checks ran on stock RocksDB.
        # Close those databases normally before changing only the image selection.
        stop_normally
        pd_volume="$(data_volume hg-pd /hugegraph-pd/pd_data)"
        store_volume="$(data_volume hg-store /hugegraph-store/storage)"
        test -n "$pd_volume" && test -n "$store_volume"
        # Inspect after normal shutdown. Store must have business-partition SSTs,
        # not only its metadata files; PD's SSTs contain the cluster metadata.
        for component in pd store; do
          if [ "$component" = pd ]; then
            volume="$pd_volume"; image="$STANDARD_PD_IMAGE"; sst_root=/data
          else
            volume="$store_volume"; image="$STANDARD_STORE_IMAGE"; sst_root=/data/db
          fi
          docker run --pull=never --rm --entrypoint bash \
            --mount "type=volume,src=$volume,dst=/data,readonly" "$image" \
            -euc 'find "$1" -type f -name "*.sst" -printf "%s %p\n";
                   find "$1" -type f -name "*.sst" -print -quit | grep -q .' -- "$sst_root"
        done
        # Omitting the seed-image override selects the Topling candidates. Compose
        # recreates changed containers and retains the same named data/WAL volumes.
        docker compose -p hg-ci-precheck "${compose_args[@]}" up -d --no-build --wait --wait-timeout "$WAIT_TIMEOUT_SEC"
        test "$(data_volume hg-pd /hugegraph-pd/pd_data)" = "$pd_volume"
        test "$(data_volume hg-store /hugegraph-store/storage)" = "$store_volume"
        for component in pd store; do
          docker exec "hg-$component" bash -euc '
            cd "/hugegraph-$1/topling"
            sha256sum -c easy-migrate.sha256
            test "$(sha256sum rocksdbjni.jar | cut -d " " -f1)" = "${2,,}"
            pid=$(pgrep -o -x java)
            grep -F "/hugegraph-$1/topling/librocksdbjni-linux64.so" "/proc/$pid/maps"
          ' -- "$component" "$TOPLING_JNI_SHA256"
        done
        docker exec hg-server bash -euc '
          test ! -d /hugegraph-server/topling
          grep -Eq "^backend[[:space:]]*=[[:space:]]*hstore" /hugegraph-server/conf/graphs/hugegraph.properties
        '
        gremlin_request "[[vertices:g.V().count().next(),edges:g.E().count().next(),names:g.V().values('name').order().toList(),beijing:g.V().has('person','city','Beijing').values('name').order().toList(),created:g.V().has('person','name','marko').out('created').values('name').toList()]]"
        jq -e '.result.data[0] | .vertices == 6 and .edges == 6 and .names == ["josh","lop","marko","peter","ripple","vadas"] and .beijing == ["josh","marko"] and .created == ["lop"]' /tmp/hg-ci-switch-query.json

        # Continue normal graph and index writes using the previously created schema.
        gremlin_request "ci=graph.addVertex(T.label,'person','name','ci_after_switch','age',42,'city','Topling');g.V().has('person','name','marko').next().addEdge('knows',ci,'date','ci','weight',0.2d);graph.tx().commit();g.V().has('person','city','Topling').values('age').next()"
        jq -e '.result.data == [42]' /tmp/hg-ci-switch-query.json
        gremlin_request "g.V().has('person','name','ci_after_switch').property('age',43).iterate();graph.tx().commit();g.V().has('person','city','Topling').values('age').next()"
        jq -e '.result.data == [43]' /tmp/hg-ci-switch-query.json
        stop_normally
        docker compose -p hg-ci-precheck "${compose_args[@]}" up -d --no-build --wait --wait-timeout "$WAIT_TIMEOUT_SEC"
        gremlin_request "[[vertices:g.V().count().next(),edges:g.E().count().next(),age:g.V().has('person','city','Topling').values('age').next()]]"
        jq -e '.result.data[0] | .vertices == 7 and .edges == 7 and .age == 43' /tmp/hg-ci-switch-query.json
        gremlin_request "ci=g.V().has('person','name','ci_after_switch').next();g.V(ci).bothE().drop().iterate();g.V(ci).drop().iterate();graph.tx().commit();[[vertices:g.V().count().next(),edges:g.E().count().next()]]"
        jq -e '.result.data[0] | .vertices == 6 and .edges == 6' /tmp/hg-ci-switch-query.json
        echo 'Stock RocksDB SSTs reopened with Topling; schema, indexes, CRUD and restart persistence passed'

    - name: Dump compose logs on failure
      if: ${{ failure() && inputs.strict_mode }}
      run: |
        if [ -n "${COMPOSE_FILE:-}" ] && [ -f /tmp/docker-compose.ci.override.yml ]; then
          compose_args=(-f "$COMPOSE_FILE")
          if [ -n "${COMPOSE_DEV_FILE:-}" ]; then
            compose_args+=(-f "$COMPOSE_DEV_FILE")
          fi
          docker compose -p hg-ci-precheck "${compose_args[@]}" \
            -f /tmp/docker-compose.ci.override.yml ps || true
          docker compose -p hg-ci-precheck "${compose_args[@]}" \
            -f /tmp/docker-compose.ci.override.yml logs --no-color --tail=200 || true
        else
          echo "Compose stack was not started; COMPOSE_FILE or CI override is unavailable"
        fi
        docker stats --no-stream hg-pd hg-store hg-server || true
        for container in hg-pd hg-store hg-server; do
          docker inspect --format '{{json .State.Health}}' "$container" || true
        done
        for artifact in /tmp/hg-ci-example-import.log /tmp/hg-ci-gremlin-*.json; do
          if [ -f "$artifact" ]; then
            echo "===== ${artifact} ====="
            cat "$artifact"
          fi
        done

    - name: Stop compose stack
      if: ${{ always() }}
      run: |
        set -euo pipefail

        if [ -n "${COMPOSE_FILE:-}" ] && [ -f /tmp/docker-compose.ci.override.yml ]; then
          compose_args=(-f "$COMPOSE_FILE")
          if [ -n "${COMPOSE_DEV_FILE:-}" ]; then
            compose_args+=(-f "$COMPOSE_DEV_FILE")
          fi
          docker compose \
            -p hg-ci-precheck \
            "${compose_args[@]}" \
            -f /tmp/docker-compose.ci.override.yml \
            down -v --remove-orphans
        else
          echo "Compose stack was not started; skipping compose down"
        fi

        leftover_containers="$(docker ps -aq --filter label=com.docker.compose.project=hg-ci-precheck)"
        leftover_networks="$(docker network ls -q --filter label=com.docker.compose.project=hg-ci-precheck)"
        leftover_volumes="$(docker volume ls -q --filter label=com.docker.compose.project=hg-ci-precheck)"
        if [ -n "$leftover_containers$leftover_networks$leftover_volumes" ]; then
          echo "Compose cleanup left resources behind"
          docker ps -a --filter label=com.docker.compose.project=hg-ci-precheck
          docker network ls --filter label=com.docker.compose.project=hg-ci-precheck
          docker volume ls --filter label=com.docker.compose.project=hg-ci-precheck
          exit 1
        fi
        echo "Compose cleanup removed all project containers, networks, and volumes"

    - name: Smoke test standalone Server candidate
      if: ${{ success() }}
      run: |
        set -euo pipefail
        wait_standalone() {
          for attempt in $(seq 1 60); do
            if curl -fsS --connect-timeout 3 --max-time 8 http://127.0.0.1:18080/versions >/dev/null; then
              return 0
            fi
            if ! docker inspect --format '{{.State.Running}}' hg-ci-standalone | grep -qx true; then
              break
            fi
            sleep 2
          done
          docker logs hg-ci-standalone
          return 1
        }
        standalone_query() {
          local payload
          payload="$(jq -nc --arg gremlin "$1" \
            '{gremlin:$gremlin,bindings:{},language:"gremlin-groovy",aliases:{graph:"DEFAULT-hugegraph",g:"__g_DEFAULT-hugegraph"}}')"
          curl --fail-with-body -sS --max-time 30 -H 'Content-Type: application/json' \
            --data-binary "$payload" http://127.0.0.1:18080/gremlin \
            | tee /tmp/hg-ci-standalone-query.json
          jq -e '.status.code == 200' /tmp/hg-ci-standalone-query.json >/dev/null
        }
        verify_payloads() {
          standalone_query "samples=[0,31,63].collect{i->b=new byte[49152];new java.util.Random(4200L+i).nextBytes(b);expected=java.util.Base64.getEncoder().encodeToString(b);actual=g.V().has('ci_payload','ci_age',i).values('ci_payload').next();[key:i,matches:actual==expected,length:actual.length()]};[[count:g.V().hasLabel('ci_payload').count().next(),samples:samples]]"
          jq -e '.result.data[0] | .count == 64 and (.samples | length) == 3 and all(.samples[]; .matches and .length == 65536)' /tmp/hg-ci-standalone-query.json
        }
        stop_standalone_normally() {
          docker stop -t 60 hg-ci-standalone
          test "$(docker inspect --format '{{.State.OOMKilled}}' hg-ci-standalone)" = false
          case "$(docker inspect --format '{{.State.ExitCode}}' hg-ci-standalone)" in
            0|143) ;; *) echo "Standalone Server did not stop normally"; exit 1 ;;
          esac
        }
        run_args=(--pull=never -d --name=hg-ci-standalone -p 18080:8080
          -e JAVA_OPTS='-Xms256m -Xmx512m -XX:ActiveProcessorCount=4')
        seed_image="$STANDALONE_IMAGE"
        if [ "$RUNTIME_VARIANT" = topling ]; then
          STANDALONE_DATA_VOLUME="hg-ci-standalone-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$STANDALONE_DATA_VOLUME"
          echo "STANDALONE_DATA_VOLUME=$STANDALONE_DATA_VOLUME" >> "$GITHUB_ENV"
          run_args+=(--mount "type=volume,src=$STANDALONE_DATA_VOLUME,dst=/hugegraph-server/rocksdb-data")
          seed_image="$STANDARD_STANDALONE_IMAGE"
        fi
        if [ "$RUNTIME_VARIANT" = topling ]; then
          # Fixture-only configuration lives in the seed container's writable
          # layer. Published images and the Topling candidate retain their defaults.
          docker run "${run_args[@]}" "$seed_image" bash -euc '
            sed -Ei "/^[[:space:]]*rocksdb[.](write_buffer_size|min_write_buffer_number_to_merge)[[:space:]]*=/d" conf/graphs/hugegraph.properties
            printf "rocksdb.write_buffer_size=1048576\nrocksdb.min_write_buffer_number_to_merge=1\n" >> conf/graphs/hugegraph.properties
            exec ./docker-entrypoint.sh
          '
        else
          docker run "${run_args[@]}" "$seed_image"
        fi
        wait_standalone
        if [ "$RUNTIME_VARIANT" = "topling" ]; then
          docker exec hg-ci-standalone bash -euc '
            test ! -d /hugegraph-server/topling
            pid=$(pgrep -o -x java)
            grep -F librocksdbjni "/proc/$pid/maps"
            ! grep -F /topling/ "/proc/$pid/maps"
          '
          standalone_query "s=graph.schema();s.propertyKey('ci_name').asText().ifNotExist().create();s.propertyKey('ci_age').asInt().ifNotExist().create();s.vertexLabel('ci_person').properties('ci_name','ci_age').primaryKeys('ci_name').ifNotExist().create();s.indexLabel('ci_personByAge').onV('ci_person').by('ci_age').range().ifNotExist().create();s.edgeLabel('ci_knows').sourceLabel('ci_person').targetLabel('ci_person').ifNotExist().create();a=graph.addVertex(T.label,'ci_person','ci_name','alice','ci_age',40);b=graph.addVertex(T.label,'ci_person','ci_name','bob','ci_age',41);a.addEdge('ci_knows',b);graph.tx().commit();g.V().hasLabel('ci_person').count().next()"
          jq -e '.result.data == [2]' /tmp/hg-ci-standalone-query.json
          standalone_query "s=graph.schema();s.propertyKey('ci_payload').asText().ifNotExist().create();s.vertexLabel('ci_payload').properties('ci_age','ci_payload').primaryKeys('ci_age').ifNotExist().create();'payload_schema_ready'"
          # Four MiB of random text crosses the seed's one-MiB vertex memtable
          # several times. Samples cover early SST-backed and later WAL-backed data.
          for batch in 0 1 2 3; do
            first=$((batch * 16))
            last=$((first + 16))
            standalone_query "($first..<$last).each{i->b=new byte[49152];new java.util.Random(4200L+i).nextBytes(b);graph.addVertex(T.label,'ci_payload','ci_age',i,'ci_payload',java.util.Base64.getEncoder().encodeToString(b))};graph.tx().commit();g.V().hasLabel('ci_payload').count().next()"
            jq -e --argjson count "$last" '.result.data == [$count]' /tmp/hg-ci-standalone-query.json
          done
          verify_payloads
          stop_standalone_normally
          docker run --pull=never --rm --entrypoint bash \
            --mount "type=volume,src=$STANDALONE_DATA_VOLUME,dst=/data,readonly" "$seed_image" \
            -euc 'find /data/data/g -type f -name "*.sst" -printf "%s %p\n";
                   find /data/data/g -type f -name "*.sst" -size +256k -print -quit | grep -q .'
          docker rm hg-ci-standalone
          docker run "${run_args[@]}" "$STANDALONE_IMAGE"
          wait_standalone
          docker exec hg-ci-standalone bash -euc '
            cd /hugegraph-server/topling
            sha256sum -c easy-migrate.sha256
            test "$(sha256sum rocksdbjni.jar | cut -d " " -f1)" = "${1,,}"
            pid=$(pgrep -o -x java)
            grep -F /hugegraph-server/topling/librocksdbjni-linux64.so "/proc/$pid/maps"
          ' -- "$TOPLING_JNI_SHA256"
          standalone_query "[[vertices:g.V().hasLabel('ci_person').count().next(),edges:g.E().hasLabel('ci_knows').count().next(),ages:g.V().has('ci_person','ci_age',P.gte(40)).values('ci_age').order().toList()]]"
          jq -e '.result.data[0] | .vertices == 2 and .edges == 1 and .ages == [40,41]' /tmp/hg-ci-standalone-query.json
          verify_payloads
          standalone_query "g.V().has('ci_person','ci_name','alice').property('ci_age',42).iterate();graph.tx().commit();g.V().has('ci_person','ci_name','alice').values('ci_age').next()"
          jq -e '.result.data == [42]' /tmp/hg-ci-standalone-query.json
          standalone_query "c=graph.addVertex(T.label,'ci_person','ci_name','charlie','ci_age',43);g.V().has('ci_person','ci_name','alice').next().addEdge('ci_knows',c);graph.tx().commit();g.V().has('ci_person','ci_age',P.gte(42)).count().next()"
          jq -e '.result.data == [2]' /tmp/hg-ci-standalone-query.json
          stop_standalone_normally
          docker start hg-ci-standalone
          wait_standalone
          standalone_query "[[age:g.V().has('ci_person','ci_name','alice').values('ci_age').next(),vertices:g.V().hasLabel('ci_person').count().next(),edges:g.E().hasLabel('ci_knows').count().next(),indexed:g.V().has('ci_person','ci_age',P.gte(42)).count().next()]]"
          jq -e '.result.data[0] | .age == 42 and .vertices == 3 and .edges == 2 and .indexed == 2' /tmp/hg-ci-standalone-query.json
          verify_payloads
          standalone_query "g.V().hasLabel('ci_person').drop().iterate();graph.tx().commit();g.V().hasLabel('ci_person').count().next()"
          jq -e '.result.data == [0]' /tmp/hg-ci-standalone-query.json
          standalone_query "g.V().hasLabel('ci_payload').drop().iterate();graph.tx().commit();g.V().hasLabel('ci_payload').count().next()"
          jq -e '.result.data == [0]' /tmp/hg-ci-standalone-query.json
          echo 'Standalone stock RocksDB SSTs reopened with Topling; schema, index, CRUD and restart persistence passed'
        fi

    - name: Dump standalone logs on failure
      if: ${{ failure() }}
      run: docker logs --tail=200 hg-ci-standalone || true

    - name: Push tested multi-platform candidates
      if: ${{ success() && needs.prepare.outputs.publish_images == 'true' }}
      run: |
        set -euo pipefail
        : > /tmp/hg-ci-published-images.tsv
        for image in "$PD_IMAGE" "$STORE_IMAGE" "$HSTORE_IMAGE" "$STANDALONE_IMAGE"; do
          tested_id="$(docker image inspect --platform linux/amd64 --format '{{.Id}}' "$image")"
          push_log="$(mktemp /tmp/hg-ci-push.XXXXXX)"
          pushed="false"
          for attempt in 1 2 3; do
            echo "Pushing tested multi-platform candidate ${image} (attempt ${attempt}/3)"
            if docker push "$image" 2>&1 | tee "$push_log"; then
              pushed="true"
              break
            fi
            sleep $((attempt * 5))
          done
          if [ "$pushed" != "true" ]; then
            echo "Failed to push ${image} after 3 attempts"
            exit 1
          fi
          if [ "$RUNTIME_VARIANT" = "topling" ]; then
            digest="$(sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}).*$/\1/p' "$push_log" | tail -1)"
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Push did not return a manifest digest for $image"
              exit 1
            fi
            printf '%s\t%s\t%s\n' "$image" "$tested_id" "$digest" >> /tmp/hg-ci-published-images.tsv
          fi
          rm "$push_log"
        done

    - name: Pull and verify published Topling digests
      if: ${{ success() && inputs.runtime_variant == 'topling' && needs.prepare.outputs.publish_images == 'true' }}
      run: |
        set -euo pipefail
        test "$(wc -l < /tmp/hg-ci-published-images.tsv)" -eq 4
        {
          echo
          echo "## Published Topling images"
          echo
          echo '| Tested tag | Pulled immutable reference |'
          echo '| --- | --- |'
        } >> "$GITHUB_STEP_SUMMARY"
        while IFS=$'\t' read -r image tested_id digest; do
          digest_ref="${image%:*}@${digest}"
          pulled=false
          for attempt in 1 2 3; do
            if docker pull --platform linux/amd64 "$digest_ref"; then
              pulled=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          if [ "$pulled" != true ]; then
            echo "Unable to pull published digest: $digest_ref"
            exit 1
          fi
          docker image inspect --platform linux/amd64 "$digest_ref" > /tmp/hg-ci-pulled-image.json
          runtime=topling
          if [ "$image" = "$HSTORE_IMAGE" ]; then runtime=hstore; fi
          jq -e --arg id "$tested_id" --arg source "$SOURCE_URL" \
            --arg revision "$SOURCE_SHA" --arg runtime "$runtime" '
            .[0] | .Id == $id and .Os == "linux" and .Architecture == "amd64" and
            .Config.Labels["org.opencontainers.image.source"] == $source and
            .Config.Labels["org.opencontainers.image.revision"] == $revision and
            .Config.Labels["org.apache.hugegraph.rocksdb-runtime"] == $runtime
          ' /tmp/hg-ci-pulled-image.json
          repo_digest="$(jq -er --arg digest "@$digest" \
            '.[0].RepoDigests | map(select(endswith($digest))) | first' /tmp/hg-ci-pulled-image.json)"
          printf '| `%s` | `%s` |\n' "$image" "$repo_digest" >> "$GITHUB_STEP_SUMMARY"
        done < /tmp/hg-ci-published-images.tsv

    - name: Cleanup standalone container
      if: ${{ always() }}
      run: |
        docker rm -f -v hg-ci-standalone >/dev/null 2>&1 || true
        if [ -n "${STANDALONE_DATA_VOLUME:-}" ]; then
          docker volume rm "$STANDALONE_DATA_VOLUME"
        fi

    - name: Post-check cleanup
      if: ${{ always() }}
      run: |
        docker system prune -af || true
        docker builder prune -af || true

  update_latest_hash:
    needs: [prepare, build_test_publish_multiarch]
    if: ${{ inputs.mode == 'latest' && needs.prepare.outputs.hash_gate_applied == 'true' && needs.prepare.outputs.need_update == 'true' && needs.prepare.outputs.publish_images == 'true' && needs.build_test_publish_multiarch.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - name: Validate hash update inputs
      env:
        LAST_HASH_NAME: ${{ inputs.last_hash_name }}
        PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      run: |
        set -euo pipefail
        if [ -z "$LAST_HASH_NAME" ]; then
          echo "last_hash_name is required when enable_hash_gate=true"
          exit 1
        fi
        if [ -z "$PERSONAL_ACCESS_TOKEN" ]; then
          echo "PERSONAL_ACCESS_TOKEN is required to update latest hash"
          exit 1
        fi

    - name: Update latest source hash variable
      env:
        OWNER: ${{ inputs.hash_repo_owner }}
        REPO: ${{ inputs.hash_repo_name }}
        LAST_HASH_NAME: ${{ inputs.last_hash_name }}
        SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      run: |
        set -euo pipefail
        curl --fail-with-body -sS -L -X PATCH \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          -H "Authorization: Bearer $PERSONAL_ACCESS_TOKEN" \
          "https://api.github.com/repos/$OWNER/$REPO/actions/variables/$LAST_HASH_NAME" \
          -d '{"name":"'"$LAST_HASH_NAME"'","value":"'"$SOURCE_SHA"'"}'
