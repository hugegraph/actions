name: "Publish pd-store-server image (reusable)"

on:
  workflow_call:
    inputs:
      mode:
        description: "publish mode: latest or release"
        required: true
        type: string
      repository_url:
        description: "source repository in owner/name format"
        required: false
        default: apache/hugegraph
        type: string
      branch:
        description: "source branch name"
        required: true
        type: string
      mvn_args:
        description: "mvn build args"
        required: false
        default: ''
        type: string
      strict_mode:
        description: "whether integration precheck is mandatory before publish"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "build and validate every architecture without publishing"
        required: false
        default: false
        type: boolean
      wait_timeout_sec:
        description: "docker compose wait timeout in seconds"
        required: false
        default: '300'
        type: string
      enable_hash_gate:
        description: "whether to skip latest publish if source hash unchanged"
        required: false
        default: false
        type: boolean
      last_hash_value:
        description: "last published source hash"
        required: false
        default: ''
        type: string
      last_hash_name:
        description: "repo variable name for latest hash"
        required: false
        default: ''
        type: string
      hash_repo_owner:
        description: "owner of repo storing LAST_* hash variable"
        required: false
        default: hugegraph
        type: string
      hash_repo_name:
        description: "repo name storing LAST_* hash variable"
        required: false
        default: actions
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_PASSWORD:
        required: true
      PERSONAL_ACCESS_TOKEN:
        required: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      need_update: ${{ steps.prepare.outputs.need_update }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      version_tag: ${{ steps.prepare.outputs.version_tag }}
      cache_channel: ${{ steps.prepare.outputs.cache_channel }}
      publish_images: ${{ steps.prepare.outputs.publish_images }}
      build_matrix_json: ${{ steps.prepare.outputs.build_matrix_json }}
    steps:
    - name: Resolve mode and source ref
      id: prepare
      env:
        MODE: ${{ inputs.mode }}
        REPOSITORY_URL: ${{ inputs.repository_url }}
        BRANCH: ${{ inputs.branch }}
        ENABLE_HASH_GATE: ${{ inputs.enable_hash_gate }}
        LAST_HASH_VALUE: ${{ inputs.last_hash_value }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        set -euo pipefail

        if [ "$MODE" != "latest" ] && [ "$MODE" != "release" ]; then
          echo "Invalid mode: $MODE. Expected latest or release."
          exit 1
        fi
        if [ "$MODE" = "release" ] && [ "$DRY_RUN" = "true" ]; then
          echo "dry_run is only supported by latest mode"
          exit 1
        fi

        source_sha="$(git ls-remote "https://github.com/${REPOSITORY_URL}.git" "refs/heads/${BRANCH}" | awk '{print $1}')"
        if [ -z "$source_sha" ]; then
          echo "Failed to resolve source SHA for ${REPOSITORY_URL}@${BRANCH}"
          exit 1
        fi

        if [ "$MODE" = "latest" ]; then
          if [ "$BRANCH" = "master" ]; then
            version_tag="latest"
            if [ "$DRY_RUN" = "true" ]; then
              publish_images="false"
            else
              publish_images="true"
            fi
          else
            safe_branch="$(
              printf '%s' "$BRANCH" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//' \
              | cut -c1-110
            )"
            if [ -z "$safe_branch" ]; then
              echo "Failed to derive an image tag from branch: $BRANCH"
              exit 1
            fi
            version_tag="branch-${safe_branch}"
            publish_images="false"
          fi
          cache_channel="latest"
          need_update="true"
          if [ "$DRY_RUN" != "true" ] && [ "$ENABLE_HASH_GATE" = "true" ] && [ "$source_sha" = "$LAST_HASH_VALUE" ]; then
            need_update="false"
          fi
        else
          version_tag="$(echo "$BRANCH" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          if [ -z "$version_tag" ]; then
            echo "Branch name does not contain a valid version number (x.x.x): $BRANCH"
            exit 1
          fi
          need_update="true"
          cache_channel="release"
          publish_images="true"
        fi

        {
          echo "source_sha=$source_sha"
          echo "version_tag=$version_tag"
          echo "cache_channel=$cache_channel"
          echo "publish_images=$publish_images"
          echo "need_update=$need_update"
          echo "build_matrix_json<<EOF"
          cat <<'JSON'
          [
            {
              "module": "pd",
              "image_repo": "hugegraph/pd",
              "dockerfile": "./hugegraph-pd/Dockerfile",
              "smoke_test": false
            },
            {
              "module": "store",
              "image_repo": "hugegraph/store",
              "dockerfile": "./hugegraph-store/Dockerfile",
              "smoke_test": false
            },
            {
              "module": "server-hstore",
              "image_repo": "hugegraph/server",
              "dockerfile": "./hugegraph-server/Dockerfile-hstore",
              "smoke_test": false
            },
            {
              "module": "server-standalone",
              "image_repo": "hugegraph/hugegraph",
              "dockerfile": "./hugegraph-server/Dockerfile",
              "smoke_test": true
            }
          ]
        JSON
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Summarize build cache strategy
      env:
        CACHE_CHANNEL: ${{ steps.prepare.outputs.cache_channel }}
        PUBLISH_IMAGES: ${{ steps.prepare.outputs.publish_images }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        {
          echo "## PD / Store / Server image build"
          echo
          echo "- Cache backend: Docker Hub registry (BuildKit, mode=max)"
          echo "- Cache channel: \`$CACHE_CHANNEL\`"
          echo "- Publish images: \`$PUBLISH_IMAGES\`"
          echo "- Dry run: \`$DRY_RUN\`"
          if [ "$PUBLISH_IMAGES" = "true" ]; then
            echo "- Cache writers: amd64 candidate and native arm64 jobs"
          else
            echo "- Cache policy: read-only validation (no registry exports)"
          fi
          echo "- ARM builder: native \`ubuntu-24.04-arm\` (no QEMU)"
          echo "- amd64 caches: \`buildcache-$CACHE_CHANNEL\`"
          echo "- arm64 caches: \`buildcache-arm64-$CACHE_CHANNEL\`"
        } >> "$GITHUB_STEP_SUMMARY"

  build_test_publish_amd64:
    needs: prepare
    if: ${{ needs.prepare.outputs.need_update == 'true' }}
    runs-on: ubuntu-latest
    env:
      REPOSITORY_URL: ${{ inputs.repository_url }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      MVN_ARGS: ${{ inputs.mvn_args }}
      WAIT_TIMEOUT_SEC: ${{ inputs.wait_timeout_sec }}
      VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
      PD_IMAGE: hugegraph/pd:${{ needs.prepare.outputs.version_tag }}-amd64
      STORE_IMAGE: hugegraph/store:${{ needs.prepare.outputs.version_tag }}-amd64
      HSTORE_IMAGE: hugegraph/server:${{ needs.prepare.outputs.version_tag }}-amd64
      STANDALONE_IMAGE: hugegraph/hugegraph:${{ needs.prepare.outputs.version_tag }}-amd64
    steps:
    - name: Validate wait timeout
      run: |
        if ! [[ "$WAIT_TIMEOUT_SEC" =~ ^[0-9]+$ ]] || [ "$WAIT_TIMEOUT_SEC" -lt 30 ] || [ "$WAIT_TIMEOUT_SEC" -gt 1800 ]; then
          echo "Invalid wait_timeout_sec: $WAIT_TIMEOUT_SEC. Expected integer between 30 and 1800."
          exit 1
        fi

    - name: Checkout source
      uses: actions/checkout@v7
      with:
        repository: ${{ env.REPOSITORY_URL }}
        ref: ${{ env.SOURCE_SHA }}
        fetch-depth: 2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        version: latest

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Precheck cleanup
      run: |
        docker system prune -af || true
        docker builder prune -af || true

    - name: Build x86 PD image for integration check
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./hugegraph-pd/Dockerfile
        platforms: linux/amd64
        load: true
        tags: ${{ env.PD_IMAGE }}
        cache-from: type=registry,ref=hugegraph/pd:buildcache-${{ needs.prepare.outputs.cache_channel }}
        cache-to: ${{ needs.prepare.outputs.publish_images == 'true' && format('type=registry,ref=hugegraph/pd:buildcache-{0},mode=max', needs.prepare.outputs.cache_channel) || '' }}
        build-args: ${{ env.MVN_ARGS }}

    - name: Build x86 Store image for integration check
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./hugegraph-store/Dockerfile
        platforms: linux/amd64
        load: true
        tags: ${{ env.STORE_IMAGE }}
        cache-from: type=registry,ref=hugegraph/store:buildcache-${{ needs.prepare.outputs.cache_channel }}
        cache-to: ${{ needs.prepare.outputs.publish_images == 'true' && format('type=registry,ref=hugegraph/store:buildcache-{0},mode=max', needs.prepare.outputs.cache_channel) || '' }}
        build-args: ${{ env.MVN_ARGS }}

    - name: Build x86 Server(hstore) image for integration check
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./hugegraph-server/Dockerfile-hstore
        platforms: linux/amd64
        load: true
        tags: ${{ env.HSTORE_IMAGE }}
        cache-from: type=registry,ref=hugegraph/server:buildcache-${{ needs.prepare.outputs.cache_channel }}
        cache-to: ${{ needs.prepare.outputs.publish_images == 'true' && format('type=registry,ref=hugegraph/server:buildcache-{0},mode=max', needs.prepare.outputs.cache_channel) || '' }}
        build-args: ${{ env.MVN_ARGS }}

    - name: Build x86 standalone Server candidate
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./hugegraph-server/Dockerfile
        platforms: linux/amd64
        load: true
        tags: ${{ env.STANDALONE_IMAGE }}
        cache-from: type=registry,ref=hugegraph/hugegraph:buildcache-${{ needs.prepare.outputs.cache_channel }}
        cache-to: ${{ needs.prepare.outputs.publish_images == 'true' && format('type=registry,ref=hugegraph/hugegraph:buildcache-{0},mode=max', needs.prepare.outputs.cache_channel) || '' }}
        build-args: ${{ env.MVN_ARGS }}

    - name: Start compose stack with local images
      if: ${{ inputs.strict_mode }}
      run: |
        if [ -f "docker/docker-compose.dev.yml" ]; then
          compose_file="docker/docker-compose.dev.yml"
        elif [ -f "docker/docker-compose.yml" ]; then
          compose_file="docker/docker-compose.yml"
          echo "WARN: docker/docker-compose.dev.yml is unavailable; using legacy docker/docker-compose.yml"
        else
          echo "ERROR: no supported compose file found in $REPOSITORY_URL@$SOURCE_SHA"
          echo "Expected docker/docker-compose.dev.yml or docker/docker-compose.yml."
          exit 1
        fi
        echo "COMPOSE_FILE=$compose_file" >> "$GITHUB_ENV"

        cat > /tmp/hg-ci-patch-server-config.sh <<'PATCH_SERVER'
        #!/usr/bin/env bash
        set -euo pipefail

        set_property() {
          local file="$1" key="$2" value="$3" escaped
          escaped=${key//./\.}
          if grep -qE "^[[:space:]]*${escaped}[[:space:]]*=" "$file"; then
            sed -E -i "s|^[[:space:]]*${escaped}[[:space:]]*=.*|${key}=${value}|" "$file"
          else
            printf '%s=%s\n' "$key" "$value" >> "$file"
          fi
        }

        set_yaml_scalar() {
          local file="$1" key="$2" value="$3"
          if grep -qE "^[[:space:]]*${key}:" "$file"; then
            sed -E -i "s|^([[:space:]]*)${key}:.*|\1${key}: ${value}|" "$file"
          else
            printf '%s: %s\n' "$key" "$value" >> "$file"
          fi
        }

        set_property ./conf/rest-server.properties batch.max_write_threads 4
        set_property ./conf/rest-server.properties restserver.min_free_memory 32
        set_yaml_scalar ./conf/gremlin-server.yaml threadPoolWorker 4
        set_yaml_scalar ./conf/gremlin-server.yaml gremlinPool 4

        echo "Applied CI Server resource configuration"
        exec ./docker-entrypoint.sh
        PATCH_SERVER
        chmod 755 /tmp/hg-ci-patch-server-config.sh

        cat > /tmp/docker-compose.ci.override.yml <<COMPOSE_OVERRIDE
        services:
          pd:
            image: ${PD_IMAGE}
            container_name: hg-pd
            pull_policy: never
            mem_limit: 1024m
            cpus: 2.0
            environment:
              JAVA_OPTS: >-
                -Xms128m -Xmx128m
                -XX:ActiveProcessorCount=2
                -XX:MaxMetaspaceSize=192m
                -XX:MaxDirectMemorySize=128m
                -XX:+UseContainerSupport
                -Dlog4j2.asyncLoggerConfigRingBufferSize=8192
                -DAsyncLoggerConfig.RingBufferSize=8192
                -Dthread.pool.grpc.core=8
                -Dthread.pool.grpc.max=32
                -Dthread.pool.grpc.queue=512
                -Djob.interruptableThreadPool.core=1
                -Djob.interruptableThreadPool.max=8
                -Djob.interruptableThreadPool.queue=256
                -Djob.uninterruptibleThreadPool.core=0
                -Djob.uninterruptibleThreadPool.max=4
                -Djob.uninterruptibleThreadPool.queue=128
                -Dpartition.default-shard-count=1
                -Dpartition.store-max-shard-count=12
          store:
            image: ${STORE_IMAGE}
            container_name: hg-store
            pull_policy: never
            mem_limit: 1024m
            cpus: 2.0
            environment:
              JAVA_OPTS: >-
                -Xms128m -Xmx128m
                -XX:ActiveProcessorCount=2
                -XX:MaxMetaspaceSize=192m
                -XX:MaxDirectMemorySize=128m
                -XX:+UseContainerSupport
                -Dlog4j2.asyncLoggerConfigRingBufferSize=8192
                -DAsyncLoggerConfig.RingBufferSize=8192
                -Drocksdb.total_memory_size=134217728
                -Drocksdb.write_buffer_size=2097152
                -Drocksdb.min_write_buffer_number_to_merge=2
                -Dthread.pool.grpc.core=8
                -Dthread.pool.grpc.max=32
                -Dthread.pool.grpc.queue=512
                -Dthread.pool.scan.core=4
                -Dthread.pool.scan.max=16
                -Dthread.pool.scan.queue=256
                -Djob.interruptableThreadPool.core=2
                -Djob.interruptableThreadPool.max=8
                -Djob.interruptableThreadPool.queue=256
                -Djob.uninterruptibleThreadPool.core=0
                -Djob.uninterruptibleThreadPool.max=4
                -Djob.uninterruptibleThreadPool.queue=128
                -Dquery.push-down.threads=8
                -Dquery.push-down.fetch_batch=1000
                -Dquery.push-down.fetch_timeout=30000
                -Dquery.push-down.memory_limit_count=10000
                -Dquery.push-down.index_size_limit_count=10000
                -Draft.disruptorBufferSize=512
                -Draft.metrics=false
                -Draft.maxReplicatorInflightMsgs=32
                -Draft.maxEntriesSize=64
                -Draft.maxBodySize=262144
          server:
            image: ${HSTORE_IMAGE}
            container_name: hg-server
            pull_policy: never
            mem_limit: 1536m
            cpus: 4.0
            entrypoint:
              - /usr/bin/dumb-init
              - "--"
              - /opt/hg-ci/patch-server-config.sh
            environment:
              JAVA_OPTS: >-
                -Xms256m -Xmx384m
                -XX:ActiveProcessorCount=4
                -XX:MaxMetaspaceSize=256m
                -XX:MaxDirectMemorySize=128m
                -XX:+UseContainerSupport
                -Dlog4j2.asyncLoggerConfigRingBufferSize=8192
                -DAsyncLoggerConfig.RingBufferSize=8192
            volumes:
              - type: bind
                source: /tmp/hg-ci-patch-server-config.sh
                target: /opt/hg-ci/patch-server-config.sh
                read_only: true
        COMPOSE_OVERRIDE

        docker compose \
          -p hg-ci-precheck \
          -f "$compose_file" \
          -f /tmp/docker-compose.ci.override.yml \
          up -d --wait --wait-timeout "$WAIT_TIMEOUT_SEC"

        docker compose -p hg-ci-precheck -f "$compose_file" -f /tmp/docker-compose.ci.override.yml ps

    - name: Verify CI resource limits
      if: ${{ inputs.strict_mode }}
      run: |
        set -euo pipefail

        assert_memory_limit() {
          local container="$1" expected_bytes="$2" actual_bytes
          actual_bytes="$(docker inspect --format '{{.HostConfig.Memory}}' "$container")"
          if [ "$actual_bytes" != "$expected_bytes" ]; then
            echo "Unexpected memory limit for ${container}: expected ${expected_bytes}, got ${actual_bytes}"
            exit 1
          fi
          echo "${container} memory limit: ${actual_bytes} bytes"
        }

        assert_memory_limit hg-pd 1073741824
        assert_memory_limit hg-store 1073741824
        assert_memory_limit hg-server 1610612736

        for container in hg-pd hg-store hg-server; do
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$container" \
            | grep '^JAVA_OPTS='
          docker exec "$container" bash -lc "ps -eo args | grep '[j]ava'"
        done
        docker exec hg-server grep -E \
          '^(batch.max_write_threads|restserver.min_free_memory)=' \
          /hugegraph-server/conf/rest-server.properties
        docker exec hg-server grep -E \
          '^[[:space:]]*(threadPoolWorker|gremlinPool):' \
          /hugegraph-server/conf/gremlin-server.yaml

        docker stats --no-stream hg-pd hg-store hg-server

    - name: Verify integration endpoints
      if: ${{ inputs.strict_mode }}
      run: |
        curl -fsS --connect-timeout 3 --max-time 8 "http://127.0.0.1:8620/v1/health" >/dev/null
        curl -fsS --connect-timeout 3 --max-time 8 "http://127.0.0.1:8520/v1/health" >/dev/null
        curl -fsS --connect-timeout 3 --max-time 8 "http://127.0.0.1:8080/versions" >/dev/null

    - name: Import bundled example graph
      if: ${{ inputs.strict_mode }}
      run: |
        set -euo pipefail

        docker exec hg-server test -r /hugegraph-server/scripts/example.groovy
        docker exec hg-server bash -lc \
          'cd /hugegraph-server && bin/gremlin-console.sh -- -e scripts/example.groovy' \
          | tee /tmp/hg-ci-example-import.log

        grep -Fq '>>>> query all vertices: size=6' /tmp/hg-ci-example-import.log
        grep -Fq '>>>> query all edges: size=6' /tmp/hg-ci-example-import.log

    - name: Verify bundled graph with Gremlin CRUD
      if: ${{ inputs.strict_mode }}
      env:
        CI_VERTEX_NAME: hg-ci-${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        set -euo pipefail

        gremlin_request() {
          local label="$1" script="$2" payload response_file
          response_file="/tmp/hg-ci-gremlin-${label}.json"
          payload="$(
            jq -nc --arg gremlin "$script" \
              '{gremlin:$gremlin,bindings:{},language:"gremlin-groovy",aliases:{graph:"DEFAULT-hugegraph",g:"__g_DEFAULT-hugegraph"}}'
          )"
          curl --fail-with-body -sS \
            --compressed \
            --connect-timeout 3 \
            --max-time 30 \
            -H 'Content-Type: application/json' \
            --data-binary "$payload" \
            http://127.0.0.1:8080/gremlin \
            | tee "$response_file"
          jq -e '.status.code == 200' "$response_file" >/dev/null
        }

        baseline_script="[[vertices:g.V().count().next(),edges:g.E().count().next(),names:g.V().values('name').order().toList(),markoCreated:g.V().has('person','name','marko').out('created').values('name').order().toList()]]"
        gremlin_request baseline "$baseline_script"
        jq -e '
          .result.data[0].vertices == 6 and
          .result.data[0].edges == 6 and
          .result.data[0].names == ["josh","lop","marko","peter","ripple","vadas"] and
          .result.data[0].markoCreated == ["lop"]
        ' /tmp/hg-ci-gremlin-baseline.json >/dev/null

        create_script="ci=graph.addVertex(T.label,'person','name','${CI_VERTEX_NAME}','age',40,'city','CI');marko=g.V().has('person','name','marko').next();marko.addEdge('knows',ci,'date','ci','weight',0.1d);graph.tx().commit();'${CI_VERTEX_NAME}'"
        gremlin_request create "$create_script"
        jq -e --arg name "$CI_VERTEX_NAME" '.result.data == [$name]' \
          /tmp/hg-ci-gremlin-create.json >/dev/null

        read_created_script="[[vertices:g.V().count().next(),edges:g.E().count().next(),matches:g.V().has('person','name','marko').out('knows').has('name','${CI_VERTEX_NAME}').count().next()]]"
        gremlin_request read-created "$read_created_script"
        jq -e '
          .result.data[0].vertices == 7 and
          .result.data[0].edges == 7 and
          .result.data[0].matches == 1
        ' /tmp/hg-ci-gremlin-read-created.json >/dev/null

        update_script="g.V().has('person','name','${CI_VERTEX_NAME}').property('age',41).iterate();graph.tx().commit();g.V().has('person','name','${CI_VERTEX_NAME}').values('age').next()"
        gremlin_request update "$update_script"
        jq -e '.result.data == [41]' /tmp/hg-ci-gremlin-update.json >/dev/null

        delete_script="ci=g.V().has('person','name','${CI_VERTEX_NAME}').next();g.V(ci).bothE().drop().iterate();g.V(ci).drop().iterate();graph.tx().commit();[[vertices:g.V().count().next(),edges:g.E().count().next()]]"
        gremlin_request delete "$delete_script"
        jq -e '
          .result.data[0].vertices == 6 and
          .result.data[0].edges == 6
        ' /tmp/hg-ci-gremlin-delete.json >/dev/null

        gremlin_request final "$baseline_script"
        jq -e '
          .result.data[0].vertices == 6 and
          .result.data[0].edges == 6 and
          .result.data[0].names == ["josh","lop","marko","peter","ripple","vadas"]
        ' /tmp/hg-ci-gremlin-final.json >/dev/null

        docker stats --no-stream hg-pd hg-store hg-server

    - name: Dump compose logs on failure
      if: ${{ failure() && inputs.strict_mode }}
      run: |
        if [ -n "${COMPOSE_FILE:-}" ] && [ -f /tmp/docker-compose.ci.override.yml ]; then
          docker compose -p hg-ci-precheck -f "$COMPOSE_FILE" -f /tmp/docker-compose.ci.override.yml ps || true
          docker compose -p hg-ci-precheck -f "$COMPOSE_FILE" -f /tmp/docker-compose.ci.override.yml logs --no-color --tail=200 || true
        else
          echo "Compose stack was not started; COMPOSE_FILE or CI override is unavailable"
        fi
        docker stats --no-stream hg-pd hg-store hg-server || true
        for container in hg-pd hg-store hg-server; do
          docker inspect --format '{{json .State.Health}}' "$container" || true
        done
        for artifact in /tmp/hg-ci-example-import.log /tmp/hg-ci-gremlin-*.json; do
          if [ -f "$artifact" ]; then
            echo "===== ${artifact} ====="
            cat "$artifact"
          fi
        done

    - name: Stop compose stack
      if: ${{ always() }}
      run: |
        set -euo pipefail

        if [ -n "${COMPOSE_FILE:-}" ] && [ -f /tmp/docker-compose.ci.override.yml ]; then
          docker compose \
            -p hg-ci-precheck \
            -f "$COMPOSE_FILE" \
            -f /tmp/docker-compose.ci.override.yml \
            down -v --remove-orphans
        else
          echo "Compose stack was not started; skipping compose down"
        fi

        leftover_containers="$(docker ps -aq --filter label=com.docker.compose.project=hg-ci-precheck)"
        leftover_networks="$(docker network ls -q --filter label=com.docker.compose.project=hg-ci-precheck)"
        leftover_volumes="$(docker volume ls -q --filter label=com.docker.compose.project=hg-ci-precheck)"
        if [ -n "$leftover_containers$leftover_networks$leftover_volumes" ]; then
          echo "Compose cleanup left resources behind"
          docker ps -a --filter label=com.docker.compose.project=hg-ci-precheck
          docker network ls --filter label=com.docker.compose.project=hg-ci-precheck
          docker volume ls --filter label=com.docker.compose.project=hg-ci-precheck
          exit 1
        fi
        echo "Compose cleanup removed all project containers, networks, and volumes"

    - name: Smoke test standalone Server candidate
      if: ${{ success() }}
      run: |
        set -euo pipefail
        docker run -d --name=hg-ci-standalone -p 18080:8080 "$STANDALONE_IMAGE"
        for attempt in $(seq 1 30); do
          if curl -fsS --connect-timeout 3 --max-time 8 http://127.0.0.1:18080/versions >/dev/null; then
            echo "Standalone candidate is ready after attempt ${attempt}"
            exit 0
          fi
          if ! docker inspect --format '{{.State.Running}}' hg-ci-standalone | grep -qx true; then
            docker logs hg-ci-standalone
            exit 1
          fi
          sleep 2
        done
        docker logs hg-ci-standalone
        exit 1

    - name: Push tested amd64 candidates
      if: ${{ success() && needs.prepare.outputs.publish_images == 'true' }}
      run: |
        set -euo pipefail
        for image in "$PD_IMAGE" "$STORE_IMAGE" "$HSTORE_IMAGE" "$STANDALONE_IMAGE"; do
          image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          echo "Pushing tested candidate ${image} (${image_id})"
          docker push "$image"
        done

    - name: Cleanup standalone container
      if: ${{ always() }}
      run: docker rm -f hg-ci-standalone >/dev/null 2>&1 || true

    - name: Post-check cleanup
      if: ${{ always() }}
      run: |
        docker system prune -af || true
        docker builder prune -af || true

  publish_arm64:
    needs: [prepare, build_test_publish_amd64]
    if: ${{ needs.prepare.outputs.need_update == 'true' && needs.build_test_publish_amd64.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.build_matrix_json) }}
    env:
      REPOSITORY_URL: ${{ inputs.repository_url }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
      MVN_ARGS: ${{ inputs.mvn_args }}
      CACHE_CHANNEL: ${{ needs.prepare.outputs.cache_channel }}
    steps:
    - name: Resolve tags (${{ matrix.module }})
      id: tags
      env:
        IMAGE_REPO: ${{ matrix.image_repo }}
      run: |
        image_arm64="${IMAGE_REPO}:${VERSION_TAG}-arm64"
        module_cache_ref="${IMAGE_REPO}:buildcache-arm64-${CACHE_CHANNEL}"

        {
          echo "image_arm64=$image_arm64"
          echo "module_cache_ref=$module_cache_ref"
        } >> "$GITHUB_OUTPUT"

    - name: Checkout source (${{ matrix.module }})
      uses: actions/checkout@v7
      with:
        repository: ${{ env.REPOSITORY_URL }}
        ref: ${{ env.SOURCE_SHA }}
        fetch-depth: 2

    - name: Set up Docker Buildx (${{ matrix.module }})
      uses: docker/setup-buildx-action@v4
      with:
        version: latest

    - name: Login to Docker Hub (${{ matrix.module }})
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Build and push arm64 image (${{ matrix.module }})
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/arm64
        push: ${{ needs.prepare.outputs.publish_images == 'true' }}
        tags: ${{ steps.tags.outputs.image_arm64 }}
        cache-from: type=registry,ref=${{ steps.tags.outputs.module_cache_ref }}
        cache-to: ${{ needs.prepare.outputs.publish_images == 'true' && format('type=registry,ref={0},mode=max', steps.tags.outputs.module_cache_ref) || '' }}
        build-args: ${{ env.MVN_ARGS }}

  publish_manifest:
    needs: [prepare, build_test_publish_amd64, publish_arm64]
    if: ${{ needs.prepare.outputs.need_update == 'true' && needs.prepare.outputs.publish_images == 'true' && needs.build_test_publish_amd64.result == 'success' && needs.publish_arm64.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.build_matrix_json) }}
    env:
      VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
    steps:
    - name: Resolve tags (${{ matrix.module }})
      id: tags
      env:
        IMAGE_REPO: ${{ matrix.image_repo }}
      run: |
        image_final="${IMAGE_REPO}:${VERSION_TAG}"
        image_amd64="${IMAGE_REPO}:${VERSION_TAG}-amd64"
        image_arm64="${IMAGE_REPO}:${VERSION_TAG}-arm64"

        {
          echo "image_final=$image_final"
          echo "image_amd64=$image_amd64"
          echo "image_arm64=$image_arm64"
        } >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx (${{ matrix.module }})
      uses: docker/setup-buildx-action@v4
      with:
        version: latest

    - name: Login to Docker Hub (${{ matrix.module }})
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Create multi-arch manifest (${{ matrix.module }})
      run: |
        docker buildx imagetools create \
          --tag "${{ steps.tags.outputs.image_final }}" \
          "${{ steps.tags.outputs.image_amd64 }}" \
          "${{ steps.tags.outputs.image_arm64 }}"

    - name: Inspect multi-arch manifest (${{ matrix.module }})
      run: |
        docker buildx imagetools inspect "${{ steps.tags.outputs.image_final }}"

    - name: Delete temporary arch tags after manifest publish (${{ matrix.module }})
      continue-on-error: true
      env:
        IMAGE_REPO: ${{ matrix.image_repo }}
        VERSION_TAG: ${{ env.VERSION_TAG }}
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      run: |
        set -euo pipefail

        namespace="${IMAGE_REPO%%/*}"
        repository="${IMAGE_REPO#*/}"
        if [ "$namespace" = "$repository" ]; then
          echo "Invalid image repo format: $IMAGE_REPO"
          exit 1
        fi

        login_payload="$(jq -nc --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_PASSWORD" '{username:$u,password:$p}')"
        auth_token="$(
          printf '%s' "$login_payload" \
          | curl --fail-with-body -sS -X POST "https://hub.docker.com/v2/users/login/" \
              -H "Content-Type: application/json" \
              --data-binary @- \
          | jq -r '.token'
        )"
        if [ -z "$auth_token" ] || [ "$auth_token" = "null" ]; then
          echo "Failed to get Docker Hub auth token"
          exit 1
        fi

        delete_tag_with_retry() {
          local tag="$1"
          local attempt=1
          local max_attempts=5
          while [ "$attempt" -le "$max_attempts" ]; do
            if ! status_code="$(
              curl -sS -o /tmp/dockerhub-delete-response.txt -w "%{http_code}" -X DELETE \
                -H "Authorization: JWT $auth_token" \
                "https://hub.docker.com/v2/repositories/${namespace}/${repository}/tags/${tag}/"
            )"; then
              status_code="000"
              echo "Delete ${IMAGE_REPO}:${tag} failed to reach Docker Hub (curl error)"
            fi

            if [ "$status_code" = "204" ] || [ "$status_code" = "404" ]; then
              echo "Tag ${IMAGE_REPO}:${tag} delete status: $status_code"
              return 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Delete ${IMAGE_REPO}:${tag} failed with HTTP ${status_code}, retrying (${attempt}/${max_attempts})"
              sleep $((attempt * 5))
            fi
            attempt=$((attempt + 1))
          done

          echo "Delete ${IMAGE_REPO}:${tag} failed after ${max_attempts} attempts"
          cat /tmp/dockerhub-delete-response.txt || true
          return 1
        }

        cleanup_failures=0

        if ! delete_tag_with_retry "${VERSION_TAG}-amd64"; then
          echo "Warning: failed to delete ${IMAGE_REPO}:${VERSION_TAG}-amd64"
          cleanup_failures=1
        fi

        if ! delete_tag_with_retry "${VERSION_TAG}-arm64"; then
          echo "Warning: failed to delete ${IMAGE_REPO}:${VERSION_TAG}-arm64"
          cleanup_failures=1
        fi

        if [ "$cleanup_failures" -ne 0 ]; then
          echo "Temporary arch-tag cleanup completed with warnings"
          exit 1
        fi

  update_latest_hash:
    needs: [prepare, publish_manifest]
    if: ${{ inputs.mode == 'latest' && inputs.branch == 'master' && inputs.enable_hash_gate && needs.prepare.outputs.need_update == 'true' && needs.publish_manifest.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - name: Validate hash update inputs
      env:
        LAST_HASH_NAME: ${{ inputs.last_hash_name }}
        PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      run: |
        set -euo pipefail
        if [ -z "$LAST_HASH_NAME" ]; then
          echo "last_hash_name is required when enable_hash_gate=true"
          exit 1
        fi
        if [ -z "$PERSONAL_ACCESS_TOKEN" ]; then
          echo "PERSONAL_ACCESS_TOKEN is required to update latest hash"
          exit 1
        fi

    - name: Update latest source hash variable
      env:
        OWNER: ${{ inputs.hash_repo_owner }}
        REPO: ${{ inputs.hash_repo_name }}
        LAST_HASH_NAME: ${{ inputs.last_hash_name }}
        SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      run: |
        set -euo pipefail
        curl --fail-with-body -sS -L -X PATCH \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          -H "Authorization: Bearer $PERSONAL_ACCESS_TOKEN" \
          "https://api.github.com/repos/$OWNER/$REPO/actions/variables/$LAST_HASH_NAME" \
          -d '{"name":"'"$LAST_HASH_NAME"'","value":"'"$SOURCE_SHA"'"}'
