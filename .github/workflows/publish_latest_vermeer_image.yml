name: "Publish Vermeer Image(latest)"

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      source_repository:
        required: false
        default: 'apache/hugegraph-computer'
        description: 'source repository in owner/name format'
      source_ref:
        required: false
        default: 'master'
        description: 'source branch or tag; non-default refs run validation unless publish is enabled'
      image_tag:
        required: false
        default: ''
        description: 'image tag; empty keeps the latest tag'
      publish:
        type: boolean
        required: false
        default: false
        description: 'publish a non-default source ref'

jobs:
  publish:
    uses: ./.github/workflows/_publish_image_reusable.yml
    with:
      mode: latest
      component: vermeer
      source_repository: ${{ inputs.source_repository || 'apache/hugegraph-computer' }}
      source_ref: ${{ inputs.source_ref || 'master' }}
      image_tag: ${{ inputs.image_tag || '' }}
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish == true || (inputs.source_ref || 'master') == 'master' }}
      build_matrix_json: |
        [
          {
            "module": "vermeer",
            "context": "./vermeer",
            "dockerfile": "./vermeer/Dockerfile",
            "image_repo_latest": "hugegraph/vermeer",
            "image_repo_release": "hugegraph/vermeer",
            "registry_cache_image": "hugegraph/vermeer:buildcache-latest",
            "platforms_latest": "linux/amd64,linux/arm64",
            "platforms_release": "linux/amd64,linux/arm64",
            "smoke_test": false
          }
        ]
      enable_hash_gate: ${{ github.event_name != 'workflow_dispatch' || (inputs.source_ref || 'master') == 'master' }}
      last_hash_value: ${{ vars.LAST_VERMEER_HASH }}
      last_hash_name: LAST_VERMEER_HASH
      hash_repo_owner: hugegraph
      hash_repo_name: actions
    secrets: inherit
