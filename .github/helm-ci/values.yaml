# Disposable kind validation profile. Keep persistence enabled so CI exercises PVCs.
mode: easy
persistence:
  enabled: true
pd:
  replicas: 1
  javaOpts: "-Xms256m -Xmx512m"
  storage:
    enabled: true
    size: 1Gi
    storageClassName: standard
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
store:
  replicas: 1
  javaOpts: "-Xms256m -Xmx768m -Drocksdb.total_memory_size=268435456"
  storage:
    enabled: true
    size: 2Gi
    storageClassName: standard
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {cpu: "1", memory: 2Gi}
server:
  replicas: 1
  javaOpts: "-Xms256m -Xmx1g"
  auth:
    enabled: true
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {cpu: "1", memory: 2Gi}
hubble:
  enabled: false
